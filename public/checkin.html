<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000a10">
<title>JAZZIN — 受付</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<link rel="stylesheet" href="/ui/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body { background:#030810; overflow-x:hidden; }
.checkin-layout {
  display:flex; flex-direction:column; min-height:100dvh;
  max-width:480px; width:100%; margin:0 auto;
  position:relative; z-index:1;
}
@media (min-width:481px) {
  .checkin-layout { border-left:1px solid var(--border); border-right:1px solid var(--border); }
}

/* Camera */
.camera-zone { position:relative; width:100%; background:#000; flex-shrink:0; }
#reader { width:100%; }
#reader video { width:100% !important; }
.scan-overlay { position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center; }
.scan-frame {
  position:relative;
  width:52%; height:52%; max-width:220px; max-height:220px; aspect-ratio:1/1;
  border:1px solid rgba(255,255,255,0.2);
  border-radius:8px;
  box-shadow:0 0 0 9999px rgba(0,4,10,0.6);
}
.scan-frame::before, .scan-frame::after,
.scan-frame > span::before, .scan-frame > span::after {
  content:''; position:absolute; width:16px; height:16px;
  border-color:var(--accent-1); border-style:solid;
}
.scan-frame::before  { top:-1px;  left:-1px;  border-width:2px 0 0 2px; border-radius:2px 0 0 0; }
.scan-frame::after   { top:-1px;  right:-1px; border-width:2px 2px 0 0; border-radius:0 2px 0 0; }
.scan-frame > span::before { bottom:-1px; left:-1px;  border-width:0 0 2px 2px; border-radius:0 0 0 2px; }
.scan-frame > span::after  { bottom:-1px; right:-1px; border-width:0 2px 2px 0; border-radius:0 0 2px 0; }

.scan-line {
  position:absolute; left:5%; right:5%; height:1px;
  background:linear-gradient(90deg, transparent, var(--accent-1), transparent);
  animation:scanAnim 2s ease-in-out infinite;
  top:5%;
}
@keyframes scanAnim { 0%{top:5%} 50%{top:89%} 100%{top:5%} }
.scan-status {
  position:absolute; bottom:10px; left:0; right:0;
  text-align:center; font-size:0.7rem; font-weight:500;
  color:rgba(255,255,255,0.35); letter-spacing:0.04em;
}

/* Result */
.result-zone { flex:1; padding:0.875rem; overflow-y:auto; }

/* Guest card */
.guest-card {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:1.25rem; margin-bottom:0.75rem;
}
.guest-card.state-ready { border-color:rgba(0,212,255,0.25); }
.guest-card.state-done  { border-color:rgba(127,255,212,0.2); }
.guest-card.state-error { border-color:rgba(224,85,85,0.22); }

.g-name  { font-family:var(--font-ui); font-size:clamp(1.5rem,5.5vw,2.2rem); font-weight:700; letter-spacing:-0.025em; line-height:1.1; margin-bottom:0.35rem; color:var(--text-primary); }
.g-seats { font-size:1.1rem; font-weight:500; color:var(--accent-1); margin-bottom:0.2rem; }
.g-meta  { font-size:0.8rem; color:var(--text-secondary); display:flex; gap:0.75rem; flex-wrap:wrap; margin-bottom:0.75rem; }
.g-price-label { font-size:0.65rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:3px; }
.g-price { font-family:var(--font-ui); font-size:clamp(1.4rem,4.5vw,2rem); font-weight:700; letter-spacing:-0.025em; color:var(--text-primary); }

/* Big action buttons */
.action-row { display:flex; gap:0.5rem; margin-top:0.875rem; }
.btn-checkin {
  flex:1; height:clamp(50px,8vw,60px);
  font-family:var(--font-body); font-size:1rem; font-weight:600; letter-spacing:0;
  border-radius:var(--radius);
  background:var(--accent-1);
  color:#020810; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:opacity 80ms;
  -webkit-tap-highlight-color:transparent;
}
.btn-checkin:active { opacity:0.82; }
.btn-checkin:disabled { background:rgba(0,212,255,0.12); color:var(--text-tertiary); cursor:not-allowed; }
.btn-cancel-checkin {
  height:60px; padding:0 1rem; border-radius:var(--radius);
  background:transparent; border:1px solid var(--border);
  color:var(--text-secondary); font-size:0.875rem; font-family:var(--font-body);
  cursor:pointer; transition:border-color 100ms;
}
.btn-cancel-checkin:hover { border-color:var(--border-strong); }

/* Stats bar */
.stats-bar {
  display:flex; gap:0.5rem;
  padding:0.75rem 1rem;
  padding-left:max(1rem, env(safe-area-inset-left,0px));
  padding-right:max(1rem, env(safe-area-inset-right,0px));
  padding-bottom:calc(0.75rem + env(safe-area-inset-bottom,0px));
  background:var(--bg-card); border-top:1px solid var(--border);
}
.stat-item { display:flex; flex-direction:column; align-items:center; gap:2px; flex:1; }
.stat-val { font-family:var(--font-ui); font-size:1.25rem; font-weight:700; letter-spacing:-0.025em; color:var(--text-primary); }
.stat-label { color:var(--text-tertiary); font-size:0.62rem; font-weight:500; letter-spacing:0.04em; text-transform:uppercase; }

/* Scan hint */
.scan-hint { display:flex; flex-direction:column; align-items:center; gap:0.4rem; padding:2.5rem 1rem; color:var(--text-secondary); text-align:center; }
.scan-hint-icon { font-size:2rem; opacity:0.3; margin-bottom:0.25rem; }

/* Event select */
.event-select-screen { flex:1; display:flex; flex-direction:column; padding:1.25rem; position:relative; z-index:1; }
.event-select-title {
  font-family:var(--font-ui); font-size:1.1rem; font-weight:600;
  letter-spacing:-0.01em; margin-bottom:0.875rem; color:var(--text-primary);
}
.event-btn {
  display:flex; flex-direction:column; gap:2px; padding:0.875rem 1rem;
  background:var(--bg-card);
  border:1px solid var(--border); border-radius:var(--radius);
  margin-bottom:0.5rem; cursor:pointer; text-align:left; width:100%;
  color:var(--text-primary); transition:background 100ms, border-color 100ms;
  font-family:var(--font-body);
}
.event-btn:hover { background:var(--bg-raised); border-color:var(--border-strong); }
.event-btn-title { font-weight:500; font-size:0.9rem; }
.event-btn-meta { font-size:0.75rem; color:var(--text-secondary); }

/* Done badge */
.done-badge {
  display:inline-flex; align-items:center; gap:6px;
  border:1px solid rgba(127,255,212,0.2);
  color:var(--c-green); border-radius:6px; padding:0.45rem 0.875rem;
  font-family:var(--font-body); font-size:0.875rem; font-weight:600;
}
</style>
</head>
<body>

<div class="aurora-wrap">
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
</div>

<header class="header">
  <div class="header-inner">
    <a href="/" class="logo"><img src="/assets/jazzin_logo.png" alt="JAZZIN" height="24"></a>
    <div style="display:flex;gap:0.5rem;align-items:center">
      <span id="event-name-header" style="font-size:0.75rem;color:var(--text-secondary)"></span>
      <button class="btn btn-ghost btn-sm" id="btn-change-event" style="display:none">変更</button>
      <a href="/admin/login.html" class="btn btn-ghost btn-sm" id="btn-login">ログイン</a>
    </div>
  </div>
</header>

<div id="toast"></div>

<div class="checkin-layout">

  <div id="event-select-screen" class="event-select-screen" style="display:none">
    <div class="event-select-title">受付イベントを選択</div>
    <div id="event-list"></div>
  </div>

  <div id="checkin-main" style="display:none;flex:1;flex-direction:column">

    <div class="camera-zone">
      <div id="reader"></div>
      <div class="scan-overlay">
        <div class="scan-frame">
          <span></span>
          <div class="scan-line"></div>
        </div>
      </div>
      <div class="scan-status" id="scan-status">QRコードを枠内に合わせてください</div>
    </div>

    <div class="result-zone" id="result-zone">
      <div class="scan-hint" id="scan-hint">
        <div class="scan-hint-icon">📷</div>
        <p>QRをスキャンすると<br>情報がここに表示されます</p>
      </div>
      <div id="guest-display"></div>
    </div>

    <div class="stats-bar">
      <div class="stat-item"><div class="stat-val" id="stat-checked" style="color:var(--c-green)">0</div><div class="stat-label">入場済</div></div>
      <div class="stat-item"><div class="stat-val" id="stat-total">0</div><div class="stat-label">予約数</div></div>
      <div class="stat-item"><div class="stat-val" id="stat-remaining" style="color:var(--accent-1)">0</div><div class="stat-label">未入場</div></div>
      <div class="stat-item"><div class="stat-val" id="stat-cash" style="color:var(--c-green)">¥0</div><div class="stat-label">回収額</div></div>
    </div>
  </div>

  <div id="auth-required" style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;padding:2rem;text-align:center;position:relative;z-index:1">
    <div style="font-family:var(--font-ui);font-size:1.3rem;font-weight:700;letter-spacing:-0.02em;color:var(--text-primary)">Staff Login Required</div>
    <p style="color:var(--text-secondary);font-size:0.875rem">受付モードはスタッフログインが必要です</p>
    <a href="/admin/login.html" class="btn btn-primary btn-lg">ログインする</a>
  </div>

</div>

<script type="module">
import { supabase, processCheckin, completeCheckin, formatDate, formatPrice } from '/core/supabase.js';

let currentEvent = null;
let scanner      = null;
let lastScanned  = '';
let lastScannedAt = 0;
let pendingRsv   = null;
let stats        = { checked:0, total:0, cash:0 };
const RESCAN_COOLDOWN = 1000;
// ✅ ガードフラグ：ガストカード表示中はスキャンを完全に無視し、
//    受付完了処理も多重送信できないようにする（409対策）
let scanLocked      = false;
let checkinInFlight = false;

function showToast(msg,ms=2000){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),ms);}

async function checkAuth() {
  const { data } = await supabase.auth.getUser();
  if (!data?.user) { document.getElementById('auth-required').style.display='flex'; return false; }
  document.getElementById('auth-required').style.display='none';
  document.getElementById('btn-login').style.display='none';
  return true;
}

async function loadEvents() {
  const { data } = await supabase.from('events').select('id,title,event_at,venue_name').in('status',['published','ended']).order('event_at',{ascending:false}).limit(10);
  return data||[];
}

async function selectEvent(ev) {
  currentEvent = ev;
  document.getElementById('event-select-screen').style.display='none';
  document.getElementById('event-name-header').textContent=ev.title;
  document.getElementById('btn-change-event').style.display='inline-flex';
  const main=document.getElementById('checkin-main');
  main.style.display='flex'; main.style.flexDirection='column'; main.style.flex='1';
  await loadStats();
  startScanner();
}

async function loadStats() {
  if (!currentEvent) return;
  const [{ data:total },{ data:checked },{ data:paid },{ data:evData }] = await Promise.all([
    supabase.from('reservations').select('id,num_seats').eq('event_id',currentEvent.id),
    supabase.from('checkins').select('reservation_id').eq('event_id',currentEvent.id),
    supabase.from('reservations').select('num_seats').eq('event_id',currentEvent.id).eq('payment_status','paid_cash'),
    supabase.from('events').select('ticket_price').eq('id',currentEvent.id).single(),
  ]);
  const price=evData?.ticket_price||500;
  stats={
    checked: checked?.length||0,
    total:   (total||[]).reduce((s,r)=>s+r.num_seats,0),
    cash:    (paid||[]).reduce((s,r)=>s+r.num_seats,0)*price,
  };
  updateStatsUI();
  supabase.channel(`checkin-stats-${currentEvent.id}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'checkins',filter:`event_id=eq.${currentEvent.id}`},()=>{stats.checked++;updateStatsUI();})
    .subscribe();
}

function updateStatsUI() {
  document.getElementById('stat-checked').textContent  = stats.checked;
  document.getElementById('stat-total').textContent    = stats.total;
  document.getElementById('stat-remaining').textContent= Math.max(0,stats.total-stats.checked);
  document.getElementById('stat-cash').textContent     = formatPrice(stats.cash);
}

function startScanner() {
  scanner = new Html5Qrcode('reader');
  scanner.start({facingMode:'environment'},{fps:15,qrbox:{width:200,height:200},aspectRatio:1},onQRSuccess,()=>{})
    .catch(()=>{ document.getElementById('scan-status').textContent='カメラを起動できません'; });
}

async function onQRSuccess(text) {
  // ✅ ガストカード表示中・処理中は新しいスキャンを完全に無視する
  //    （同じQRがカメラに映り続けていても再トリガーされない）
  if (scanLocked) return;
  const now=Date.now();
  if (text===lastScanned && now-lastScannedAt<RESCAN_COOLDOWN) return;
  scanLocked=true;
  lastScanned=text; lastScannedAt=now;
  document.getElementById('scan-status').textContent='読み取り中...';
  try {
    const result = await processCheckin(text);
    document.getElementById('scan-hint').style.display='none';
    document.getElementById('guest-display').style.display='block';
    if (!result.success) { renderError(result); return; }
    pendingRsv = result;
    renderGuest(result);
    document.getElementById('scan-status').textContent='✓ QRを読み取りました';
  } catch { renderError({error:'network_error'}); }
}

function renderGuest(rsv) {
  const seats = Array.isArray(rsv.seats) ? rsv.seats.map(s=>s.label).join(' / ') : '--';
  const total = (rsv.ticket_price||500)*rsv.num_seats;
  const kanaMatch = (rsv.notes||'').match(/【フリガナ】([^\n]+)/);
  const kana = kanaMatch ? kanaMatch[1] : '';
  document.getElementById('guest-display').innerHTML=`
    <div class="guest-card state-ready">
      <div class="g-name">${rsv.guest_name}</div>
      ${kana ? `<div style="font-size:0.85rem;color:var(--text-secondary);letter-spacing:0.08em;margin-top:-0.15rem;margin-bottom:0.3rem">${kana}</div>` : ''}
      <div class="g-seats">${seats}</div>
      <div class="g-meta">
        <span>${rsv.num_seats}名</span>
        <span>No. ${rsv.reservation_code}</span>
        <span style="color:${rsv.payment_status==='paid_cash'?'var(--c-green)':'var(--text-secondary)'}">${rsv.payment_status==='paid_cash'?'支払済':'未払い'}</span>
      </div>
      <div><div class="g-price-label">現金受取額</div><div class="g-price">${formatPrice(total)}</div></div>
      <div class="action-row">
        <button class="btn-checkin" id="btn-complete">✓ 受付完了</button>
        <button class="btn-cancel-checkin" id="btn-cancel">キャンセル</button>
      </div>
    </div>`;
  document.getElementById('btn-complete').addEventListener('click', doCheckin);
  document.getElementById('btn-cancel').addEventListener('click', resetUI);
}

function renderError(result) {
  let msg='エラーが発生しました';
  if (result.error==='qr_not_found') msg='無効なQRコードです';
  else if (result.error==='already_checked_in') msg=`${result.guest_name||''} — 入場済みです`;
  else if (result.error==='network_error') msg='通信エラー。再スキャンしてください';
  document.getElementById('guest-display').innerHTML=`
    <div class="guest-card state-error">
      <div style="font-family:var(--font-ui);font-size:1.2rem;font-weight:700;letter-spacing:-0.02em;color:var(--c-red);margin-bottom:0.5rem">⚠ ${msg}</div>
      ${result.reservation_code?`<div class="g-meta"><span>No. ${result.reservation_code}</span></div>`:''}
      <button class="btn-cancel-checkin" style="margin-top:0.75rem;width:100%;height:48px" id="btn-cancel">閉じる</button>
    </div>`;
  document.getElementById('btn-cancel').addEventListener('click', resetUI);
}

async function doCheckin() {
  if (!pendingRsv || checkinInFlight) return;
  checkinInFlight=true;
  const btn=document.getElementById('btn-complete');
  btn.disabled=true; btn.textContent='処理中...';
  try {
    const res = await completeCheckin(pendingRsv.reservation_id);
    if (!res.success) throw new Error();
    stats.cash += (pendingRsv.ticket_price||500)*pendingRsv.num_seats;
    updateStatsUI();
    const card=document.querySelector('.guest-card');
    if (card) {
      card.className='guest-card state-done';
      card.querySelector('.action-row').innerHTML=`<div class="done-badge">✓ 入場完了</div>`;
    }
    setTimeout(resetUI, 1500);
  } catch (err) {
    const msg = err?.message || '';
    // ✅ 409は「すでに入場済み（重複）」だけでなく「APIキー設定不備」でも
    //    返ってくることがあるため、メッセージ内容で区別する
    const isDuplicate  = err?.code==='23505' || /duplicate key|already checked/i.test(msg);
    const isAuthConfig = /api ?key/i.test(msg);
    if (isDuplicate) {
      showToast('すでに入場済みです', 2500);
      setTimeout(resetUI, 800);
    } else if (isAuthConfig) {
      showToast('通信設定エラー：ページを再読み込みしてください', 3500);
      btn.disabled=false; btn.textContent='✓ 受付完了';
      checkinInFlight=false;
    } else {
      showToast('エラー: もう一度お試しください', 2500);
      btn.disabled=false; btn.textContent='✓ 受付完了';
      checkinInFlight=false;
    }
    return;
  }
  checkinInFlight=false;
}

function resetUI() {
  pendingRsv=null;
  scanLocked=false;
  document.getElementById('guest-display').style.display='none';
  document.getElementById('guest-display').innerHTML='';
  document.getElementById('scan-hint').style.display='flex';
  document.getElementById('scan-status').textContent='QRコードを枠内に合わせてください';
  lastScanned='';
}

async function init() {
  const ok = await checkAuth();
  if (!ok) return;
  const events = await loadEvents();
  if (!events.length) { showToast('公開中のイベントがありません'); return; }
  if (events.length===1) { selectEvent(events[0]); return; }
  document.getElementById('event-select-screen').style.display='flex';
  const list=document.getElementById('event-list');
  events.forEach(ev=>{
    const btn=document.createElement('button');
    btn.className='event-btn';
    btn.innerHTML=`<div class="event-btn-title">${ev.title}</div><div class="event-btn-meta">${formatDate(ev.event_at)} — ${ev.venue_name}</div>`;
    btn.addEventListener('click',()=>selectEvent(ev));
    list.appendChild(btn);
  });
  document.getElementById('btn-change-event').addEventListener('click',()=>{
    if (scanner) scanner.stop().catch(()=>{});
    document.getElementById('checkin-main').style.display='none';
    document.getElementById('event-select-screen').style.display='flex';
    document.getElementById('event-name-header').textContent='';
    document.getElementById('btn-change-event').style.display='none';
    resetUI();
  });
}
init();
</script>
</body>
</html>
