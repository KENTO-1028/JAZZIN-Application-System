<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000a10">
<title>JAZZIN — イベント詳細</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<link rel="stylesheet" href="/ui/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
body { min-height:100dvh; }
.hero-img { width:100%; max-height:360px; object-fit:cover; display:block; }
.hero-placeholder {
  width:100%; height:220px;
  background:#000d18;
  display:flex; align-items:center; justify-content:center;
  border-bottom:1px solid var(--border);
}
.event-meta-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:0.75rem 1.5rem; margin:1.2rem 0; }
.event-meta-item { display:flex; flex-direction:column; gap:3px; }
.event-meta-label { font-size:0.65rem; letter-spacing:0.15em; color:var(--text-secondary); font-family:var(--font-body); font-weight:600; }
.event-meta-value { font-size:0.9rem; color:var(--text-primary); }
.section { margin:2rem 0; }
.section-title {
  font-family:var(--font-body); font-size:0.7rem; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-tertiary);
  margin-bottom:1rem; display:flex; align-items:center; gap:0.75rem;
}
.section-title::after { content:''; flex:1; height:1px; background:var(--border); }
.performer-row { display:flex; gap:0.75rem; flex-wrap:wrap; }
.performer-card {
  background:var(--bg-card);
  border:1px solid var(--border); border-radius:var(--radius);
  padding:0.75rem 1rem; flex:1; min-width:160px; transition:border-color 120ms;
}
.performer-card:hover { border-color:rgba(0,212,255,0.25); }
.performer-name { font-weight:500; font-size:0.9rem; color:var(--text-primary); }
.performer-role { font-size:0.72rem; color:var(--accent-1); margin-top:2px; letter-spacing:0.06em; }
.timetable { display:flex; flex-direction:column; }
.timetable-row { display:flex; gap:1rem; align-items:baseline; padding:0.55rem 0; border-bottom:1px solid var(--border); }
.timetable-row:last-child { border-bottom:none; }
.timetable-time { color:var(--accent-1); font-weight:400; font-size:0.85rem; min-width:56px; font-family:var(--font-body); font-weight:500; letter-spacing:0; }
.timetable-act  { font-size:0.875rem; color:var(--text-primary); }
.flow-step { display:flex; gap:1rem; align-items:center; margin-bottom:0.75rem; }
.flow-num {
  width:24px; height:24px; border-radius:50%;
  background:var(--accent-1);
  color:#000d16; font-size:0.68rem; font-weight:600;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}

/* ── Seat map wrapper ── */
.seatmap-wrap {
  overflow-x: auto;
  padding-bottom: 0.5rem;
}
.seatmap-inner {
  display: inline-block;
  min-width: 100%;
}

/* ── Stage bar ── */
.stage-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: var(--font-body);
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 0.75rem;
  margin-top: 0.25rem;
  min-height: 30px;
}
.stage-bar.stage-bottom { margin-bottom: 0.25rem; margin-top: 0.75rem; }

/* ── Seatmap with side stage ── */
.seatmap-with-side {
  display: flex;
  align-items: stretch;
  gap: 0.75rem;
}
.stage-bar-side {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: var(--font-body);
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  writing-mode: vertical-rl;
  min-width: 30px;
  padding: 0.75rem 0;
}

/* ── Layout special cells ── */
.seat[data-type="aisle"] {
  background: transparent !important;
  border-color: transparent !important;
  cursor: default !important;
  color: transparent !important;
}
.seat[data-type="entrance"] {
  background: rgba(127,255,212,0.06) !important;
  border-color: rgba(127,255,212,0.22) !important;
  color: var(--c-green) !important;
  cursor: default !important;
  font-size: 0.5rem !important;
}
.seat[data-type="stage"] {
  background: rgba(0,212,255,0.04) !important;
  border-color: rgba(0,212,255,0.16) !important;
  color: var(--accent-1) !important;
  cursor: default !important;
  font-size: 0.5rem !important;
  border-radius: 3px !important;
}

/* Booking panel */
.booking-panel {
  position:fixed; bottom:0; left:0; right:0;
  background:rgba(4,8,15,0.97);
  border-top:1px solid var(--border);
  padding:0.875rem 0;
  padding-bottom:calc(0.875rem + env(safe-area-inset-bottom,0px));
  z-index:50;
}
.booking-inner {
  max-width:var(--container-w,960px); margin:0 auto;
  padding:0 var(--page-px,1.5rem);
  padding-left:max(var(--page-px,1.5rem), env(safe-area-inset-left,0px));
  padding-right:max(var(--page-px,1.5rem), env(safe-area-inset-right,0px));
  display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;
}
.booking-seats { font-family:var(--font-ui); font-size:1.05rem; font-weight:600; letter-spacing:-0.01em; color:var(--text-primary); }
.booking-price { font-size:0.82rem; color:var(--accent-1); }
.lock-timer { font-size:0.72rem; color:var(--text-secondary); display:flex; align-items:center; gap:4px; }
.lock-timer span { color:var(--accent-1); font-weight:500; }

/* Modal */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,5,12,0.88); z-index:200;
  display:flex; align-items:flex-end; justify-content:center;
  padding: env(safe-area-inset-top,0px) 0 0;
}
/* iPad/desktop: center the modal */
@media (min-width: 600px) {
  .modal-overlay { align-items:center; padding:1rem; }
}
.modal {
  background:var(--bg-card);
  border:1px solid var(--border); border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  width:100%; max-width:100%;
  max-height:92dvh; max-height:92vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:clamp(1rem,4vw,1.5rem);
  padding-bottom:calc(clamp(1rem,4vw,1.5rem) + env(safe-area-inset-bottom,0px));
}
@media (min-width: 600px) {
  .modal {
    border-radius:var(--radius-lg);
    max-width:480px;
    max-height:min(90dvh,90vh,620px);
    padding-bottom:clamp(1rem,4vw,1.5rem);
  }
}
.modal-title { font-family:var(--font-ui); font-size:1.2rem; font-weight:700; letter-spacing:-0.02em; margin-bottom:1.25rem; color:var(--text-primary); }
.form-stack { display:flex; flex-direction:column; gap:0.875rem; }

/* No seats message */
.no-seats-msg {
  text-align:center; padding:2rem;
  color:var(--text-secondary); font-size:0.875rem;
  border:1px solid var(--border);
  border-radius:var(--radius);
}
</style>
</head>
<body>

<div class="aurora-wrap">
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
</div>

<header class="header">
  <div class="header-inner">
    <a href="/" class="logo"><img src="/assets/jazzin_logo.png" alt="JAZZIN" height="26"></a>
    <a href="/" class="btn btn-ghost btn-sm">← 一覧</a>
  </div>
</header>
<div id="toast"></div>

<div id="page-content">
  <div class="hero-placeholder skeleton"></div>
  <div class="container page">
    <div class="skeleton" style="height:2rem;width:60%;border-radius:6px;margin-bottom:1rem"></div>
    <div class="skeleton" style="height:1rem;width:40%;border-radius:6px"></div>
  </div>
</div>

<div class="booking-panel" id="booking-panel" style="display:none">
  <div class="booking-inner">
    <div style="flex:1">
      <div class="booking-seats" id="booking-seats-label">座席を選んでください</div>
      <div class="booking-price" id="booking-price-label"></div>
      <div class="lock-timer" id="lock-timer-el" style="display:none">
        🔒 <span id="lock-timer-val">5:00</span> で仮ロック解除
      </div>
    </div>
    <button class="btn btn-primary btn-lg" id="btn-reserve" disabled>予約へ進む</button>
  </div>
</div>

<div class="modal-overlay" id="form-modal" style="display:none">
  <div class="modal">
    <div class="modal-title">予約情報を入力</div>
    <div class="form-stack">
      <div class="form-group">
        <label class="form-label">お名前 *</label>
        <input type="text" class="form-input" id="f-name" placeholder="山田 太郎" autocomplete="name">
      </div>
      <div class="form-group">
        <label class="form-label">メールアドレス *</label>
        <input type="email" class="form-input" id="f-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">電話番号（任意）</label>
        <input type="tel" class="form-input" id="f-phone" placeholder="090-xxxx-xxxx" autocomplete="tel">
      </div>
      <div class="form-group">
        <label class="form-label">備考（任意）</label>
        <input type="text" class="form-input" id="f-notes" placeholder="アレルギーなど">
      </div>
      <div id="modal-summary" style="background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius);padding:0.9rem;font-size:0.875rem;color:var(--text-secondary);margin-bottom:1rem"></div>
      <div style="display:flex;gap:0.75rem;margin-top:0.3rem">
        <button class="btn btn-ghost btn-full" id="btn-modal-cancel">キャンセル</button>
        <button class="btn btn-primary btn-full" id="btn-confirm" disabled>
          <span id="confirm-spinner" class="spinner" style="display:none"></span>
          予約を確定する
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import {
  supabase, fetchEventDetail, fetchSeats, lockSeats, confirmReservation,
  subscribeSeats, formatDate, formatPrice, SeatStatus
} from '/core/supabase.js';

const params   = new URLSearchParams(location.search);
const EVENT_ID = params.get('id');
if (!EVENT_ID) { location.href = '/'; }

let event       = null;
let seats       = [];
let layoutMeta  = null; // {rows, cols, stage_position, aisles, entrances}
let selectedIds = new Set();
let lockTimer   = null;
let lockExpiry  = null;
const TICKET_PRICE = () => event?.ticket_price || 500;

function showToast(msg, ms=2000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

// ── Fetch layout meta from events table ──────────────────────
async function fetchLayoutMeta(eventId) {
  const { data } = await supabase
    .from('events')
    .select('layout_meta')
    .eq('id', eventId)
    .single();
  return data?.layout_meta || null;
}

// ── Render full page ─────────────────────────────────────────
function buildSeatmapHtml(stagePos, cols, ds) {
  const stageText = ds.stageLabel || '— STAGE —';
  const stageH    = ds.stageHeight || 36;
  const stageBar  = `<div class="stage-bar" style="height:${stageH}px">${stageText}</div>`;
  const stageSide = `<div class="stage-bar-side" style="min-width:${stageH}px">${stageText}</div>`;
  const gridEl = `<div class="seatmap-outer"><div class="seatmap-center"><div id="seat-grid" class="seat-grid" style="grid-template-columns:repeat(${cols},var(--seat-sz));width:fit-content"></div></div></div>`;

  if (stagePos === 'top')    return `${stageBar}${gridEl}`;
  if (stagePos === 'bottom') return `${gridEl}<div class="stage-bar stage-bottom" style="height:${stageH}px">${stageText}</div>`;
  if (stagePos === 'left')   return `<div class="seatmap-with-side">${stageSide}${gridEl}</div>`;
  if (stagePos === 'right')  return `<div class="seatmap-with-side">${gridEl}${stageSide}</div>`;
  return gridEl;
}

function renderPage(ev, seatData, meta) {
  const rows = seatData.length > 0 ? Math.max(...seatData.map(s => s.row_num)) : 6;
  const cols = seatData.length > 0 ? Math.max(...seatData.map(s => s.col_num)) : 6;
  const avail = seatData.filter(s => s.status === SeatStatus.AVAILABLE).length;
  const ds    = meta?.display_settings || { seatSize:36, seatGap:5, stageHeight:36, stageLabel:'— STAGE —' };

  const performers = Array.isArray(ev.performers)
    ? ev.performers.map(p => `
        <div class="performer-card">
          <div class="performer-name">${p.name}</div>
          <div class="performer-role">${p.role || ''}</div>
        </div>`).join('') : '';

  const timetable = Array.isArray(ev.timetable)
    ? ev.timetable.map(t => `
        <div class="timetable-row">
          <span class="timetable-time">${t.time}</span>
          <span class="timetable-act">${t.act}</span>
        </div>`).join('') : '';

  const stagePos = meta?.stage_position || 'top';

  document.getElementById('page-content').innerHTML = `
    ${ev.hero_image_url
      ? `<img class="hero-img" src="${ev.hero_image_url}" alt="${ev.title}">`
      : `<div class="hero-placeholder">
           <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(0,212,255,0.1)" stroke-width="1">
             <path d="M9 18V5l12-2v13M9 18c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-2c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"/>
           </svg>
         </div>`}

    <div class="container page" style="padding-bottom:140px">
      <h1 style="margin-bottom:0.5rem">${ev.title}</h1>
      <div class="event-meta-row">
        <div class="event-meta-item">
          <span class="event-meta-label">DATE & TIME</span>
          <span class="event-meta-value">${formatDate(ev.event_at)}</span>
        </div>
        ${ev.doors_open_at ? `
        <div class="event-meta-item">
          <span class="event-meta-label">OPEN</span>
          <span class="event-meta-value">${new Date(ev.doors_open_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</span>
        </div>` : ''}
        <div class="event-meta-item">
          <span class="event-meta-label">VENUE</span>
          <span class="event-meta-value">${ev.venue_name}</span>
        </div>
        <div class="event-meta-item">
          <span class="event-meta-label">TICKET</span>
          <span class="event-meta-value" style="color:var(--accent-1);font-weight:500">${formatPrice(ev.ticket_price)} / 人</span>
        </div>
      </div>

      ${ev.description ? `
      <section class="section">
        <p class="section-title">ABOUT</p>
        <p style="color:var(--text-secondary);line-height:1.9;white-space:pre-line">${ev.description}</p>
      </section>` : ''}

      ${performers ? `
      <section class="section">
        <p class="section-title">PERFORMERS</p>
        <div class="performer-row">${performers}</div>
      </section>` : ''}

      ${timetable ? `
      <section class="section">
        <p class="section-title">TIMETABLE</p>
        <div class="timetable">${timetable}</div>
      </section>` : ''}

      <section class="section">
        <p class="section-title">
          座席を選ぶ
          <span style="color:var(--text-secondary);font-size:0.75rem;letter-spacing:0.05em;font-family:var(--font-body)">
            ${avail} 席空き
          </span>
        </p>

        ${seatData.length === 0
          ? `<div class="no-seats-msg">
               <p>座席情報がまだ設定されていません</p>
             </div>`
          : buildSeatmapHtml(stagePos, cols, ds)}

        <div class="seat-legend" style="margin-top:1rem">
          <div class="seat-legend-item">
            <div class="seat-legend-dot" style="background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2)"></div>空席
          </div>
          <div class="seat-legend-item">
            <div class="seat-legend-dot" style="background:var(--accent-1)"></div>選択中
          </div>
          <div class="seat-legend-item">
            <div class="seat-legend-dot" style="background:rgba(255,107,107,0.3)"></div>予約済
          </div>
          <div class="seat-legend-item">
            <div class="seat-legend-dot" style="background:rgba(127,255,212,0.3)"></div>入場済
          </div>
        </div>
      </section>

      ${ev.venue_address ? `
      <section class="section">
        <p class="section-title">ACCESS</p>
        <p style="color:var(--text-secondary);margin-bottom:0.75rem">${ev.venue_address}</p>
        <a href="https://maps.google.com/?q=${encodeURIComponent(ev.venue_address)}"
           target="_blank" rel="noopener" class="btn btn-ghost btn-sm">Google Map で開く →</a>
      </section>` : ''}

      <section class="section">
        <p class="section-title">当日の流れ</p>
        <div class="flow-step"><div class="flow-num">1</div><span style="color:var(--text-secondary)">QRコードを受付スタッフに提示</span></div>
        <div class="flow-step"><div class="flow-num">2</div><span style="color:var(--text-secondary)">現金でチケット料金をお支払い（${formatPrice(ev.ticket_price)} / 人）</span></div>
        <div class="flow-step"><div class="flow-num">3</div><span style="color:var(--text-secondary)">入場・お席へどうぞ</span></div>
      </section>

      ${ev.notes ? `
      <section class="section">
        <p class="section-title">NOTES</p>
        <p style="color:var(--text-secondary);white-space:pre-line;font-size:0.875rem">${ev.notes}</p>
      </section>` : ''}
    </div>`;

  // DOMが確実に存在する状態で座席を描画
  if (seatData.length > 0) {
    requestAnimationFrame(() => renderSeats(seatData, meta));
  }

  document.getElementById('booking-panel').style.display = seatData.length > 0 ? 'flex' : 'none';
}

// ── Render seats ─────────────────────────────────────────────
function renderSeats(seatData, meta) {
  seats = seatData;
  const grid = document.getElementById('seat-grid');
  if (!grid) {
    console.error('[JAZZIN] seat-grid not found');
    return;
  }

  // Apply display settings from layout_meta
  const ds = meta?.display_settings || {};
  const seatSize   = ds.seatSize   || 36;
  const seatGap    = ds.seatGap    || 5;

  // Override CSS variables for this event
  document.documentElement.style.setProperty('--seat-sz', `${seatSize}px`);
  document.documentElement.style.setProperty('--seat-gap', `${seatGap}px`);
  grid.style.gap = `${seatGap}px`;
  // Force all seats to use the configured size
  const seatStyle = document.getElementById('dynamic-seat-style') || (() => {
    const s = document.createElement('style');
    s.id = 'dynamic-seat-style';
    document.head.appendChild(s);
    return s;
  })();
  seatStyle.textContent = `.seat { width:${seatSize}px !important; height:${seatSize}px !important; font-size:${Math.max(7, seatSize * 0.26)}px !important; letter-spacing:-0.02em; }
.seat-placeholder { width:${seatSize}px !important; height:${seatSize}px !important; visibility:hidden; }`;

  const aisles    = new Set((meta?.aisles    || []).map(a => `${a.row},${a.col}`));
  const entrances = new Set((meta?.entrances || []).map(e => `${e.row},${e.col}`));
  const walls     = new Set((meta?.walls     || []).map(w => `${w.row},${w.col}`));

  // ✅ row_num/col_numから座席を高速検索できるようマップ化
  const seatMap = new Map();
  seatData.forEach(s => seatMap.set(`${s.row_num},${s.col_num}`, s));

  // ✅ layout_metaのrows/colsを使い、グリッド全マスを順番に走査する
  //    （通路・出入口・壁のマスには座席データが存在しないため、
  //     見た目の位置を保つためのプレースホルダーを描画する）
  const totalRows = meta?.rows || (seatData.length > 0 ? Math.max(...seatData.map(s => s.row_num)) : 6);
  const totalCols = meta?.cols || (seatData.length > 0 ? Math.max(...seatData.map(s => s.col_num)) : 6);

  grid.innerHTML = '';

  for (let r = 1; r <= totalRows; r++) {
    for (let c = 1; c <= totalCols; c++) {
      const key = `${r},${c}`;
      const s   = seatMap.get(key);

      if (s) {
        // 通常の座席
        const el = document.createElement('div');
        el.className = 'seat';
        el.dataset.id    = s.id;
        el.dataset.label = s.label;
        el.dataset.status = selectedIds.has(s.id) ? SeatStatus.SELECTED : s.status;
        el.title          = s.label;
        el.textContent    = s.label;
        el.addEventListener('click', () => toggleSeat(s));
        grid.appendChild(el);
      } else if (entrances.has(key)) {
        const el = document.createElement('div');
        el.className = 'seat';
        el.dataset.type   = 'entrance';
        el.dataset.status = 'entrance';
        el.textContent    = '出入口';
        grid.appendChild(el);
      } else if (aisles.has(key) || walls.has(key)) {
        // 通路・壁: 見た目の位置だけ確保する透明なプレースホルダー
        const el = document.createElement('div');
        el.className = 'seat-placeholder';
        grid.appendChild(el);
      } else {
        // どのリストにも属さない空白マス（念のためのフォールバック）
        const el = document.createElement('div');
        el.className = 'seat-placeholder';
        grid.appendChild(el);
      }
    }
  }

  console.log(`[JAZZIN] ${seatData.length} seats rendered in ${totalRows}x${totalCols} grid`);
}

function patchSeat(updated) {
  const idx = seats.findIndex(s => s.id === updated.id);
  if (idx < 0) return;
  seats[idx] = { ...seats[idx], ...updated };
  if (selectedIds.has(updated.id)) return;
  const el = document.querySelector(`.seat[data-id="${updated.id}"]`);
  if (el && !el.dataset.type) el.dataset.status = updated.status;
}

function toggleSeat(seat) {
  if (seat.status !== SeatStatus.AVAILABLE) return;
  const el = document.querySelector(`.seat[data-id="${seat.id}"]`);
  if (!el) return;
  if (selectedIds.has(seat.id)) {
    selectedIds.delete(seat.id);
    el.dataset.status = SeatStatus.AVAILABLE;
  } else {
    selectedIds.add(seat.id);
    el.dataset.status = SeatStatus.SELECTED;
  }
  updateBookingPanel();
}

function updateBookingPanel() {
  const n = selectedIds.size;
  document.getElementById('booking-seats-label').textContent =
    n === 0 ? '座席を選んでください' : `${n} 席選択中`;
  document.getElementById('booking-price-label').textContent =
    n === 0 ? '' : `合計 ${formatPrice(TICKET_PRICE() * n)}（現金払い）`;
  document.getElementById('btn-reserve').disabled = n === 0;
}

// ── Lock & reserve ───────────────────────────────────────────
document.addEventListener('click', async e => {
  if (e.target.id !== 'btn-reserve') return;
  const btn = e.target;
  btn.disabled = true; btn.textContent = '仮ロック中...';
  try {
    const ok = await lockSeats(EVENT_ID, [...selectedIds]);
    if (!ok) {
      showToast('選択した座席が他の方に取られました');
      seats = await fetchSeats(EVENT_ID);
      selectedIds.clear();
      renderSeats(seats, layoutMeta);
      updateBookingPanel();
      btn.textContent = '予約へ進む'; btn.disabled = false;
      return;
    }
    lockExpiry = Date.now() + 5 * 60 * 1000;
    startLockTimer();
    openFormModal();
  } catch (err) {
    console.error(err);
    showToast('エラーが発生しました');
    btn.textContent = '予約へ進む'; btn.disabled = false;
  }
});

function startLockTimer() {
  const timerEl = document.getElementById('lock-timer-el');
  const valEl   = document.getElementById('lock-timer-val');
  timerEl.style.display = 'flex';
  if (lockTimer) clearInterval(lockTimer);
  lockTimer = setInterval(() => {
    const rem = Math.max(0, lockExpiry - Date.now());
    const m = Math.floor(rem / 60000);
    const s = Math.floor((rem % 60000) / 1000);
    valEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
    if (rem === 0) {
      clearInterval(lockTimer);
      closeFormModal();
      showToast('仮ロックが切れました。再度選んでください');
      selectedIds.clear();
      fetchSeats(EVENT_ID).then(s => { seats = s; renderSeats(s, layoutMeta); updateBookingPanel(); });
      timerEl.style.display = 'none';
    }
  }, 1000);
}

function openFormModal() {
  const n = selectedIds.size;
  const labels = [...selectedIds].map(id => seats.find(s => s.id === id)?.label).join('、');
  document.getElementById('modal-summary').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="color:var(--text-primary);font-weight:500">${event.title}</div>
      <div>席: ${labels}</div>
      <div>合計: ${formatPrice(TICKET_PRICE() * n)}（${n}名 × ${formatPrice(TICKET_PRICE())}）</div>
      <div style="margin-top:4px;font-size:0.72rem;color:var(--accent-1)">※当日現金払い</div>
    </div>`;
  document.getElementById('form-modal').style.display = 'flex';
  document.getElementById('btn-reserve').textContent = '予約へ進む';
  document.getElementById('btn-reserve').disabled = false;
  validateForm();
}

function closeFormModal() {
  document.getElementById('form-modal').style.display = 'none';
}

document.addEventListener('click', e => {
  if (e.target.id === 'btn-modal-cancel') closeFormModal();
});

['f-name', 'f-email'].forEach(id => {
  document.addEventListener('input', e => { if (e.target.id === id) validateForm(); });
});

function validateForm() {
  const name  = document.getElementById('f-name')?.value.trim();
  const email = document.getElementById('f-email')?.value.trim();
  const btn   = document.getElementById('btn-confirm');
  if (btn) btn.disabled = !(name && email && email.includes('@'));
}

document.addEventListener('click', async e => {
  if (e.target.id !== 'btn-confirm') return;
  const btn = e.target;
  btn.disabled = true;
  document.getElementById('confirm-spinner').style.display = 'inline-block';
  try {
    const result = await confirmReservation({
      eventId:    EVENT_ID,
      seatIds:    [...selectedIds],
      guestName:  document.getElementById('f-name').value.trim(),
      guestEmail: document.getElementById('f-email').value.trim(),
      guestPhone: document.getElementById('f-phone').value.trim(),
      notes:      document.getElementById('f-notes').value.trim(),
    });
    if (!result.success) {
      showToast(result.error === 'seats_expired_or_taken'
        ? '仮ロックが期限切れです' : 'エラーが発生しました');
      closeFormModal();
      return;
    }
    clearInterval(lockTimer);
    location.href = `/confirm.html?rid=${result.reservation_id}&token=${result.qr_token}&code=${result.reservation_code}`;
  } catch (err) {
    console.error(err);
    showToast('エラーが発生しました');
    btn.disabled = false;
    document.getElementById('confirm-spinner').style.display = 'none';
  }
});

// ── Init ─────────────────────────────────────────────────────
async function init() {
  try {
    console.log('[JAZZIN] Loading event:', EVENT_ID);
    const [ev, seatData, meta] = await Promise.all([
      fetchEventDetail(EVENT_ID),
      fetchSeats(EVENT_ID),
      fetchLayoutMeta(EVENT_ID),
    ]);
    console.log('[JAZZIN] seats fetched:', seatData?.length, seatData);
    event      = ev;
    layoutMeta = meta;
    renderPage(ev, seatData || [], meta);
    subscribeSeats(EVENT_ID, patchSeat);
  } catch (err) {
    console.error('[JAZZIN] init error:', err);
    document.getElementById('page-content').innerHTML =
      '<div class="container page"><p>イベントが見つかりません</p></div>';
  }
}

init();
</script>
</body>
</html>
