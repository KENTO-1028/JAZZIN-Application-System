<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000a10">
<title>JAZZIN — イベント詳細</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<link rel="stylesheet" href="/ui/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
body { min-height:100dvh; }
/* ✅ 固定max-height(360px)だと、狭い画面では相対的に大きすぎ／広い画面では
   相対的に小さすぎるバランスになりやすい。aspect-ratio + clamp で
   画面幅に応じて自然な比率にスケールするようにする。 */
.hero-img {
  width:100%;
  aspect-ratio: 16 / 9;
  max-height: clamp(200px, 42vw, 420px);
  object-fit:cover; display:block;
}
.hero-placeholder {
  width:100%;
  aspect-ratio: 16 / 9;
  max-height: clamp(180px, 32vw, 300px);
  background:#000d18;
  display:flex; align-items:center; justify-content:center;
  border-bottom:1px solid var(--border);
}
/* ✅ 各項目の最小幅を確保しつつ、狭い画面では常に2列以上を確保して
   窮屈に見えないよう gap と行間を広げた。 */
.event-meta-row {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));
  gap:1rem 1.5rem;
  margin:1.35rem 0;
}
.event-meta-item { display:flex; flex-direction:column; gap:5px; }
.event-meta-label { font-size:0.66rem; letter-spacing:0.14em; color:var(--text-secondary); font-family:var(--font-body); font-weight:600; }
.event-meta-value { font-size:clamp(0.88rem, 2.4vw, 0.95rem); color:var(--text-primary); line-height:1.5; }
@media (max-width:389px) {
  .event-meta-row { grid-template-columns:repeat(2,1fr); gap:0.9rem 1rem; }
}
.section { margin:2rem 0; }
.section-title {
  font-family:var(--font-body); font-size:0.7rem; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-tertiary);
  margin-bottom:1rem; display:flex; align-items:center; gap:0.75rem;
}
.section-title::after { content:''; flex:1; height:1px; background:var(--border); }
.performer-row { display:flex; gap:0.75rem; flex-wrap:wrap; }
.performer-card {
  background:var(--bg-card);
  border:1px solid var(--border); border-radius:var(--radius);
  padding:0.75rem 1rem; flex:1; min-width:160px; transition:border-color 120ms;
}
.performer-card:hover { border-color:rgba(0,212,255,0.25); }
.performer-name { font-weight:500; font-size:0.9rem; color:var(--text-primary); }
.performer-role { font-size:0.72rem; color:var(--accent-1); margin-top:2px; letter-spacing:0.06em; }
.timetable { display:flex; flex-direction:column; }
.timetable-row { display:flex; gap:1rem; align-items:baseline; padding:0.55rem 0; border-bottom:1px solid var(--border); }
.timetable-row:last-child { border-bottom:none; }
.timetable-time { color:var(--accent-1); font-weight:400; font-size:0.85rem; min-width:56px; font-family:var(--font-body); font-weight:500; letter-spacing:0; }
.timetable-act  { font-size:0.875rem; color:var(--text-primary); }
.flow-step { display:flex; gap:1rem; align-items:center; margin-bottom:0.75rem; }
.flow-num {
  width:24px; height:24px; border-radius:50%;
  background:var(--accent-1);
  color:#000d16; font-size:0.68rem; font-weight:600;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}

/* ── Seatmap minimap（映画館の座席選択のような現在地インジケータ） ── */
.seatmap-minimap {
  position: fixed;
  top: calc(var(--header-h, 52px) + 10px + var(--sat, env(safe-area-inset-top,0px)));
  right: max(10px, var(--sar, env(safe-area-inset-right,0px)));
  z-index: 40;
  background: rgba(4,10,18,0.82);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 7px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  display: none;
  opacity: 0;
  transition: opacity 180ms ease, transform 120ms ease;
  transform-origin: top right;
  cursor: grab;
  touch-action: none;
}
.seatmap-minimap:active { cursor: grabbing; }
.seatmap-minimap.visible { display: block; }
.seatmap-minimap.shown   { opacity: 1; }
.seatmap-minimap-toprow {
  display: flex; align-items: center; justify-content: space-between;
  gap: 6px; margin-bottom: 4px;
}
.seatmap-minimap-label {
  font-family: var(--font-body); font-size: 0.56rem; font-weight:600;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-tertiary);
}
.seatmap-minimap-zoom { display:flex; gap:3px; }
.minimap-zoom-btn {
  width: 18px; height: 18px; line-height: 16px; padding: 0;
  border-radius: 4px; border: 1px solid var(--border-strong,rgba(255,255,255,0.15));
  background: rgba(255,255,255,0.06); color: var(--text-secondary,#9ab);
  font-size: 0.7rem; font-weight:700; cursor: pointer; text-align:center;
}
.minimap-zoom-btn:hover  { background: rgba(0,212,255,0.15); color: var(--accent-1); }
.minimap-zoom-btn:active { transform: scale(0.9); }
.seatmap-minimap-stage {
  height: 3px; border-radius: 2px; margin-bottom: 3px;
  background: linear-gradient(90deg, transparent, var(--accent-1), transparent);
  opacity: 0.7;
}
.seatmap-minimap-canvas-wrap { position: relative; display:block; line-height:0; }
.seatmap-minimap canvas { display:block; border-radius: 3px; }
.minimap-viewport {
  position: absolute;
  border: 1.5px solid var(--accent-1);
  background: rgba(0,212,255,0.14);
  border-radius: 2px;
  pointer-events: none;
  box-shadow: 0 0 6px rgba(0,212,255,0.35);
}
@media (max-width:600px) {
  .seatmap-minimap { padding:6px; }
}

/* ── 座席表そのものの拡大縮小コントロール（ミニマップの表示サイズ変更ボタンとは別物）──
   誤認しないよう、あえてミニマップ（右上）とは反対の左上に固定配置し、
   虫眼鏡アイコン＋%表示で「ミニマップの大きさ」ではなく「座席表の拡大率」であることを明示する。 */
.seatzoom-control {
  position: fixed;
  top: calc(var(--header-h, 52px) + 10px + var(--sat, env(safe-area-inset-top,0px)));
  left: max(10px, var(--sal, env(safe-area-inset-left,0px)));
  z-index: 40;
  display: none;
  align-items: center; gap: 2px;
  background: rgba(4,10,18,0.82);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 6px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  opacity: 0;
  transition: opacity 180ms ease;
}
.seatzoom-control.visible { display: flex; }
.seatzoom-control.shown   { opacity: 1; }
.seatzoom-btn {
  width: 26px; height: 26px; border-radius: 50%; padding: 0;
  border: 1px solid var(--border-strong,rgba(255,255,255,0.15));
  background: rgba(255,255,255,0.06); color: var(--text-secondary,#9ab);
  font-size: 0.95rem; font-weight:700; cursor: pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.seatzoom-btn:hover  { background: rgba(0,212,255,0.15); color: var(--accent-1); }
.seatzoom-btn:active { transform: scale(0.92); }
.seatzoom-pct {
  font-family: var(--font-body); font-size: 0.68rem; font-weight:700;
  color: var(--text-secondary,#9ab); min-width: 34px; text-align:center;
}
.seatzoom-icon { font-size:0.75rem; padding:0 2px; opacity:0.6; }

/* ── Seat map wrapper ── */
.seatmap-wrap {
  overflow-x: auto;
  padding-bottom: 0.5rem;
}
.seatmap-inner {
  display: inline-block;
  min-width: 100%;
}

/* ── Stage bar ── */
.stage-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: var(--font-body);
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 0.75rem;
  margin-top: 0.25rem;
  min-height: 30px;
}
.stage-bar.stage-bottom { margin-bottom: 0.25rem; margin-top: 0.75rem; }

/* ── Seatmap with side stage ── */
.seatmap-with-side {
  display: flex;
  align-items: stretch;
  gap: 0.75rem;
}
.stage-bar-side {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: var(--font-body);
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  writing-mode: vertical-rl;
  min-width: 30px;
  padding: 0.75rem 0;
}

/* ── Layout special cells ── */
.seat[data-type="aisle"] {
  background: transparent !important;
  border-color: transparent !important;
  cursor: default !important;
  color: transparent !important;
}
.seat[data-type="entrance"] {
  background: rgba(127,255,212,0.06) !important;
  border-color: rgba(127,255,212,0.22) !important;
  color: var(--c-green) !important;
  cursor: default !important;
  font-size: 0.5rem !important;
}
.seat[data-type="stage"] {
  background: rgba(0,212,255,0.04) !important;
  border-color: rgba(0,212,255,0.16) !important;
  color: var(--accent-1) !important;
  cursor: default !important;
  font-size: 0.5rem !important;
  border-radius: 3px !important;
}

/* Booking panel */
.booking-panel {
  position:fixed; bottom:0; left:0; right:0;
  background:rgba(4,8,15,0.97);
  border-top:1px solid var(--border);
  padding:0.875rem 0;
  padding-bottom:calc(0.875rem + env(safe-area-inset-bottom,0px));
  z-index:50;
}
.booking-inner {
  max-width:var(--container-w,960px); margin:0 auto;
  padding:0 var(--page-px,1.5rem);
  padding-left:max(var(--page-px,1.5rem), env(safe-area-inset-left,0px));
  padding-right:max(var(--page-px,1.5rem), env(safe-area-inset-right,0px));
  display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;
}
.booking-seats { font-family:var(--font-ui); font-size:1.05rem; font-weight:600; letter-spacing:-0.01em; color:var(--text-primary); }
.booking-price { font-size:0.82rem; color:var(--accent-1); }
.lock-timer { font-size:0.72rem; color:var(--text-secondary); display:flex; align-items:center; gap:4px; }
.lock-timer span { color:var(--accent-1); font-weight:500; }

/* Modal */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,5,12,0.88); z-index:200;
  display:flex; align-items:flex-end; justify-content:center;
  padding: env(safe-area-inset-top,0px) 0 0;
}
/* iPad/desktop: center the modal */
@media (min-width: 600px) {
  .modal-overlay { align-items:center; padding:1rem; }
}
.modal {
  background:var(--bg-card);
  border:1px solid var(--border); border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  width:100%; max-width:100%;
  max-height:92dvh; max-height:92vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:clamp(1rem,4vw,1.5rem);
  padding-bottom:calc(clamp(1rem,4vw,1.5rem) + env(safe-area-inset-bottom,0px));
}
@media (min-width: 600px) {
  .modal {
    border-radius:var(--radius-lg);
    max-width:480px;
    max-height:min(90dvh,90vh,620px);
    padding-bottom:clamp(1rem,4vw,1.5rem);
  }
}
.modal-title { font-family:var(--font-ui); font-size:1.2rem; font-weight:700; letter-spacing:-0.02em; margin-bottom:1.25rem; color:var(--text-primary); }
.form-stack { display:flex; flex-direction:column; gap:0.875rem; }

/* No seats message */
.no-seats-msg {
  text-align:center; padding:2rem;
  color:var(--text-secondary); font-size:0.875rem;
  border:1px solid var(--border);
  border-radius:var(--radius);
}
</style>
</head>
<body>

<div class="aurora-wrap">
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
</div>

<header class="header">
  <div class="header-inner">
    <a href="/" class="logo"><img src="/assets/jazzin_logo.png" alt="JAZZIN" height="26"></a>
    <a href="/" class="btn btn-ghost btn-sm">← 一覧</a>
  </div>
</header>
<div id="toast"></div>

<div class="seatzoom-control" id="seatzoom-control" title="座席表の拡大縮小">
  <span class="seatzoom-icon">🔍</span>
  <button type="button" class="seatzoom-btn" id="seatzoom-out">－</button>
  <span class="seatzoom-pct" id="seatzoom-pct">100%</span>
  <button type="button" class="seatzoom-btn" id="seatzoom-in">＋</button>
</div>

<div class="seatmap-minimap" id="seatmap-minimap" title="ドラッグで移動 / ホイールでスクロール / ピンチ・Ctrl+ホイールで座席表を拡大縮小">
  <div class="seatmap-minimap-toprow">
    <span class="seatmap-minimap-label">現在地</span>
    <div class="seatmap-minimap-zoom">
      <button type="button" class="minimap-zoom-btn" id="minimap-zoom-out" title="縮小">－</button>
      <button type="button" class="minimap-zoom-btn" id="minimap-zoom-in" title="拡大">＋</button>
    </div>
  </div>
  <div class="seatmap-minimap-stage" id="minimap-stage-hint"></div>
  <div class="seatmap-minimap-canvas-wrap">
    <canvas id="minimap-canvas"></canvas>
    <div class="minimap-viewport" id="minimap-viewport"></div>
  </div>
</div>

<div id="page-content">
  <div class="hero-placeholder skeleton"></div>
  <div class="container page">
    <div class="skeleton" style="height:2rem;width:60%;border-radius:6px;margin-bottom:1rem"></div>
    <div class="skeleton" style="height:1rem;width:40%;border-radius:6px"></div>
  </div>
</div>

<div class="booking-panel" id="booking-panel" style="display:none">
  <div class="booking-inner">
    <div style="flex:1">
      <div class="booking-seats" id="booking-seats-label">座席を選んでください</div>
      <div class="booking-price" id="booking-price-label"></div>
      <div class="lock-timer" id="lock-timer-el" style="display:none">
        🔒 <span id="lock-timer-val">5:00</span> で仮ロック解除
      </div>
    </div>
    <button class="btn btn-primary btn-lg" id="btn-reserve" disabled>予約へ進む</button>
  </div>
</div>

<div class="modal-overlay" id="form-modal" style="display:none">
  <div class="modal">
    <div class="modal-title">予約情報を入力</div>
    <div class="form-stack">
      <div class="form-group">
        <label class="form-label">お名前 *</label>
        <div style="display:flex;gap:0.5rem">
          <input type="text" class="form-input" id="f-last-name" placeholder="山田" autocomplete="family-name" style="flex:1">
          <input type="text" class="form-input" id="f-first-name" placeholder="太郎" autocomplete="given-name" style="flex:1">
        </div>
        <div style="font-size:0.72rem;color:var(--text-tertiary);margin-top:0.3rem;padding-left:2px">姓　　　　　　　　名</div>
      </div>
      <div class="form-group">
        <label class="form-label">フリガナ *</label>
        <div style="display:flex;gap:0.5rem">
          <input type="text" class="form-input" id="f-last-kana" placeholder="ヤマダ" autocomplete="off" style="flex:1" inputmode="katakana">
          <input type="text" class="form-input" id="f-first-kana" placeholder="タロウ" autocomplete="off" style="flex:1" inputmode="katakana">
        </div>
        <div style="font-size:0.72rem;color:var(--text-tertiary);margin-top:0.3rem;padding-left:2px">セイ　　　　　　　メイ</div>
      </div>
      <div class="form-group">
        <label class="form-label">メールアドレス *</label>
        <input type="email" class="form-input" id="f-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">電話番号（任意）</label>
        <input type="tel" class="form-input" id="f-phone" placeholder="090-xxxx-xxxx" autocomplete="tel">
      </div>
      <div class="form-group">
        <label class="form-label">性別 *</label>
        <div style="display:flex;gap:1.25rem;flex-wrap:wrap;padding:0.4rem 0.1rem">
          <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.85rem;color:var(--text-secondary);cursor:pointer">
            <input type="radio" name="f-gender" value="男" class="f-gender-radio"> 男
          </label>
          <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.85rem;color:var(--text-secondary);cursor:pointer">
            <input type="radio" name="f-gender" value="女" class="f-gender-radio"> 女
          </label>
          <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.85rem;color:var(--text-secondary);cursor:pointer">
            <input type="radio" name="f-gender" value="どちらでもない" class="f-gender-radio"> どちらでもない
          </label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">年齢 *</label>
        <select class="form-input" id="f-age-range">
          <option value="">選択してください</option>
          <option value="〜10代">〜10代</option>
          <option value="20代">20代</option>
          <option value="30代">30代</option>
          <option value="40代">40代</option>
          <option value="50代">50代</option>
          <option value="60代">60代</option>
          <option value="それ以降">それ以降</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">備考（任意）</label>
        <input type="text" class="form-input" id="f-notes" placeholder="事前に伝えておきたいことなどあれば">
      </div>
      <div id="modal-summary" style="background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius);padding:0.9rem;font-size:0.875rem;color:var(--text-secondary);margin-bottom:1rem"></div>
      <div style="display:flex;gap:0.75rem;margin-top:0.3rem">
        <button class="btn btn-ghost btn-full" id="btn-modal-cancel">キャンセル</button>
        <button class="btn btn-primary btn-full" id="btn-confirm" disabled>
          <span id="confirm-spinner" class="spinner" style="display:none"></span>
          予約を確定する
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import {
  supabase, fetchEventDetail, fetchSeats, lockSeats, releaseSeatLock, releaseSeatLockBeacon, confirmReservation,
  subscribeSeats, formatDate, formatPrice, SeatStatus
} from '/core/supabase.js';

const params   = new URLSearchParams(location.search);
const EVENT_ID = params.get('id');
if (!EVENT_ID) { location.href = '/'; }

let event       = null;
let seats       = [];
let layoutMeta  = null; // {rows, cols, stage_position, aisles, entrances}
let selectedIds = new Set();

// ✅ 座席表の拡大縮小（ミニマップとは独立。ピンチ／Ctrl+ホイール／ボタンで操作）
const SEAT_ZOOM_MIN = 0.1, SEAT_ZOOM_MAX = 2.2, SEAT_ZOOM_STEP = 0.15;
let seatZoom      = 1;
let baseSeatSize  = 36;
let baseSeatGap   = 5;

function updateSeatSizeVars(size, gap) {
  document.documentElement.style.setProperty('--seat-sz', `${size}px`);
  document.documentElement.style.setProperty('--seat-gap', `${gap}px`);
  const gridEl = document.getElementById('seat-grid');
  if (gridEl) gridEl.style.gap = `${gap}px`;
  const seatStyle = document.getElementById('dynamic-seat-style') || (() => {
    const s = document.createElement('style');
    s.id = 'dynamic-seat-style';
    document.head.appendChild(s);
    return s;
  })();
  // ✅ 文字サイズは座席サイズに完全比例させる（下限を設けない）。
  //    down-scale時に「文字だけ最小6px」のような下限があると、
  //    座席枠より文字が大きくなりはみ出すため、下限は撤廃。
  //    代わりに、読めないほど小さくなったら（14px未満）文字自体を非表示にする。
  const fontSize = size < 14 ? 0 : size * 0.26;
  seatStyle.textContent = `.seat { width:${size}px !important; height:${size}px !important; font-size:${fontSize}px !important; letter-spacing:-0.02em; overflow:hidden; }
.seat-placeholder { width:${size}px !important; height:${size}px !important; visibility:hidden; }`;
}

function applySeatZoom(newZoom) {
  seatZoom = Math.max(SEAT_ZOOM_MIN, Math.min(SEAT_ZOOM_MAX, newZoom));
  updateSeatSizeVars(baseSeatSize * seatZoom, baseSeatGap * seatZoom);
  const pctEl = document.getElementById('seatzoom-pct');
  if (pctEl) pctEl.textContent = `${Math.round(seatZoom * 100)}%`;
  queueMinimapUpdate();
}

function buildSeatmapHtml(stagePos, cols, ds) {
  const stageText = ds.stageLabel || '— STAGE —';
  const stageH    = ds.stageHeight || 36;
  const stageBar  = `<div class="stage-bar" style="height:${stageH}px">${stageText}</div>`;
  const stageSide = `<div class="stage-bar-side" style="min-width:${stageH}px">${stageText}</div>`;
  const gridEl = `<div class="seatmap-outer"><div class="seatmap-center"><div id="seat-grid" class="seat-grid" style="grid-template-columns:repeat(${cols},var(--seat-sz));width:fit-content"></div></div></div>`;

  if (stagePos === 'top')    return `${stageBar}${gridEl}`;
  if (stagePos === 'bottom') return `${gridEl}<div class="stage-bar stage-bottom" style="height:${stageH}px">${stageText}</div>`;
  if (stagePos === 'left')   return `<div class="seatmap-with-side">${stageSide}${gridEl}</div>`;
  if (stagePos === 'right')  return `<div class="seatmap-with-side">${gridEl}${stageSide}</div>`;
  return gridEl;
}

// ── Render seats ─────────────────────────────────────────────
function renderSeats(seatData, meta) {
  seats = seatData;
  const grid = document.getElementById('seat-grid');
  if (!grid) {
    console.error('[JAZZIN] seat-grid not found');
    return;
  }

  // Apply display settings from layout_meta
  const ds = meta?.display_settings || {};
  baseSeatSize = ds.seatSize || 36;
  baseSeatGap  = ds.seatGap  || 5;

  // ✅ 実際に適用するサイズは「基準サイズ × 現在のズーム倍率」
  updateSeatSizeVars(baseSeatSize * seatZoom, baseSeatGap * seatZoom);

  const aisles    = new Set((meta?.aisles    || []).map(a => `${a.row},${a.col}`));
  const entrances = new Set((meta?.entrances || []).map(e => `${e.row},${e.col}`));
  const walls     = new Set((meta?.walls     || []).map(w => `${w.row},${w.col}`));

  // ✅ row_num/col_numから座席を高速検索できるようマップ化
  const seatMap = new Map();
  seatData.forEach(s => seatMap.set(`${s.row_num},${s.col_num}`, s));

  // ✅ layout_metaのrows/colsを使い、グリッド全マスを順番に走査する
  //    （通路・出入口・壁のマスには座席データが存在しないため、
  //     見た目の位置を保つためのプレースホルダーを描画する）
  const totalRows = meta?.rows || (seatData.length > 0 ? Math.max(...seatData.map(s => s.row_num)) : 6);
  const totalCols = meta?.cols || (seatData.length > 0 ? Math.max(...seatData.map(s => s.col_num)) : 6);

  grid.innerHTML = '';

  for (let r = 1; r <= totalRows; r++) {
    for (let c = 1; c <= totalCols; c++) {
      const key = `${r},${c}`;
      const s   = seatMap.get(key);

      if (s) {
        // 通常の座席
        const el = document.createElement('div');
        el.className = 'seat';
        el.dataset.id    = s.id;
        el.dataset.label = s.label;
        el.dataset.status = selectedIds.has(s.id) ? SeatStatus.SELECTED : s.status;
        el.title          = s.label;
        el.textContent    = s.label;
        el.addEventListener('click', () => toggleSeat(s));
        grid.appendChild(el);
      } else if (entrances.has(key)) {
        const el = document.createElement('div');
        el.className = 'seat';
        el.dataset.type   = 'entrance';
        el.dataset.status = 'entrance';
        el.textContent    = '出入口';
        grid.appendChild(el);
      } else if (aisles.has(key) || walls.has(key)) {
        // 通路・壁: 見た目の位置だけ確保する透明なプレースホルダー
        const el = document.createElement('div');
        el.className = 'seat-placeholder';
        grid.appendChild(el);
      } else {
        // どのリストにも属さない空白マス（念のためのフォールバック）
        const el = document.createElement('div');
        el.className = 'seat-placeholder';
        grid.appendChild(el);
      }
    }
  }

  console.log(`[JAZZIN] ${seatData.length} seats rendered in ${totalRows}x${totalCols} grid`);

  renderMinimap(seatData, meta, totalRows, totalCols);
  requestAnimationFrame(updateMinimapViewport);
}

// ══════════════════════════════════════════════════════════════
// ✅ Minimap（映画館の座席選択のような「現在地」インジケータ）
//    - 実際の座席配置を縮小したcanvasを右上に固定表示
//    - 横スクロール（.seatmap-outer）と縦スクロール（ページ全体）の
//      両方を合成して「今画面に映っている範囲」の枠を重ねて表示
//    - タップ/クリックでその位置へジャンプできる
// ══════════════════════════════════════════════════════════════
let minimapGridInfo = null; // { totalRows, totalCols, cellPx, canvasW, canvasH }
let lastMinimapArgs  = null; // { seatData, meta, totalRows, totalCols } — ズーム変更時の再描画用

function renderMinimap(seatData, meta, totalRows, totalCols) {
  const canvas = document.getElementById('minimap-canvas');
  const widget = document.getElementById('seatmap-minimap');
  if (!canvas || !widget) return;
  lastMinimapArgs = { seatData, meta, totalRows, totalCols };

  const aisles    = new Set((meta?.aisles    || []).map(a => `${a.row},${a.col}`));
  const entrances = new Set((meta?.entrances || []).map(e => `${e.row},${e.col}`));
  const walls     = new Set((meta?.walls     || []).map(w => `${w.row},${w.col}`));
  const seatMap   = new Map();
  seatData.forEach(s => seatMap.set(`${s.row_num},${s.col_num}`, s));

  // ✅ 縮小表示のセルサイズ：列数が多いほど小さく、最大でも見やすい範囲に収める
  //    minimapZoom（ミニマップ自体の表示サイズ）はここに反映し、
  //    canvasを実際に大きい解像度で描き直すことで拡大時のボケを防ぐ
  const z = typeof minimapZoom === 'number' ? minimapZoom : 1;
  const MAX_W = 132 * z, MAX_H = 132 * z, MIN_CELL = 1.2, MAX_CELL = 9 * z;
  const cellPx = Math.max(MIN_CELL, Math.min(MAX_CELL, Math.min(MAX_W / totalCols, MAX_H / totalRows)));
  const dpr = window.devicePixelRatio || 1;
  const canvasW = cellPx * totalCols;
  const canvasH = cellPx * totalRows;

  canvas.style.width  = `${canvasW}px`;
  canvas.style.height = `${canvasH}px`;
  canvas.width  = Math.round(canvasW * dpr);
  canvas.height = Math.round(canvasH * dpr);

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvasW, canvasH);

  for (let r = 1; r <= totalRows; r++) {
    for (let c = 1; c <= totalCols; c++) {
      const key = `${r},${c}`;
      const s   = seatMap.get(key);
      const x = (c - 1) * cellPx, y = (r - 1) * cellPx;
      const pad = cellPx > 3 ? 0.5 : 0;
      let color;
      if (s) {
        const status = selectedIds.has(s.id) ? 'selected' : s.status;
        color = status === 'selected'   ? 'rgba(0,212,255,0.95)'
              : status === 'reserved'   ? 'rgba(224,85,85,0.5)'
              : status === 'checked_in' ? 'rgba(127,255,212,0.5)'
              : status === 'locked'     ? 'rgba(255,255,255,0.12)'
              : 'rgba(255,255,255,0.28)'; // available
      } else if (entrances.has(key)) {
        color = 'rgba(255,200,0,0.35)';
      } else if (aisles.has(key) || walls.has(key)) {
        color = 'transparent';
      } else {
        color = 'transparent';
      }
      if (color !== 'transparent') {
        ctx.fillStyle = color;
        ctx.fillRect(x + pad, y + pad, cellPx - pad * 2, cellPx - pad * 2);
      }
    }
  }

  minimapGridInfo = { totalRows, totalCols, cellPx, canvasW, canvasH };

  // ステージの向きを枠の一辺で示す
  const stageHint = document.getElementById('minimap-stage-hint');
  const stagePos  = meta?.stage_position || 'top';
  if (stageHint) {
    stageHint.style.display = ['top','bottom'].includes(stagePos) ? 'block' : 'none';
    stageHint.style.order   = stagePos === 'bottom' ? '2' : '0';
  }
  widget.style.flexDirection = 'column';
}

// ✅ 「今見えている範囲」の枠をミニマップ上に計算して重ねる
function updateMinimapViewport() {
  const widget = document.getElementById('seatmap-minimap');
  const zoomCtl = document.getElementById('seatzoom-control');
  const outer  = document.querySelector('.seatmap-outer');
  const grid   = document.getElementById('seat-grid');
  const vpEl   = document.getElementById('minimap-viewport');
  if (!widget || !outer || !grid || !vpEl || !minimapGridInfo) {
    if (widget) widget.classList.remove('visible', 'shown');
    if (zoomCtl) zoomCtl.classList.remove('visible', 'shown');
    return;
  }

  const { canvasW, canvasH } = minimapGridInfo;

  // 横方向：.seatmap-outer のスクロール位置から算出
  const scrollW = outer.scrollWidth || 1;
  const hFracW  = Math.min(1, outer.clientWidth / scrollW);
  const hFracX  = scrollW > outer.clientWidth ? outer.scrollLeft / (scrollW - outer.clientWidth) : 0;

  // 縦方向：グリッド全体のうち、現在ウィンドウに映っている範囲から算出
  //         （.seatmap-outer は縦方向にスクロールしないため、ページ全体のスクロールで判定する）
  const rect = grid.getBoundingClientRect();
  const winH = window.innerHeight;
  const visibleTop    = Math.min(Math.max(0, -rect.top), rect.height);
  const visibleBottom = Math.min(Math.max(0, winH - rect.top), rect.height);
  const vFracY = rect.height > 0 ? visibleTop / rect.height : 0;
  const vFracH = rect.height > 0 ? Math.max(0, (visibleBottom - visibleTop) / rect.height) : 1;

  const overflowsH = scrollW > outer.clientWidth + 2;
  const overflowsV = rect.height > winH + 2;

  // 座席セクションが画面内に見えているかどうか（ズームコントロールの表示判定に使う）
  const seatSectionVisible = rect.bottom > 0 && rect.top < winH;

  // 画面内に収まりきっている（横も縦もはみ出していない）なら現在地枠は不要なので隠す
  if (!overflowsH && !overflowsV) {
    widget.classList.remove('shown');
    setTimeout(() => { if (!widget.classList.contains('shown')) widget.classList.remove('visible'); }, 200);
  } else {
    widget.classList.add('visible');
    requestAnimationFrame(() => widget.classList.add('shown'));
  }

  // ズームコントロールは、座席セクションが見えている間はグリッドの大小に関わらず常に表示
  if (zoomCtl) {
    if (seatSectionVisible) {
      zoomCtl.classList.add('visible');
      requestAnimationFrame(() => zoomCtl.classList.add('shown'));
    } else {
      zoomCtl.classList.remove('shown');
      setTimeout(() => { if (!zoomCtl.classList.contains('shown')) zoomCtl.classList.remove('visible'); }, 200);
    }
  }

  if (!overflowsH && !overflowsV) return;

  const left = (overflowsH ? hFracX * (1 - hFracW) : 0) * canvasW;
  const wpx  = (overflowsH ? hFracW : 1) * canvasW;
  const top  = vFracY * canvasH;
  const hpx  = Math.max(4, vFracH * canvasH);

  vpEl.style.left   = `${Math.max(0, left)}px`;
  vpEl.style.top    = `${Math.max(0, top)}px`;
  vpEl.style.width  = `${Math.min(canvasW, wpx)}px`;
  vpEl.style.height = `${Math.min(canvasH, hpx)}px`;
}

// ✅ ミニマップの座標(fx,fy: 0〜1)から、本体側のスクロール位置へジャンプする
function jumpToMinimapPoint(fx, fy, smooth) {
  const outer = document.querySelector('.seatmap-outer');
  const grid  = document.getElementById('seat-grid');
  if (!outer || !grid || !minimapGridInfo) return;

  const behavior = smooth ? 'smooth' : 'instant';

  // 横：seatmap-outer をスクロール
  const scrollW = outer.scrollWidth;
  if (scrollW > outer.clientWidth) {
    const targetLeft = fx * scrollW - outer.clientWidth / 2;
    outer.scrollTo({ left: Math.max(0, Math.min(scrollW - outer.clientWidth, targetLeft)), behavior });
  }

  // 縦：ページ全体をスクロール（グリッドの該当位置が画面中央あたりに来るように）
  const gridRect = grid.getBoundingClientRect();
  const targetY = window.scrollY + gridRect.top + fy * gridRect.height - window.innerHeight / 2;
  window.scrollTo({ top: Math.max(0, targetY), behavior });
}

function clientPointToMinimapFraction(clientX, clientY) {
  const canvasWrap = document.querySelector('.seatmap-minimap-canvas-wrap');
  const wrapRect = canvasWrap.getBoundingClientRect();
  return {
    fx: Math.min(1, Math.max(0, (clientX - wrapRect.left) / wrapRect.width)),
    fy: Math.min(1, Math.max(0, (clientY - wrapRect.top)  / wrapRect.height)),
  };
}

// ✅ タップ／クリックでジャンプ、押したままドラッグすると連続的にその位置へ追従スクロールする
//    （マウス・タッチどちらもPointer Eventsで統一）
const minimapWidget = document.getElementById('seatmap-minimap');
let minimapDragging = false;
const minimapPointers = new Map(); // 2本指ピンチ検出用
let minimapPinchStartDist = null, minimapPinchStartZoom = null;

// ✅ ミニマップ自体の「表示サイズ」変更（座席表そのもののズームとは別物）。
//    デフォルト(100%)より小さくはできない＝拡大のみ許可し、拡大後は100%まで戻せる。
//    ※ canvasをtransform:scaleで引き伸ばすとボケるため、実際に大きい解像度で描き直す
const MINIMAP_ZOOM_MIN = 1, MINIMAP_ZOOM_MAX = 2, MINIMAP_ZOOM_STEP = 0.15;
let minimapZoom = 1;
function applyMinimapZoom() {
  if (lastMinimapArgs) {
    renderMinimap(lastMinimapArgs.seatData, lastMinimapArgs.meta, lastMinimapArgs.totalRows, lastMinimapArgs.totalCols);
    requestAnimationFrame(updateMinimapViewport);
  }
}
document.getElementById('minimap-zoom-in').addEventListener('click', e => {
  e.stopPropagation();
  minimapZoom = Math.min(MINIMAP_ZOOM_MAX, +(minimapZoom + MINIMAP_ZOOM_STEP).toFixed(2));
  applyMinimapZoom();
});
document.getElementById('minimap-zoom-out').addEventListener('click', e => {
  e.stopPropagation();
  minimapZoom = Math.max(MINIMAP_ZOOM_MIN, +(minimapZoom - MINIMAP_ZOOM_STEP).toFixed(2));
  applyMinimapZoom();
});

// ✅ 座席表そのものの拡大縮小ボタン（ミニマップの表示サイズとは別のコントロール）
document.getElementById('seatzoom-in').addEventListener('click', () => applySeatZoom(seatZoom + SEAT_ZOOM_STEP));
document.getElementById('seatzoom-out').addEventListener('click', () => applySeatZoom(seatZoom - SEAT_ZOOM_STEP));

minimapWidget.addEventListener('pointerdown', e => {
  if (e.target.closest('.minimap-zoom-btn')) return; // ズームボタン操作はドラッグ扱いしない
  minimapWidget.setPointerCapture(e.pointerId);
  minimapPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (minimapPointers.size === 2) {
    // 2本指になった瞬間：ドラッグ移動をやめ、ピンチズームに切り替える
    minimapDragging = false;
    const pts = [...minimapPointers.values()];
    minimapPinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    minimapPinchStartZoom = seatZoom;
  } else {
    minimapDragging = true;
    const { fx, fy } = clientPointToMinimapFraction(e.clientX, e.clientY);
    jumpToMinimapPoint(fx, fy, false); // 最初の一手は瞬時に反応させる
  }
});
minimapWidget.addEventListener('pointermove', e => {
  if (!minimapPointers.has(e.pointerId)) return;
  minimapPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (minimapPointers.size === 2 && minimapPinchStartDist) {
    const pts = [...minimapPointers.values()];
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    applySeatZoom(minimapPinchStartZoom * (dist / minimapPinchStartDist));
  } else if (minimapDragging) {
    const { fx, fy } = clientPointToMinimapFraction(e.clientX, e.clientY);
    jumpToMinimapPoint(fx, fy, false); // ドラッグ追従はカクつかないよう瞬時に更新
  }
});
function endMinimapDrag(e) {
  minimapPointers.delete(e.pointerId);
  try { minimapWidget.releasePointerCapture(e.pointerId); } catch {}
  if (minimapPointers.size < 2) minimapPinchStartDist = null;
  minimapDragging = minimapPointers.size === 1;
}
minimapWidget.addEventListener('pointerup', endMinimapDrag);
minimapWidget.addEventListener('pointercancel', endMinimapDrag);

// ✅ ミニマップの上でのホイール／トラックパッド操作
//    ・通常  → 本体をパン（移動量は「画面サイズに対する割合」で計算し、暴れないよう上限を設ける）
//    ・Ctrl/Cmd併用（Macトラックパッドのピンチも含む）→ 座席表そのものを拡大縮小
minimapWidget.addEventListener('wheel', e => {
  e.preventDefault();

  if (e.ctrlKey || e.metaKey) {
    const factor = e.deltaY < 0 ? 1.08 : 0.92;
    applySeatZoom(seatZoom * factor);
    return;
  }

  const outer = document.querySelector('.seatmap-outer');
  if (!outer) return;
  const maxStepX = outer.clientWidth  * 0.35;
  const maxStepY = window.innerHeight * 0.35;
  const stepX = Math.max(-maxStepX, Math.min(maxStepX, e.deltaX * 3));
  const stepY = Math.max(-maxStepY, Math.min(maxStepY, e.deltaY * 3));

  if (outer.scrollWidth > outer.clientWidth) outer.scrollBy({ left: stepX, behavior: 'auto' });
  window.scrollBy({ top: stepY, behavior: 'auto' });
}, { passive: false });

// ✅ 座席表そのものの上での操作
//    ・通常のタップ／1本指スクロールはブラウザ標準のまま（邪魔しない）
//    ・2本指ピンチ、Ctrl/Cmd+ホイールでズーム
const seatmapOuterEl = document.querySelector('.seatmap-outer');
if (seatmapOuterEl) {
  const seatPointers = new Map();
  let seatPinchStartDist = null, seatPinchStartZoom = null;

  seatmapOuterEl.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    seatPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (seatPointers.size === 2) {
      e.preventDefault();
      // ✅ 2本の指を両方ともキャプチャする（片方だけだと途中でズレて
      //    認識が不安定になっていた）
      seatPointers.forEach((_, id) => {
        try { seatmapOuterEl.setPointerCapture(id); } catch {}
      });
      const pts = [...seatPointers.values()];
      seatPinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      seatPinchStartZoom = seatZoom;
    }
  }, { passive: false });
  seatmapOuterEl.addEventListener('pointermove', e => {
    if (!seatPointers.has(e.pointerId)) return;
    seatPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (seatPointers.size === 2 && seatPinchStartDist) {
      e.preventDefault();
      const pts = [...seatPointers.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      applySeatZoom(seatPinchStartZoom * (dist / seatPinchStartDist));
    }
  }, { passive: false });
  function endSeatPinch(e) {
    seatPointers.delete(e.pointerId);
    try { seatmapOuterEl.releasePointerCapture(e.pointerId); } catch {}
    if (seatPointers.size < 2) seatPinchStartDist = null;
  }
  seatmapOuterEl.addEventListener('pointerup', endSeatPinch);
  seatmapOuterEl.addEventListener('pointercancel', endSeatPinch);

  seatmapOuterEl.addEventListener('wheel', e => {
    if (!(e.ctrlKey || e.metaKey)) return; // 通常のスクロールは邪魔しない
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.08 : 0.92;
    applySeatZoom(seatZoom * factor);
  }, { passive: false });
}

// スクロール・リサイズのたびに現在地の枠を更新（rAFで間引き）
let minimapUpdateQueued = false;
function queueMinimapUpdate() {
  if (minimapUpdateQueued) return;
  minimapUpdateQueued = true;
  requestAnimationFrame(() => { minimapUpdateQueued = false; updateMinimapViewport(); });
}
window.addEventListener('scroll', queueMinimapUpdate, { passive: true });
window.addEventListener('resize', queueMinimapUpdate);
document.addEventListener('scroll', e => {
  if (e.target.classList?.contains('seatmap-outer')) queueMinimapUpdate();
}, { passive: true, capture: true });

function patchSeat(updated) {
  const idx = seats.findIndex(s => s.id === updated.id);
  if (idx < 0) return;
  seats[idx] = { ...seats[idx], ...updated };
  if (selectedIds.has(updated.id)) return;
  const el = document.querySelector(`.seat[data-id="${updated.id}"]`);
  if (el && !el.dataset.type) el.dataset.status = updated.status;
  if (layoutMeta) {
    const totalRows = layoutMeta?.rows || 6, totalCols = layoutMeta?.cols || 6;
    renderMinimap(seats, layoutMeta, totalRows, totalCols);
  }
}

function toggleSeat(seat) {
  if (seat.status !== SeatStatus.AVAILABLE) return;
  const el = document.querySelector(`.seat[data-id="${seat.id}"]`);
  if (!el) return;
  if (selectedIds.has(seat.id)) {
    selectedIds.delete(seat.id);
    el.dataset.status = SeatStatus.AVAILABLE;
  } else {
    selectedIds.add(seat.id);
    el.dataset.status = SeatStatus.SELECTED;
  }
  updateBookingPanel();
  if (layoutMeta) {
    const totalRows = layoutMeta?.rows || 6, totalCols = layoutMeta?.cols || 6;
    renderMinimap(seats, layoutMeta, totalRows, totalCols);
  }
}

function updateBookingPanel() {
  const n = selectedIds.size;
  document.getElementById('booking-seats-label').textContent =
    n === 0 ? '座席を選んでください' : `${n} 席選択中`;
  document.getElementById('booking-price-label').textContent =
    n === 0 ? '' : `合計 ${formatPrice(TICKET_PRICE() * n)}（現金払い）`;
  document.getElementById('btn-reserve').disabled = n === 0;
}

// ── Lock & reserve ───────────────────────────────────────────
document.addEventListener('click', async e => {
  if (e.target.id !== 'btn-reserve') return;
  const btn = e.target;
  btn.disabled = true; btn.textContent = '仮ロック中...';
  try {
    const ok = await lockSeats(EVENT_ID, [...selectedIds]);
    if (!ok) {
      showToast('選択した座席が他の方に取られました');
      seats = await fetchSeats(EVENT_ID);
      selectedIds.clear();
      renderSeats(seats, layoutMeta);
      updateBookingPanel();
      btn.textContent = '予約へ進む'; btn.disabled = false;
      return;
    }
    lockExpiry = Date.now() + 5 * 60 * 1000;
    startLockTimer();
    openFormModal();
  } catch (err) {
    console.error(err);
    showToast('エラーが発生しました');
    btn.textContent = '予約へ進む'; btn.disabled = false;
  }
});

function startLockTimer() {
  const timerEl = document.getElementById('lock-timer-el');
  const valEl   = document.getElementById('lock-timer-val');
  timerEl.style.display = 'flex';
  if (lockTimer) clearInterval(lockTimer);
  lockTimer = setInterval(() => {
    const rem = Math.max(0, lockExpiry - Date.now());
    const m = Math.floor(rem / 60000);
    const s = Math.floor((rem % 60000) / 1000);
    valEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
    if (rem === 0) {
      clearInterval(lockTimer);
      closeFormModal();
      showToast('仮ロックが切れました。再度選んでください');
      const idsToRelease = [...selectedIds];
      selectedIds.clear();
      releaseSeatLock(EVENT_ID, idsToRelease).catch(() => {}); // 期限切れなのでベストエフォート
      fetchSeats(EVENT_ID).then(s => { seats = s; renderSeats(s, layoutMeta); updateBookingPanel(); });
      timerEl.style.display = 'none';
    }
  }, 1000);
}

function openFormModal() {
  const n = selectedIds.size;
  const labels = [...selectedIds].map(id => seats.find(s => s.id === id)?.label).join('、');
  document.getElementById('modal-summary').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="color:var(--text-primary);font-weight:500">${event.title}</div>
      <div>席: ${labels}</div>
      <div>合計: ${formatPrice(TICKET_PRICE() * n)}（${n}名 × ${formatPrice(TICKET_PRICE())}）</div>
      <div style="margin-top:4px;font-size:0.72rem;color:var(--accent-1)">※当日現金払い</div>
    </div>`;
  document.getElementById('form-modal').style.display = 'flex';
  document.getElementById('btn-reserve').textContent = '予約へ進む';
  document.getElementById('btn-reserve').disabled = false;
  validateForm();
}

function closeFormModal() {
  document.getElementById('form-modal').style.display = 'none';
}

// ✅ フォームをキャンセルしたら、選択解除と同時に座席のキープ（仮ロック）も解除する。
//    5分経つのを待たず、すぐに他のお客様がその座席を選べるようにするため。
document.addEventListener('click', async e => {
  if (e.target.id !== 'btn-modal-cancel') return;
  closeFormModal();
  if (lockTimer) { clearInterval(lockTimer); lockTimer = null; }
  const timerEl = document.getElementById('lock-timer-el');
  if (timerEl) timerEl.style.display = 'none';

  const idsToRelease = [...selectedIds];
  selectedIds.clear();
  updateBookingPanel();
  try {
    await releaseSeatLock(EVENT_ID, idsToRelease);
  } catch (err) {
    console.error('[JAZZIN] release_seat_lock error:', err);
  }
  fetchSeats(EVENT_ID).then(s => { seats = s; renderSeats(s, layoutMeta); });
});

['f-last-name', 'f-first-name', 'f-last-kana', 'f-first-kana', 'f-email'].forEach(id => {
  document.addEventListener('input', e => { if (e.target.id === id) validateForm(); });
});
document.addEventListener('change', e => {
  if (e.target.id === 'f-age-range' || e.target.classList?.contains('f-gender-radio')) validateForm();
});

function validateForm() {
  const lastName  = document.getElementById('f-last-name')?.value.trim();
  const firstName = document.getElementById('f-first-name')?.value.trim();
  const lastKana  = document.getElementById('f-last-kana')?.value.trim();
  const firstKana = document.getElementById('f-first-kana')?.value.trim();
  const email     = document.getElementById('f-email')?.value.trim();
  const gender    = document.querySelector('.f-gender-radio:checked')?.value;
  const ageRange  = document.getElementById('f-age-range')?.value;
  const btn       = document.getElementById('btn-confirm');
  if (btn) btn.disabled = !(lastName && firstName && lastKana && firstKana && email && email.includes('@') && gender && ageRange);
}

document.addEventListener('click', async e => {
  if (e.target.id !== 'btn-confirm') return;
  const btn = e.target;
  btn.disabled = true;
  document.getElementById('confirm-spinner').style.display = 'inline-block';

  const lastName   = document.getElementById('f-last-name').value.trim();
  const firstName  = document.getElementById('f-first-name').value.trim();
  const lastKana   = document.getElementById('f-last-kana').value.trim();
  const firstKana  = document.getElementById('f-first-kana').value.trim();
  const fullName   = `${lastName} ${firstName}`;
  const fullKana   = `${lastKana} ${firstKana}`;
  const notesRaw   = document.getElementById('f-notes').value.trim();
  const gender     = document.querySelector('.f-gender-radio:checked')?.value || null;
  const ageRange   = document.getElementById('f-age-range').value || null;

  const payload = {
    eventId:       EVENT_ID,
    seatIds:       [...selectedIds],
    guestName:     fullName,
    guestEmail:    document.getElementById('f-email').value.trim(),
    guestPhone:    document.getElementById('f-phone').value.trim(),
    notes:         notesRaw,
    guestNameKana: fullKana,
    guestGender:   gender,
    guestAgeRange: ageRange,
  };

  // ネットワーク由来のエラー（DNS瞬断・回線切替など）だけ自動リトライする。
  // アプリ側のエラー（座席が取られた等）は即座に中断してユーザーに伝える。
  function isNetworkError(err) {
    return err instanceof TypeError
      || /NAME_NOT_RESOLVED|Failed to fetch|network/i.test(err?.message || '');
  }

  async function attemptConfirm(retriesLeft) {
    try {
      const result = await confirmReservation(payload);
      if (!result.success) {
        showToast(result.error === 'seats_expired_or_taken'
          ? '仮ロックが期限切れです' : 'エラーが発生しました');
        closeFormModal();
        btn.disabled = false;
        document.getElementById('confirm-spinner').style.display = 'none';
        return;
      }
      clearInterval(lockTimer);
      location.href = `/confirm.html?rid=${result.reservation_id}&token=${result.qr_token}&code=${result.reservation_code}`;
    } catch (err) {
      if (isNetworkError(err) && retriesLeft > 0) {
        console.warn(`[JAZZIN] confirm_reservation network error, retrying... (${retriesLeft} left)`, err);
        await new Promise(r => setTimeout(r, 1500));
        return attemptConfirm(retriesLeft - 1);
      }
      console.error(err);
      // フォームは閉じない：ロックが有効な間はそのまま再送信できるようにする
      showToast(isNetworkError(err)
        ? '通信エラーが発生しました。電波状況をご確認の上、もう一度お試しください'
        : 'エラーが発生しました');
      btn.disabled = false;
      document.getElementById('confirm-spinner').style.display = 'none';
    }
  }

  await attemptConfirm(2);
});

// ── Init ─────────────────────────────────────────────────────
async function init() {
  try {
    console.log('[JAZZIN] Loading event:', EVENT_ID);
    const [ev, seatData, meta] = await Promise.all([
      fetchEventDetail(EVENT_ID),
      fetchSeats(EVENT_ID),
      fetchLayoutMeta(EVENT_ID),
    ]);
    console.log('[JAZZIN] seats fetched:', seatData?.length, seatData);
    event      = ev;
    layoutMeta = meta;
    renderPage(ev, seatData || [], meta);
    subscribeSeats(EVENT_ID, patchSeat);

    // ✅ 期限切れの仮ロックを定期的に掃除する（誰も操作しなくても自動で解放され、
    //    他の閲覧者の画面にもリアルタイムで反映される）。
    //    fetchSeats自体が「期限切れロックをavailableに戻す」処理を内包しているため、
    //    これを定期的に呼ぶだけで良い。
    setInterval(() => {
      fetchSeats(EVENT_ID).then(s => {
        seats = s;
        renderSeats(s, layoutMeta);
      }).catch(() => {});
    }, 45000);

    // ✅ タブを閉じる・ページ離脱する際、キープ中の座席があればベストエフォートで解放する
    const releaseOnLeave = () => {
      if (lockTimer && selectedIds.size > 0) {
        releaseSeatLockBeacon(EVENT_ID, [...selectedIds]);
      }
    };
    window.addEventListener('pagehide', releaseOnLeave);
    window.addEventListener('beforeunload', releaseOnLeave);
  } catch (err) {
    console.error('[JAZZIN] init error:', err);
    document.getElementById('page-content').innerHTML =
      '<div class="container page"><p>イベントが見つかりません</p></div>';
  }
}

init();
</script>
