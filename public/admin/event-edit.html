<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000a10">
<title>JAZZIN — イベント編集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<link rel="stylesheet" href="/ui/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
body { min-height:100dvh; }
.edit-page { max-width:720px; margin:0 auto; padding:2rem 1.25rem 6rem; position:relative; z-index:1; }

/* Page title */
.page-title {
  font-family:var(--font-ui); font-size:1.75rem; font-weight:700;
  letter-spacing:-0.02em;
  color:var(--text-primary);
  margin-bottom:0.25rem;
}
.page-sub { font-size:0.82rem; color:var(--text-secondary); margin-bottom:2rem; }

/* Draft banner */
.draft-banner {
  display:flex; align-items:center; justify-content:space-between;
  gap:1rem; flex-wrap:wrap;
  background:transparent;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:0.75rem 1rem;
  margin-bottom:1.5rem;
  font-size:0.82rem;
}
.draft-banner.warn { border-color:rgba(255,200,0,0.22); }
.draft-label { display:flex; align-items:center; gap:0.5rem; }
.draft-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; background:var(--accent-1); }
.draft-dot.warn { background:#ffc800; }

/* Section card */
.section-card {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  overflow:hidden;
  margin-bottom:1.25rem;
}
.section-card-header {
  background:var(--bg-raised);
  border-bottom:1px solid var(--border);
  padding:0.75rem 1.25rem;
  display:flex; align-items:center; gap:0.6rem;
}
.section-card-icon { font-size:0.9rem; opacity:0.7; }
.section-card-title {
  font-family:var(--font-body); font-size:0.75rem; font-weight:600;
  letter-spacing:0.08em; text-transform:uppercase;
  color:var(--text-tertiary);
}
.section-card-body { padding:1.25rem; display:flex; flex-direction:column; gap:1rem; }

/* Form grid */
.form-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
@media (max-width:520px) { .form-grid-2 { grid-template-columns:1fr; } }
/* ✅ 「未定」チェックボックス（開催日時・開場時刻共通） */
.tbd-toggle {
  display:flex; align-items:center; gap:0.45rem;
  margin-top:0.4rem; font-size:0.8rem; color:var(--text-secondary);
  cursor:pointer; user-select:none; -webkit-user-select:none;
  min-height:28px;
}
.tbd-toggle input[type="checkbox"] {
  width:17px; height:17px; accent-color:var(--accent-1);
  cursor:pointer; flex-shrink:0;
}
.form-input:disabled { opacity:0.4; cursor:not-allowed; }

/* Status selector */
.status-btns { display:flex; gap:0.5rem; flex-wrap:wrap; }
.status-btn {
  padding:0.4rem 1rem; border-radius:var(--radius);
  font-size:0.8rem; font-weight:400; cursor:pointer;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text-secondary); transition:border-color 100ms, color 100ms;
  font-family:var(--font-body);
}
.status-btn:hover { border-color:rgba(0,212,255,0.3); color:var(--text-primary); }
.status-btn.active[data-val="draft"]     { border-color:var(--accent-1); color:var(--accent-1); }
.status-btn.active[data-val="published"] { border-color:var(--c-green); color:var(--c-green); }
.status-btn.active[data-val="ended"]     { border-color:var(--c-red); color:var(--c-red); }

/* Performer / timetable row */
.dynamic-rows { display:flex; flex-direction:column; gap:0.5rem; }
.dynamic-row { display:flex; gap:0.5rem; align-items:center; }
.dynamic-row .form-input { flex:1; }
.btn-remove-row {
  width:30px; height:30px; border-radius:4px; flex-shrink:0;
  background:transparent; border:1px solid rgba(224,85,85,0.2);
  color:var(--c-red); cursor:pointer; font-size:1rem;
  display:flex; align-items:center; justify-content:center;
  transition:border-color 100ms;
}
.btn-remove-row:hover { border-color:rgba(224,85,85,0.5); }
.btn-add-row {
  display:flex; align-items:center; gap:0.4rem;
  font-size:0.78rem; color:var(--text-secondary); cursor:pointer;
  background:none; border:1px dashed var(--border);
  border-radius:var(--radius); padding:0.5rem 0.75rem;
  width:100%; justify-content:center; transition:border-color 100ms, color 100ms;
  font-family:var(--font-body);
}
.btn-add-row:hover { border-color:rgba(0,212,255,0.28); color:var(--accent-1); }

/* Bottom actions bar */
.actions-bar {
  position:fixed; bottom:0; left:0; right:0;
  background:rgba(4,8,15,0.97);
  border-top:1px solid var(--border);
  padding:0.875rem 1.5rem;
  padding-left:max(1.5rem, env(safe-area-inset-left,0px));
  padding-right:max(1.5rem, env(safe-area-inset-right,0px));
  padding-bottom:calc(0.875rem + env(safe-area-inset-bottom,0px));
  z-index:50;
}
.actions-bar-inner {
  max-width:720px; margin:0 auto;
  display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;
}
.autosave-label {
  flex:1; font-size:0.75rem; color:var(--text-secondary);
  display:flex; align-items:center; gap:0.4rem;
}
.autosave-label .dot { width:5px; height:5px; border-radius:50%; background:var(--text-tertiary); }
.autosave-label .dot.saving { background:var(--accent-1); }
.autosave-label .dot.saved  { background:var(--c-green); }

/* New event badge */
.new-badge {
  display:inline-block; padding:0.15rem 0.5rem;
  background:transparent; border:1px solid rgba(0,212,255,0.22);
  border-radius:3px; font-size:0.68rem; letter-spacing:0.1em; color:var(--accent-1);
  vertical-align:middle; margin-left:0.5rem;
}
</style>
</head>
<body>

<div class="aurora-wrap">
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
</div>

<header class="header">
  <div class="header-inner">
    <a href="/admin/index.html" class="logo"><img src="/assets/jazzin_logo.png" alt="JAZZIN" height="26"></a>
    <div style="display:flex;gap:0.5rem;align-items:center">
      <span id="header-status" style="font-size:0.75rem;color:var(--text-secondary)"></span>
      <a href="/admin/index.html" class="btn btn-ghost btn-sm">← 管理画面</a>
    </div>
  </div>
</header>

<div id="toast"></div>

<div id="auth-guard" style="display:none;text-align:center;padding:4rem">
  <p style="margin-bottom:1rem">管理者ログインが必要です</p>
  <a href="/admin/login.html" class="btn btn-primary">ログイン</a>
</div>

<div id="app" style="display:none">
  <div id="loading-screen" style="text-align:center;padding:5rem 1rem">
    <div class="spinner" style="margin:0 auto 1rem"></div>
    <p style="font-size:0.875rem;color:var(--text-secondary)">読み込み中...</p>
  </div>

  <div id="edit-screen" style="display:none">
    <div class="edit-page">

      <!-- Header -->
      <div class="page-title" id="page-title">イベント編集</div>
      <p class="page-sub" id="page-sub">Event Settings</p>

      <!-- Draft restore banner (shown when draft exists) -->
      <div id="draft-banner" class="draft-banner warn" style="display:none">
        <div class="draft-label">
          <div class="draft-dot warn"></div>
          <span id="draft-banner-msg" style="color:#ffc800">前回の未保存の変更が見つかりました</span>
        </div>
        <div style="display:flex;gap:0.5rem">
          <button class="btn btn-ghost btn-sm" id="btn-restore-draft">↩ 復元する</button>
          <button class="btn btn-ghost btn-sm" id="btn-discard-draft" style="color:var(--c-red)">✕ 破棄</button>
        </div>
      </div>

      <!-- ① 基本情報 -->
      <div class="section-card">
        <div class="section-card-header">
          <span class="section-card-icon">🎵</span>
          <span class="section-card-title">基本情報</span>
        </div>
        <div class="section-card-body">
          <div class="form-group">
            <label class="form-label">イベントタイトル *</label>
            <input type="text" class="form-input" id="f-title" placeholder="例: Jazz Night Vol.12">
          </div>
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label">開催日時</label>
              <input type="datetime-local" class="form-input" id="f-event-at">
              <label class="tbd-toggle"><input type="checkbox" id="f-event-at-tbd"> 日時未定（後日設定する）</label>
            </div>
            <div class="form-group">
              <label class="form-label">開場時刻</label>
              <input type="datetime-local" class="form-input" id="f-doors-open">
              <label class="tbd-toggle"><input type="checkbox" id="f-doors-open-tbd"> 時刻未定（後日設定する）</label>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">説明・概要</label>
            <textarea class="form-input" id="f-description" rows="4" placeholder="イベントの説明文..."></textarea>
          </div>

          <!-- ヒーロー画像：直接アップロード＋クロップ -->
          <div class="form-group">
            <label class="form-label">ヒーロー画像</label>
            <div id="hero-upload-area" style="border:1px dashed var(--border-hi);border-radius:var(--r);overflow:hidden;cursor:pointer;position:relative;background:var(--bg-raised)">
              <!-- プレビュー＋クロップ -->
              <div id="hero-crop-wrap" style="display:none;position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000;touch-action:none">
                <img id="hero-crop-img" src="" alt="" style="position:absolute;max-width:none;cursor:move;user-select:none;-webkit-user-select:none" draggable="false">
                <!-- グリッドオーバーレイ -->
                <div style="position:absolute;inset:0;pointer-events:none;background:
                  linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px) 0 33.3%/100% 33.3% no-repeat,
                  linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px) 0 66.6%/100% 33.3% no-repeat,
                  linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px) 33.3% 0/33.3% 100% no-repeat,
                  linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px) 66.6% 0/33.3% 100% no-repeat"></div>
                <!-- 操作ヒント -->
                <div id="hero-crop-hint" style="position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:.72rem;color:rgba(255,255,255,.6);pointer-events:none">
                  ドラッグ: 位置調整 ／ ピンチ: 拡縮
                </div>
                <!-- ズームコントロール -->
                <div style="position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px">
                  <button type="button" id="hero-zoom-in"  style="width:32px;height:32px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);border-radius:3px;color:#fff;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center">＋</button>
                  <button type="button" id="hero-zoom-out" style="width:32px;height:32px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);border-radius:3px;color:#fff;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center">－</button>
                </div>
              </div>
              <!-- 空状態 -->
              <div id="hero-empty" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;padding:2rem;aspect-ratio:16/9">
                <div style="font-size:2rem;opacity:.3">🖼</div>
                <div style="font-size:.85rem;color:var(--fg-2)">クリックまたはドラッグ＆ドロップで画像を選択</div>
                <div style="font-size:.72rem;color:var(--fg-3)">JPEG / PNG / WebP — 圧縮なしでアップロード</div>
              </div>
              <!-- 隠しinput -->
              <input type="file" id="hero-file-input" accept="image/jpeg,image/png,image/webp,image/gif" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">
            </div>
            <!-- アクションバー -->
            <div id="hero-actions" style="display:none;margin-top:.5rem;display:none;gap:.5rem;flex-wrap:wrap;align-items:center">
              <button type="button" id="hero-reselect" class="btn btn-ghost btn-sm">別の画像を選択</button>
              <button type="button" id="hero-reset-crop" class="btn btn-ghost btn-sm">位置リセット</button>
              <button type="button" id="hero-remove" class="btn btn-sm" style="color:var(--c-red);border-color:rgba(224,85,85,.25)">削除</button>
              <span id="hero-file-name" style="font-size:.72rem;color:var(--fg-3);margin-left:auto"></span>
            </div>
            <!-- DB保存用URL（Supabase Storageへのアップロード後のURL、またはcrop情報） -->
            <input type="hidden" id="f-hero-image">
            <!-- クロップ情報 -->
            <input type="hidden" id="f-hero-crop-x" value="0">
            <input type="hidden" id="f-hero-crop-y" value="0">
            <input type="hidden" id="f-hero-crop-scale" value="1">
          </div>
        </div>
      </div>

      <!-- ② 会場 -->
      <div class="section-card">
        <div class="section-card-header">
          <span class="section-card-icon">📍</span>
          <span class="section-card-title">会場情報</span>
        </div>
        <div class="section-card-body">
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label">会場名 *</label>
              <input type="text" class="form-input" id="f-venue-name" placeholder="例: Jazz Bar BLUE NOTE">
            </div>
            <div class="form-group">
              <label class="form-label">住所</label>
              <input type="text" class="form-input" id="f-venue-address" placeholder="例: 東京都渋谷区...">
            </div>
          </div>
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label">緯度（任意）</label>
              <input type="number" class="form-input" id="f-lat" placeholder="35.6812" step="0.0001">
            </div>
            <div class="form-group">
              <label class="form-label">経度（任意）</label>
              <input type="number" class="form-input" id="f-lng" placeholder="139.7671" step="0.0001">
            </div>
          </div>
        </div>
      </div>

      <!-- ③ チケット -->
      <div class="section-card">
        <div class="section-card-header">
          <span class="section-card-icon">🎫</span>
          <span class="section-card-title">チケット・定員</span>
        </div>
        <div class="section-card-body">
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label">チケット料金（円）*</label>
              <input type="number" class="form-input" id="f-ticket-price" placeholder="3000" min="0" step="100">
            </div>
            <div class="form-group">
              <label class="form-label">定員（席数）</label>
              <input type="number" class="form-input" id="f-capacity" placeholder="50" min="1">
              <p id="actual-seat-count" style="font-size:0.72rem;color:var(--text-tertiary);margin-top:0.3rem"></p>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">注意事項・備考</label>
            <textarea class="form-input" id="f-notes" rows="3" placeholder="当日の注意事項など..."></textarea>
          </div>
        </div>
      </div>

      <!-- ④ 出演者 -->
      <div class="section-card">
        <div class="section-card-header">
          <span class="section-card-icon">🎷</span>
          <span class="section-card-title">出演者</span>
        </div>
        <div class="section-card-body">
          <div id="performers-list" class="dynamic-rows"></div>
          <button class="btn-add-row" id="btn-add-performer">＋ 出演者を追加</button>
        </div>
      </div>

      <!-- ⑤ タイムテーブル -->
      <div class="section-card">
        <div class="section-card-header">
          <span class="section-card-icon">🕐</span>
          <span class="section-card-title">タイムテーブル</span>
        </div>
        <div class="section-card-body">
          <div id="timetable-list" class="dynamic-rows"></div>
          <button class="btn-add-row" id="btn-add-timetable">＋ タイムテーブルを追加</button>
        </div>
      </div>

      <!-- ⑥ 公開設定 -->
      <div class="section-card">
        <div class="section-card-header">
          <span class="section-card-icon">📢</span>
          <span class="section-card-title">公開設定</span>
        </div>
        <div class="section-card-body">
          <div class="form-group">
            <label class="form-label">ステータス</label>
            <div class="status-btns">
              <button class="status-btn" data-val="draft">下書き</button>
              <button class="status-btn" data-val="published">公開</button>
              <button class="status-btn" data-val="ended">終了</button>
            </div>
            <input type="hidden" id="f-status" value="draft">
            <p style="font-size:0.72rem;color:var(--text-secondary);margin-top:0.4rem">「下書き」の状態では一般ユーザーに表示されません</p>
          </div>
          <div class="form-group">
            <label class="form-label">公開開始日時（任意）</label>
            <input type="datetime-local" class="form-input" id="f-publish-at">
            <p style="font-size:0.72rem;color:var(--text-secondary);margin-top:0.25rem">設定するとこの日時以降に自動的に一覧へ表示されます</p>
          </div>
        </div>
      </div>

      <!-- Seat layout link -->
      <div id="seat-layout-link" style="display:none;margin-bottom:1.25rem">
        <a id="btn-go-layout" href="#" class="btn btn-ghost btn-full">
          🗺 座席レイアウトエディタを開く
        </a>
      </div>

    </div><!-- .edit-page -->
  </div><!-- #edit-screen -->
</div><!-- #app -->

<!-- Fixed bottom actions bar -->
<div class="actions-bar" id="actions-bar" style="display:none">
  <div class="actions-bar-inner">
    <div class="autosave-label">
      <div class="dot" id="autosave-dot"></div>
      <span id="autosave-label-text">自動保存: 待機中</span>
    </div>
    <button class="btn btn-ghost" id="btn-discard-changes" style="color:var(--c-red)">変更を破棄</button>
    <button class="btn btn-primary btn-lg" id="btn-save-event">
      <span id="save-spinner" class="spinner" style="display:none"></span>
      💾 保存する
    </button>
  </div>
</div>

<script type="module">
import { supabase } from '/core/supabase.js';

// ── Utils ─────────────────────────────────────────────────────
function showToast(msg, ms=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

function $(id) { return document.getElementById(id); }

// ── Draft system ──────────────────────────────────────────────
const DRAFT_KEY_PREFIX = 'jazzin_event_draft_';

function draftKey(id) { return `${DRAFT_KEY_PREFIX}${id}`; }

let EVENT_ID    = null;   // null = 新規
let isNewEvent  = false;
let autosaveTimer = null;
let draftData   = null;   // currently stored draft

function saveDraft() {
  const data = collectFormData();
  data._savedAt = new Date().toISOString();
  try {
    localStorage.setItem(draftKey(EVENT_ID || '_new'), JSON.stringify(data));
  } catch { /* quota */ }
  setAutosaveState('saved');
}

function loadStoredDraft(id) {
  try {
    const raw = localStorage.getItem(draftKey(id || '_new'));
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function clearStoredDraft(id) {
  localStorage.removeItem(draftKey(id || '_new'));
}

function scheduleAutosave() {
  setAutosaveState('saving');
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(saveDraft, 1500);
}

function setAutosaveState(state) {
  const dot  = $('autosave-dot');
  const lbl  = $('autosave-label-text');
  if (!dot || !lbl) return;
  dot.className = 'dot ' + state;
  if (state === 'saving') lbl.textContent = '自動保存中...';
  else if (state === 'saved') {
    const t = new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    lbl.textContent = `下書き保存済み ${t}`;
  } else {
    lbl.textContent = '自動保存: 待機中';
  }
}

// ── ページ離脱警告 ────────────────────────────────────────────
let hasUnsaved = false;

function markDirty() {
  hasUnsaved = true;
  scheduleAutosave();
}

window.addEventListener('beforeunload', e => {
  if (hasUnsaved) { e.preventDefault(); e.returnValue = ''; }
});

// ── Form collection / population ──────────────────────────────
function collectFormData() {
  // capacity: 空欄の場合は undefined にして UPDATE 時に上書きしない
  const capacityRaw = $('f-capacity')?.value.trim();
  const capacity    = capacityRaw ? (parseInt(capacityRaw) || null) : null;

  return {
    title:         $('f-title')?.value.trim() || '',
    event_at:      $('f-event-at-tbd')?.checked   ? null : ($('f-event-at')?.value || null),
    doors_open_at: $('f-doors-open-tbd')?.checked ? null : ($('f-doors-open')?.value || null),
    description:   $('f-description')?.value.trim() || null,
    hero_image_url:$('f-hero-image')?.value.trim() || null,
    // ✅ トリミング位置もDBに保存する（対応カラムを追加済み）
    hero_crop_x:      parseFloat($('f-hero-crop-x')?.value)     || 0,
    hero_crop_y:       parseFloat($('f-hero-crop-y')?.value)     || 0,
    hero_crop_scale:   parseFloat($('f-hero-crop-scale')?.value) || 1,
    venue_name:    $('f-venue-name')?.value.trim() || '',
    venue_address: $('f-venue-address')?.value.trim() || null,
    venue_lat:     parseFloat($('f-lat')?.value) || null,
    venue_lng:     parseFloat($('f-lng')?.value) || null,
    ticket_price:  parseInt($('f-ticket-price')?.value) || 500,
    capacity,
    notes:         $('f-notes')?.value.trim() || null,
    status:        $('f-status')?.value || 'draft',
    publish_at:    $('f-publish-at')?.value || null,
    performers:    collectDynamicRows('performers-list', ['name', 'role']),
    timetable:     collectDynamicRows('timetable-list',  ['time', 'act']),
  };
}

function collectDynamicRows(listId, fields) {
  const rows = document.querySelectorAll(`#${listId} .dynamic-row`);
  const result = [];
  rows.forEach(row => {
    const obj = {};
    fields.forEach(f => {
      obj[f] = row.querySelector(`[data-field="${f}"]`)?.value.trim() || '';
    });
    if (Object.values(obj).some(v => v)) result.push(obj);
  });
  return result;
}

function populateForm(data) {
  // val が null/undefined の場合はスキップ、空文字はセットする
  const set = (id, val) => { const el = $(id); if (el && val !== null && val !== undefined) el.value = val; };

  set('f-title',        data.title ?? '');
  set('f-event-at',     data.event_at ? toLocalDatetime(data.event_at) : '');
  set('f-doors-open',   data.doors_open_at ? toLocalDatetime(data.doors_open_at) : '');
  if ($('f-event-at-tbd'))    $('f-event-at-tbd').checked    = !data.event_at;
  if ($('f-doors-open-tbd'))  $('f-doors-open-tbd').checked  = !data.doors_open_at;
  set('f-description',  data.description ?? '');
  set('f-hero-image',   data.hero_image_url || '');

  // ✅ hero_crop_* はUIのクロッパー制御用のみ（DBには保存しない）
  set('f-hero-crop-x',     data.hero_crop_x   != null ? data.hero_crop_x   : '0');
  set('f-hero-crop-y',     data.hero_crop_y   != null ? data.hero_crop_y   : '0');
  set('f-hero-crop-scale', data.hero_crop_scale != null ? data.hero_crop_scale : '1');

  // ヒーロー画像クロッパーに反映（initHeroUploader が先に呼ばれている場合）
  if (window.__heroSetUrl && data.hero_image_url) {
    window.__heroSetUrl(
      data.hero_image_url,
      data.hero_crop_x   || 0,
      data.hero_crop_y   || 0,
      data.hero_crop_scale || 1
    );
  }
  set('f-venue-name',   data.venue_name);
  set('f-venue-address',data.venue_address);
  set('f-lat',          data.venue_lat);
  set('f-lng',          data.venue_lng);
  set('f-ticket-price', data.ticket_price);
  set('f-capacity',     data.capacity);
  set('f-notes',        data.notes);
  set('f-publish-at',   data.publish_at ? toLocalDatetime(data.publish_at) : '');

  // Status buttons
  const status = data.status || 'draft';
  $('f-status').value = status;
  document.querySelectorAll('.status-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.val === status);
  });

  // Performers
  const perfList = $('performers-list');
  perfList.innerHTML = '';
  (data.performers || []).forEach(p => addPerformerRow(p.name, p.role));

  // Timetable
  const ttList = $('timetable-list');
  ttList.innerHTML = '';
  (data.timetable || []).forEach(t => addTimetableRow(t.time, t.act));
}

function toLocalDatetime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const pad = n => String(n).padStart(2,'0');
  // ✅ ローカルタイムゾーンの各コンポーネントを使用（UTCではない）
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ✅「未定」チェックボックス連動：チェック時は日時入力を無効化＆クリアする
function setupTbdToggle(checkboxId, inputId) {
  const cb = $(checkboxId);
  const input = $(inputId);
  if (!cb || !input) return;
  const apply = () => {
    input.disabled = cb.checked;
    if (cb.checked) input.value = '';
  };
  cb.addEventListener('change', () => { apply(); markDirty(); });
  apply();
}

// ✅ datetime-local の値（ローカル時刻文字列＝JST）→ ISOString（UTC）に変換
// "YYYY-MM-DDTHH:mm" 形式を受け取る。
// new Date("YYYY-MM-DDTHH:mm") はブラウザのローカルTZ（JST = UTC+9）として解釈されるため
// .toISOString() で UTC に変換すると -9h された正しいUTC値になる。
// ⚠ Safari では "YYYY-MM-DDTHH:mm" をそのまま渡すと Invalid Date になる場合があるため
//    秒を補完して渡す。
function localDatetimeToISO(val) {
  if (!val) return null;
  // "YYYY-MM-DDTHH:mm" → "YYYY-MM-DDTHH:mm:00" でSafari対策
  const normalized = val.length === 16 ? val + ':00' : val;
  const d = new Date(normalized);
  return isNaN(d.getTime()) ? null : d.toISOString();
}

// ── Dynamic rows ──────────────────────────────────────────────
function addPerformerRow(name='', role='') {

}

function esc(str) { return String(str||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ── Auth ──────────────────────────────────────────────────────
async function checkAuth() {
  const { data } = await supabase.auth.getUser();
  if (!data?.user) { $('auth-guard').style.display='block'; return false; }
  $('app').style.display = 'block';
  return true;
}

// ── Load event ────────────────────────────────────────────────
async function loadEvent(id) {
  const { data, error } = await supabase
    .from('events')
    .select('id, title, description, performers, timetable, venue_name, venue_address, venue_lat, venue_lng, event_at, doors_open_at, hero_image_url, hero_crop_x, hero_crop_y, hero_crop_scale, ticket_price, notes, capacity, status, publish_at')
    .eq('id', id)
    .single();
  if (error) throw error;
  return data;
}

// ── Save event ────────────────────────────────────────────────
async function saveEvent() {
  const btn     = $('btn-save-event');
  const spinner = $('save-spinner');
  btn.disabled  = true;
  spinner.style.display = 'inline-block';

  try {
    const data = collectFormData();

    // Validation
    if (!data.title)      { showToast('⚠ タイトルを入力してください'); throw new Error('validation'); }
    if (!data.venue_name) { showToast('⚠ 会場名を入力してください'); throw new Error('validation'); }
    if (!data.ticket_price || data.ticket_price < 0) { showToast('⚠ チケット料金を入力してください'); throw new Error('validation'); }

    // ✅ datetime-local（ローカル時刻 = JST）→ ISOString（UTC）に変換
    // localDatetimeToISO: new Date("YYYY-MM-DDTHH:mm") はブラウザのローカルTZで解釈される
    const payload = {
      ...data,
      event_at:      localDatetimeToISO(data.event_at),
      doors_open_at: localDatetimeToISO(data.doors_open_at),
      publish_at:    localDatetimeToISO(data.publish_at),
    };
    // ✅ DB に存在しないキーを必ず削除
    delete payload._savedAt;

    let savedId = EVENT_ID;

    if (EVENT_ID) {
      const { error } = await supabase.from('events').update(payload).eq('id', EVENT_ID);
      if (error) throw error;
    } else {
      const { data: inserted, error } = await supabase.from('events').insert(payload).select('id').single();
      if (error) throw error;
      savedId = inserted.id;
      EVENT_ID = savedId;
      isNewEvent = false;
      // URL を更新して戻る時にリロードしない
      history.replaceState({}, '', `?id=${savedId}`);
      $('btn-go-layout').href = `/admin/layout-editor.html?event_id=${savedId}`;
      $('seat-layout-link').style.display = 'block';
    }

    // Draft cleared after DB save
    clearStoredDraft(EVENT_ID);
    clearStoredDraft('_new');
    hasUnsaved = false;
    setAutosaveState('');
    $('autosave-label-text').textContent = '✓ 保存しました';

    showToast('✓ イベントを保存しました');

    // ヘッダーのステータス更新
    updateHeaderStatus(payload.status);

  } catch (err) {
    if (err.message !== 'validation') {
      console.error(err);
      showToast('保存に失敗しました: ' + (err.message || err));
    }
  }

  btn.disabled = false;
  spinner.style.display = 'none';
}

function updateHeaderStatus(status) {
  const labels = { draft:'下書き', published:'公開中', ended:'終了' };
  $('header-status').textContent = labels[status] || status;
}

// ── Init ──────────────────────────────────────────────────────
async function init() {
  const ok = await checkAuth();
  if (!ok) return;

  const params = new URLSearchParams(location.search);
  EVENT_ID = params.get('id') || null;
  isNewEvent = !EVENT_ID;

  // Show loading
  $('loading-screen').style.display = 'block';
  $('edit-screen').style.display   = 'none';
  $('actions-bar').style.display   = 'none';

  try {
    let dbData = null;

    if (EVENT_ID) {
      dbData = await loadEvent(EVENT_ID);
      $('page-title').textContent = 'イベント編集';
      updateHeaderStatus(dbData.status);
      $('btn-go-layout').href = `/admin/layout-editor.html?event_id=${EVENT_ID}`;
      $('seat-layout-link').style.display = 'block';

      // ✅ 定員(手入力)とは別に、実際に座席レイアウトエディタで
      //    設定されている座席数を正確に表示する（情報の食い違い防止）
      const { count: actualSeatCount } = await supabase
        .from('seats')
        .select('id', { count: 'exact', head: true })
        .eq('event_id', EVENT_ID);
      const seatCountEl = $('actual-seat-count');
      if (seatCountEl) {
        seatCountEl.textContent = `現在のレイアウトに設定されている座席数：${actualSeatCount ?? 0}席`;
      }
    } else {
      $('page-title').innerHTML = 'イベント作成 <span class="new-badge">NEW</span>';
      $('page-sub').textContent = 'Create New Event';
    }

    // ── Check for existing draft ────────────────────────────
    const stored = loadStoredDraft(EVENT_ID || '_new');
    draftData = stored;

    if (stored) {
      const draftDate = new Date(stored._savedAt).toLocaleString('ja-JP');
      $('draft-banner-msg').textContent = `前回の未保存の変更（${draftDate}）が見つかりました`;
      $('draft-banner').style.display = 'flex';
    }

    // ✅ 既存イベントを開いた時は、必ず現在のDBの内容をそのまま表示する。
    //    下書きがあっても自動では適用しない（実際のデータと食い違って見える事故を防ぐため）。
    //    復元したい場合は上のバナーから明示的に「復元する」を押してもらう。
    if (dbData) {
      populateForm(dbData);
    } else if (stored) {
      // 新規作成中の下書きは、まだDBに何も無いのでそのまま表示してよい
      populateForm(stored);
    } else {
      // 新規: デフォルト値
      populateForm({ status: 'draft', ticket_price: 3000 });
    }

  } catch (err) {
    console.error(err);
    showToast('読み込みに失敗しました');
    // エラーでもフォームは表示
  }

  $('loading-screen').style.display = 'none';
  $('edit-screen').style.display   = 'block';
  $('actions-bar').style.display   = 'flex';

  // Attach change listeners to all static inputs
  document.querySelectorAll('#edit-screen .form-input, #edit-screen textarea')
    .forEach(el => el.addEventListener('input', markDirty));

  // ✅「未定」チェックボックス：チェック時は入力欄を無効化し値をクリアする
  setupTbdToggle('f-event-at-tbd',   'f-event-at');
  setupTbdToggle('f-doors-open-tbd', 'f-doors-open');

  // Status buttons
  document.querySelectorAll('.status-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      $('f-status').value = btn.dataset.val;
      markDirty();
    });
  });

  // Dynamic row add buttons
  $('btn-add-performer').addEventListener('click', () => { addPerformerRow(); markDirty(); });
  $('btn-add-timetable').addEventListener('click', () => { addTimetableRow(); markDirty(); });

  // Draft banner actions
  $('btn-restore-draft').addEventListener('click', () => {
    if (draftData) { populateForm(draftData); showToast('↩ 下書きを復元しました'); }
    $('draft-banner').style.display = 'none';
  });

  $('btn-discard-draft').addEventListener('click', () => {
    clearStoredDraft(EVENT_ID || '_new');
    draftData = null;
    $('draft-banner').style.display = 'none';
    // Re-load DB data
    if (EVENT_ID) {
      loadEvent(EVENT_ID).then(data => {
        populateForm(data);
        showToast('✕ 下書きを破棄しました');
      });
    } else {
      populateForm({ status: 'draft', ticket_price: 3000 });
      showToast('✕ 下書きを破棄しました');
    }
  });

  // Discard all changes
  $('btn-discard-changes').addEventListener('click', async () => {
    if (!confirm('変更をすべて破棄しますか？\n保存されていない内容は失われます。')) return;
    clearStoredDraft(EVENT_ID || '_new');
    hasUnsaved = false;
    if (EVENT_ID) {
      try {
        const data = await loadEvent(EVENT_ID);
        populateForm(data);
        showToast('変更を破棄しました');
      } catch { showToast('読み込みに失敗しました'); }
    } else {
      populateForm({ status: 'draft', ticket_price: 3000 });
      showToast('変更を破棄しました');
    }
  });

  // Save button
  $('btn-save-event').addEventListener('click', saveEvent);

  // ── ヒーロー画像 アップロード＋クロップ ────────────────────────
  initHeroUploader();
}

// ═══════════════════════════════════════════════════════════
// ヒーロー画像アップローダー
// ・直接アップロード（圧縮なし） → Supabase Storage
// ・表示領域(16:9)内でドラッグ・ピンチ操作で位置・拡縮を調整
// ・保存時に crop 情報を DB へ一緒に保存
// ═══════════════════════════════════════════════════════════
function initHeroUploader() {
  const fileInput    = $('hero-file-input');
  const uploadArea   = $('hero-upload-area');
  const cropWrap     = $('hero-crop-wrap');
  const cropImg      = $('hero-crop-img');
  const emptyState   = $('hero-empty');
  const actionsBar   = $('hero-actions');
  const heroUrlInput = $('f-hero-image');
  const cropXInput   = $('f-hero-crop-x');
  const cropYInput   = $('f-hero-crop-y');
  const cropScInput  = $('f-hero-crop-scale');

  let imgW = 0, imgH = 0;        // 自然サイズ
  let viewW = 0, viewH = 0;      // 表示エリアサイズ
  let posX = 0, posY = 0;        // 現在のオフセット(px)
  let scale = 1;                  // 現在のスケール
  let minScale = 1;              // 最小スケール（エリアを覆う最小値）

  // ── ドラッグ変数 ──
  let dragging = false;
  let dragStartX = 0, dragStartY = 0;
  let dragOriginX = 0, dragOriginY = 0;

  // ── ピンチ変数 ──
  let pinching = false;
  let pinchDist0 = 0, scale0 = 1;

  // 既存データのロード（編集時）
  function loadExistingHero(url, cropX, cropY, cropScale) {
    if (!url) return;
    cropImg.src = url;
    cropImg.onload = () => {
      imgW = cropImg.naturalWidth;
      imgH = cropImg.naturalHeight;
      updateViewSize();
      scale    = parseFloat(cropScale) || minScale;
      posX     = parseFloat(cropX) || 0;
      posY     = parseFloat(cropY) || 0;
      clampPos();
      applyTransform();
      showCropUI();
    };
    cropImg.onerror = () => {
      // URL が壊れていてもクロップUIは出さない
      showEmptyState();
    };
  }

  // 既存URLとcrop情報があれば復元
  const existingUrl = heroUrlInput.value;
  if (existingUrl) {
    loadExistingHero(
      existingUrl,
      parseFloat(cropXInput.value) || 0,
      parseFloat(cropYInput.value) || 0,
      parseFloat(cropScInput.value) || 1
    );
  }

  // ── ファイル選択 ──
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (file) handleFile(file);
  });

  // ── ドラッグ＆ドロップ ──
  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--accent)'; });
  uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = 'var(--border-hi)'; });
  uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.style.borderColor = 'var(--border-hi)';
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) handleFile(file);
  });

  // アクションボタン
  $('hero-reselect').addEventListener('click', () => fileInput.click());
  $('hero-reset-crop').addEventListener('click', resetCrop);
  $('hero-remove').addEventListener('click', removeHero);
  $('hero-zoom-in').addEventListener('click',  () => { scale = Math.min(scale * 1.15, 5); clampPos(); applyTransform(); saveCrop(); });
  $('hero-zoom-out').addEventListener('click', () => { scale = Math.max(scale / 1.15, minScale); clampPos(); applyTransform(); saveCrop(); });

  async function handleFile(file) {
    // プレビュー表示（アップロード前）
    const localUrl = URL.createObjectURL(file);
    cropImg.src = localUrl;
    cropImg.onload = async () => {
      imgW = cropImg.naturalWidth;
      imgH = cropImg.naturalHeight;
      updateViewSize();
      resetCropValues();
      applyTransform();
      showCropUI();
      $('hero-file-name').textContent = `${file.name} (${(file.size/1024/1024).toFixed(1)} MB)`;

      // Supabase Storage へ圧縮なしでアップロード
      await uploadToStorage(file);
    };
  }

  async function uploadToStorage(file) {
    try {
      const ext  = file.name.split('.').pop().toLowerCase();
      const path = `hero/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;

      showToast('画像をアップロード中...');

      const { data, error } = await supabase.storage
        .from('event-images')
        .upload(path, file, {
          cacheControl: '3600',
          upsert: false,
          contentType: file.type,
        });

      if (error) {
        // バケット未作成の場合のフォールバック：base64 Data URL として保存
        console.warn('Storage upload failed, using objectURL:', error.message);
        // objectURL は永続しないので data URL に変換
        const reader = new FileReader();
        reader.onload = e => {
          heroUrlInput.value = e.target.result;
          saveCrop();
          showToast('画像を設定しました（ローカル）');
        };
        reader.readAsDataURL(file);
        return;
      }

      const { data: { publicUrl } } = supabase.storage
        .from('event-images')
        .getPublicUrl(data.path);

      heroUrlInput.value = publicUrl;
      saveCrop();
      showToast('✓ 画像をアップロードしました');
      markDirty();

    } catch (err) {
      console.error('upload error:', err);
      showToast('アップロードに失敗しました: ' + err.message);
    }
  }

  function updateViewSize() {
    viewW = cropWrap.clientWidth  || cropWrap.offsetWidth  || 560;
    viewH = cropWrap.clientHeight || cropWrap.offsetHeight || 315;
    // 最小スケール：画像がエリア全体を覆う最小サイズ
    const scaleW = viewW / imgW;
    const scaleH = viewH / imgH;
    minScale = Math.max(scaleW, scaleH);
    if (scale < minScale) scale = minScale;
  }

  function resetCropValues() {
    updateViewSize();
    scale = minScale;
    posX  = (viewW - imgW * scale) / 2;
    posY  = (viewH - imgH * scale) / 2;
    saveCrop();
  }

  function resetCrop() {
    resetCropValues();
    applyTransform();
    saveCrop();
  }

  function clampPos() {
    updateViewSize();
    const sw = imgW * scale;
    const sh = imgH * scale;
    const minX = Math.min(0, viewW - sw);
    const minY = Math.min(0, viewH - sh);
    const maxX = Math.max(0, viewW - sw);
    const maxY = Math.max(0, viewH - sh);
    posX = Math.max(minX, Math.min(maxX, posX));
    posY = Math.max(minY, Math.min(maxY, posY));
  }

  function applyTransform() {
    cropImg.style.width  = (imgW * scale) + 'px';
    cropImg.style.height = (imgH * scale) + 'px';
    cropImg.style.left   = posX + 'px';
    cropImg.style.top    = posY + 'px';
  }

  function saveCrop() {
    cropXInput.value  = posX.toFixed(3);
    cropYInput.value  = posY.toFixed(3);
    cropScInput.value = scale.toFixed(5);
  }

  // ── マウスドラッグ ──
  cropWrap.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    dragging = true;
    dragStartX = e.clientX; dragStartY = e.clientY;
    dragOriginX = posX; dragOriginY = posY;
    cropWrap.style.cursor = 'grabbing';
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    posX = dragOriginX + (e.clientX - dragStartX);
    posY = dragOriginY + (e.clientY - dragStartY);
    clampPos(); applyTransform();
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false; cropWrap.style.cursor = 'move';
    saveCrop(); markDirty();
  });

  // ── マウスホイールズーム ──
  cropWrap.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    const newScale = Math.max(minScale, Math.min(5, scale * delta));
    // ホイール位置を中心にズーム
    const rect  = cropWrap.getBoundingClientRect();
    const mx    = e.clientX - rect.left;
    const my    = e.clientY - rect.top;
    const ratio = newScale / scale;
    posX = mx - ratio * (mx - posX);
    posY = my - ratio * (my - posY);
    scale = newScale;
    clampPos(); applyTransform(); saveCrop(); markDirty();
  }, { passive: false });

  // ── タッチ：ドラッグ＋ピンチ ──
  cropWrap.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      dragging = true;
      dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
      dragOriginX = posX; dragOriginY = posY;
    } else if (e.touches.length === 2) {
      dragging = false; pinching = true;
      pinchDist0 = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      scale0 = scale;
    }
    e.preventDefault();
  }, { passive: false });

  cropWrap.addEventListener('touchmove', e => {
    e.preventDefault();
    if (dragging && e.touches.length === 1) {
      posX = dragOriginX + (e.touches[0].clientX - dragStartX);
      posY = dragOriginY + (e.touches[0].clientY - dragStartY);
      clampPos(); applyTransform();
    } else if (pinching && e.touches.length === 2) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      scale = Math.max(minScale, Math.min(5, scale0 * (dist / pinchDist0)));
      clampPos(); applyTransform();
    }
  }, { passive: false });

  cropWrap.addEventListener('touchend', () => {
    dragging = false; pinching = false;
    saveCrop(); markDirty();
  });

  // ── UI state helpers ──
  function showCropUI() {
    emptyState.style.display    = 'none';
    fileInput.style.display     = 'none';   // file input は非表示（再選択ボタンで代替）
    cropWrap.style.display      = 'block';
    actionsBar.style.display    = 'flex';
    $('hero-crop-hint').style.display = 'block';
  }
  function showEmptyState() {
    cropWrap.style.display      = 'none';
    actionsBar.style.display    = 'none';
    emptyState.style.display    = 'flex';
    fileInput.style.display     = '';
  }
  function removeHero() {
    heroUrlInput.value = '';
    cropXInput.value   = '0';
    cropYInput.value   = '0';
    cropScInput.value  = '1';
    cropImg.src        = '';
    showEmptyState();
    markDirty();
    showToast('画像を削除しました');
  }

  // ResizeObserver で表示エリアサイズ変更に追従
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(() => {
      if (cropImg.src && cropWrap.style.display !== 'none') {
        updateViewSize();
        if (scale < minScale) scale = minScale;
        clampPos(); applyTransform();
      }
    }).observe(cropWrap);
  }

  // populateForm から呼ばれる想定のグローバル関数
  window.__heroSetUrl = (url, cx, cy, cs) => loadExistingHero(url, cx, cy, cs);
}

init();
</script>
