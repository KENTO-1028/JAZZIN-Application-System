<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000a10">
<title>JAZZIN — スタッフログイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<link rel="stylesheet" href="/ui/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
body { display:flex; align-items:center; justify-content:center; min-height:100dvh; overflow:hidden; padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0); }
.login-wrap { width:100%; max-width:360px; padding:clamp(1rem,4vw,1.5rem); position:relative; z-index:1; }
.login-logo {
  text-align:center;
  font-family: var(--font-display);
  font-size: 2.8rem; letter-spacing: 0.18em;
  background: var(--grad-text); background-size:200% 200%;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom: 0.5rem;
}
.login-sub {
  text-align:center;
  font-family: var(--font-body);
  font-size:0.75rem; font-weight:500;
  letter-spacing:0.06em; text-transform:uppercase;
  color:var(--text-tertiary); margin-bottom:1.75rem;
}
.login-divider {
  width:32px; height:1px; margin:0 auto 1.5rem;
  background: var(--border-strong);
}
.error-msg { font-size:0.8rem; color:var(--c-red); text-align:center; min-height:1.2em; }
.form-stack { display:flex; flex-direction:column; gap:0.875rem; }
</style>
</head>
<body>

<div class="aurora-wrap">
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
</div>

<div class="login-wrap">
  <div class="login-logo">JAZZIN</div>
  <div class="login-divider"></div>
  <p class="login-sub">Staff Login</p>

  <div class="glass-card" style="padding:1.5rem">
    <div class="form-stack">
      <div class="form-group">
        <label class="form-label">メールアドレス</label>
        <input type="email" class="form-input" id="f-email" autocomplete="email" placeholder="admin@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">パスワード</label>
        <input type="password" class="form-input" id="f-pass" autocomplete="current-password" placeholder="••••••••">
      </div>
      <p class="error-msg" id="err-msg"></p>
      <button class="btn btn-primary btn-full" id="btn-login" style="height:48px">
        <span id="spinner" class="spinner" style="display:none"></span>
        ログイン
      </button>
      <a href="/" class="btn btn-ghost btn-full btn-sm" style="text-align:center">← イベント一覧へ</a>
    </div>
  </div>
</div>

<script type="module">
import { supabase, signInAdmin } from '/core/supabase.js';

(async () => {
  const { data } = await supabase.auth.getUser();
  if (data?.user) location.href = '/admin/index.html';
})();

const emailEl = document.getElementById('f-email');
const passEl  = document.getElementById('f-pass');
const errEl   = document.getElementById('err-msg');
const btn     = document.getElementById('btn-login');
const spinner = document.getElementById('spinner');

async function login() {
  errEl.textContent = '';
  const email = emailEl.value.trim();
  const pass  = passEl.value;
  if (!email || !pass) { errEl.textContent = 'メールとパスワードを入力してください'; return; }
  btn.disabled = true;
  spinner.style.display = 'inline-block';
  try {
    await signInAdmin(email, pass);
    location.href = new URLSearchParams(location.search).get('next') || '/admin/index.html';
  } catch {
    errEl.textContent = 'メールアドレスまたはパスワードが違います';
    btn.disabled = false;
    spinner.style.display = 'none';
  }
}

btn.addEventListener('click', login);
[emailEl, passEl].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') login(); }));
</script>
</body>
</html>
