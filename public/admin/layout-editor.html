<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000a10">
<title>JAZZIN — 座席レイアウトエディタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<link rel="stylesheet" href="/ui/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
body { min-height:100dvh; }
.editor-layout { display:grid; grid-template-columns:260px 1fr; min-height:calc(100dvh - 56px); gap:0; }
.editor-sidebar {
  background:rgba(0,10,20,0.9); backdrop-filter:blur(20px);
  border-right:1px solid var(--glass-border);
  padding:1.25rem; overflow-y:auto;
  position:sticky; top:56px; height:calc(100dvh - 56px);
}
.editor-main { padding:1.5rem; overflow-y:auto; }
.sidebar-title { font-family:var(--font-display); font-size:0.9rem; letter-spacing:0.2em; color:var(--text-sub); margin-bottom:0.75rem; margin-top:1.25rem; }
.sidebar-title:first-child { margin-top:0; }

/* Tool buttons */
.tool-btn {
  display:flex; align-items:center; gap:0.5rem;
  width:100%; padding:0.6rem 0.75rem;
  background:rgba(0,212,255,0.05); border:1px solid var(--glass-border);
  border-radius:var(--radius); color:var(--text-sub);
  font-size:0.82rem; cursor:pointer; margin-bottom:0.4rem;
  transition:all 120ms; text-align:left; font-family:var(--font-body);
}
.tool-btn:hover { border-color:rgba(0,212,255,0.3); color:var(--text-main); background:rgba(0,212,255,0.1); }
.tool-btn.active { border-color:var(--accent-1); color:var(--accent-1); background:rgba(0,212,255,0.12); box-shadow:0 0 12px rgba(0,212,255,0.15); }
.tool-icon { font-size:1rem; width:20px; text-align:center; flex-shrink:0; }

/* Grid editor */
.grid-editor-wrap { overflow-x:auto; margin-bottom:1rem; }
.grid-editor {
  display:inline-grid;
  gap:4px;
  cursor:crosshair;
  user-select:none;
}
.editor-cell {
  width:40px; height:40px;
  border-radius:5px; border:1px solid var(--glass-border);
  display:flex; align-items:center; justify-content:center;
  font-size:0.52rem; font-weight:500;
  cursor:pointer; transition:80ms;
  position:relative;
}
.editor-cell[data-type="seat"] {
  background:rgba(0,212,255,0.06); border-color:rgba(0,212,255,0.2);
  color:var(--text-sub);
}
.editor-cell[data-type="seat"]:hover { background:rgba(0,212,255,0.15); border-color:var(--accent-1); }
.editor-cell[data-type="aisle"] {
  background:transparent; border-color:rgba(255,255,255,0.04);
  color:transparent;
}
.editor-cell[data-type="stage"] {
  background:rgba(0,212,255,0.08); border-color:rgba(0,212,255,0.3);
  color:var(--accent-1); font-size:0.5rem; font-weight:700; letter-spacing:0.1em;
}
.editor-cell[data-type="entrance"] {
  background:rgba(127,255,212,0.1); border-color:rgba(127,255,212,0.4);
  color:var(--c-green); font-size:0.5rem;
}
.editor-cell[data-type="wall"] {
  background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.15);
  color:var(--c-dim);
}

/* Stage position selector */
.stage-pos-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; margin-bottom:0.5rem; }
.stage-pos-btn {
  padding:0.4rem; text-align:center; font-size:0.7rem;
  background:rgba(0,212,255,0.05); border:1px solid var(--glass-border);
  border-radius:4px; cursor:pointer; color:var(--text-sub);
}
.stage-pos-btn.active { border-color:var(--accent-1); color:var(--accent-1); background:rgba(0,212,255,0.1); }
.stage-pos-btn:hover { border-color:rgba(0,212,255,0.3); }

/* Legend */
.legend-row { display:flex; align-items:center; gap:6px; font-size:0.75rem; color:var(--text-sub); margin-bottom:4px; }
.legend-dot { width:14px; height:14px; border-radius:3px; flex-shrink:0; }

/* Stats */
.stat-pill {
  display:inline-flex; align-items:center; gap:4px;
  background:rgba(0,212,255,0.08); border:1px solid rgba(0,212,255,0.15);
  border-radius:20px; padding:0.25rem 0.75rem; font-size:0.78rem; color:var(--accent-1);
  margin-right:0.5rem; margin-bottom:0.5rem;
}

@media (max-width:640px) {
  .editor-layout { grid-template-columns:1fr; }
  .editor-sidebar { position:static; height:auto; }
}
</style>
</head>
<body>

<div class="aurora-wrap" style="opacity:0.4">
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
</div>

<header class="header">
  <div class="header-inner">
    <a href="/admin/index.html" class="logo"><img src="/assets/jazzin_logo.png" alt="JAZZIN" height="24"></a>
    <div style="display:flex;gap:0.5rem;align-items:center">
      <span id="event-title-header" style="font-size:0.8rem;color:var(--text-sub)"></span>
      <a href="/admin/index.html" class="btn btn-ghost btn-sm">← 管理画面</a>
    </div>
  </div>
</header>

<div id="toast"></div>

<div id="auth-guard" style="display:none;text-align:center;padding:4rem">
  <p style="margin-bottom:1rem">管理者ログインが必要です</p>
  <a href="/admin/login.html" class="btn btn-primary">ログイン</a>
</div>

<div id="app" style="display:none">
  <!-- イベント未選択 -->
  <div id="event-select-wrap" class="container" style="padding:2rem 1.25rem">
    <h2 style="font-family:var(--font-display);letter-spacing:0.1em;margin-bottom:1.5rem">LAYOUT EDITOR</h2>
    <p style="color:var(--text-sub);margin-bottom:1rem">編集するイベントを選択してください</p>
    <div id="event-select-list"></div>
  </div>

  <!-- エディタ本体 -->
  <div id="editor-wrap" class="editor-layout" style="display:none">

    <!-- Sidebar -->
    <aside class="editor-sidebar">

      <p class="sidebar-title">グリッドサイズ</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:0.75rem">
        <div class="form-group">
          <label class="form-label">行数</label>
          <input type="number" class="form-input" id="rows-input" value="6" min="1" max="20" style="padding:0.4rem 0.6rem">
        </div>
        <div class="form-group">
          <label class="form-label">列数</label>
          <input type="number" class="form-input" id="cols-input" value="6" min="1" max="20" style="padding:0.4rem 0.6rem">
        </div>
      </div>
      <button class="btn btn-ghost btn-full btn-sm" id="btn-resize" style="margin-bottom:0.75rem">グリッドを再生成</button>

      <p class="sidebar-title">ツール</p>
      <button class="tool-btn active" data-tool="seat" id="tool-seat">
        <span class="tool-icon">🪑</span>座席
      </button>
      <button class="tool-btn" data-tool="aisle" id="tool-aisle">
        <span class="tool-icon">　</span>通路（空白）
      </button>
      <button class="tool-btn" data-tool="entrance" id="tool-entrance">
        <span class="tool-icon">🚪</span>出入口
      </button>
      <button class="tool-btn" data-tool="stage" id="tool-stage">
        <span class="tool-icon">🎵</span>ステージ
      </button>
      <button class="tool-btn" data-tool="wall" id="tool-wall">
        <span class="tool-icon">🧱</span>壁・障害物
      </button>

      <p class="sidebar-title">ステージ表示位置</p>
      <div class="stage-pos-grid">
        <div></div>
        <button class="stage-pos-btn active" data-pos="top">上</button>
        <div></div>
        <button class="stage-pos-btn" data-pos="left">左</button>
        <button class="stage-pos-btn" data-pos="none">なし</button>
        <button class="stage-pos-btn" data-pos="right">右</button>
        <div></div>
        <button class="stage-pos-btn" data-pos="bottom">下</button>
        <div></div>
      </div>

      <p class="sidebar-title">表示サイズ設定</p>
      <div class="form-group" style="margin-bottom:0.5rem">
        <label class="form-label">座席サイズ (px)</label>
        <div style="display:flex;align-items:center;gap:0.5rem">
          <input type="range" id="seat-size-range" min="24" max="64" value="36" style="flex:1;accent-color:var(--accent-1)">
          <span id="seat-size-val" style="font-size:0.78rem;color:var(--accent-1);min-width:28px;text-align:right">36</span>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:0.5rem">
        <label class="form-label">座席間隔 (px)</label>
        <div style="display:flex;align-items:center;gap:0.5rem">
          <input type="range" id="seat-gap-range" min="2" max="12" value="5" style="flex:1;accent-color:var(--accent-1)">
          <span id="seat-gap-val" style="font-size:0.78rem;color:var(--accent-1);min-width:28px;text-align:right">5</span>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:0.5rem">
        <label class="form-label">ステージ高さ (px)</label>
        <div style="display:flex;align-items:center;gap:0.5rem">
          <input type="range" id="stage-height-range" min="24" max="80" value="36" style="flex:1;accent-color:var(--accent-1)">
          <span id="stage-height-val" style="font-size:0.78rem;color:var(--accent-1);min-width:28px;text-align:right">36</span>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:0.75rem">
        <label class="form-label">ステージテキスト</label>
        <input type="text" class="form-input" id="stage-label-input" value="— STAGE —" style="padding:0.35rem 0.6rem;font-size:0.82rem">
      </div>

      <p class="sidebar-title">凡例</p>
      <div class="legend-row"><div class="legend-dot" style="background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.3)"></div>座席</div>
      <div class="legend-row"><div class="legend-dot" style="background:transparent;border:1px solid rgba(255,255,255,0.05)"></div>通路</div>
      <div class="legend-row"><div class="legend-dot" style="background:rgba(127,255,212,0.15);border:1px solid rgba(127,255,212,0.4)"></div>出入口</div>
      <div class="legend-row"><div class="legend-dot" style="background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.4)"></div>ステージ</div>
      <div class="legend-row"><div class="legend-dot" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2)"></div>壁</div>

      <div style="margin-top:1.5rem;display:flex;flex-direction:column;gap:0.5rem">
        <div id="draft-indicator" style="font-size:0.72rem;min-height:1.1em;letter-spacing:0.04em"></div>
        <button class="btn btn-primary btn-full" id="btn-save">💾 保存して反映</button>
        <button class="btn btn-ghost btn-full btn-sm" id="btn-reset">リセット</button>
      </div>

    </aside>

    <!-- Main editor area -->
    <main class="editor-main" style="position:relative;z-index:1">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem">
        <div>
          <h2 style="font-family:var(--font-display);font-size:1.3rem;letter-spacing:0.1em">LAYOUT EDITOR</h2>
          <p style="font-size:0.78rem;color:var(--text-sub);margin-top:2px">クリックまたはドラッグで描画</p>
        </div>
        <div id="seat-stats" style="display:flex;flex-wrap:wrap"></div>
      </div>

      <!-- Stage indicator (top) -->
      <div id="stage-indicator-top" class="stage-label" style="margin-bottom:0.75rem;display:flex;align-items:center;justify-content:center">— STAGE —</div>

      <div class="grid-editor-wrap">
        <div id="grid-editor" class="grid-editor"></div>
      </div>

      <!-- Stage indicator (bottom) -->
      <div id="stage-indicator-bottom" class="stage-label" style="margin-top:0.75rem;display:none;align-items:center;justify-content:center">— STAGE —</div>

      <p style="font-size:0.72rem;color:var(--c-dim);margin-top:0.75rem">
        💡 ドラッグで連続描画できます。保存すると座席テーブルに反映されます。
      </p>
    </main>
  </div>
</div>

<script type="module">
import { supabase, formatDate } from '/core/supabase.js';

// ── State ────────────────────────────────────────────────────
let currentEventId = null;
let currentTool    = 'seat';
let stagePosition  = 'top';
let rows = 6, cols = 6;
let grid = []; // grid[row][col] = { type: 'seat'|'aisle'|'entrance'|'stage'|'wall', label: '' }
let isDragging = false;
let dragType   = null;
let autosaveTimer = null;
let hasUnsavedChanges = false;

// ── Display settings ─────────────────────────────────────────
let displaySettings = {
  seatSize:    36,
  seatGap:     5,
  stageHeight: 36,
  stageLabel:  '— STAGE —',
};

function initDisplayControls() {
  const seatSizeRange   = document.getElementById('seat-size-range');
  const seatGapRange    = document.getElementById('seat-gap-range');
  const stageHeightRange= document.getElementById('stage-height-range');
  const stageLabelInput = document.getElementById('stage-label-input');

  function syncVal(rangeEl, valEl, key) {
    rangeEl.addEventListener('input', () => {
      const v = parseInt(rangeEl.value);
      document.getElementById(valEl).textContent = v;
      displaySettings[key] = v;
      applyDisplaySettings();
      scheduleAutosave();
    });
  }
  syncVal(seatSizeRange,    'seat-size-val',    'seatSize');
  syncVal(seatGapRange,     'seat-gap-val',     'seatGap');
  syncVal(stageHeightRange, 'stage-height-val', 'stageHeight');

  stageLabelInput.addEventListener('input', () => {
    displaySettings.stageLabel = stageLabelInput.value;
    renderGrid();
    scheduleAutosave();
  });
}

function applyDisplaySettings() {
  const grid = document.getElementById('grid-editor');
  if (!grid) return;
  grid.style.gap = `${displaySettings.seatGap}px`;
  // update cell sizes
  document.querySelectorAll('.editor-cell').forEach(c => {
    c.style.width  = `${displaySettings.seatSize}px`;
    c.style.height = `${displaySettings.seatSize}px`;
  });
  // stage indicator height
  ['stage-indicator-top','stage-indicator-bottom'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.height = `${displaySettings.stageHeight}px`;
  });
}

function populateDisplayControls(ds) {
  displaySettings = { ...displaySettings, ...ds };
  const r = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.value = val;
  };
  const s = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  };
  r('seat-size-range',    displaySettings.seatSize);    s('seat-size-val',    displaySettings.seatSize);
  r('seat-gap-range',     displaySettings.seatGap);     s('seat-gap-val',     displaySettings.seatGap);
  r('stage-height-range', displaySettings.stageHeight); s('stage-height-val', displaySettings.stageHeight);
  const lbl = document.getElementById('stage-label-input');
  if (lbl) lbl.value = displaySettings.stageLabel;
}

function showToast(msg, ms=2000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

// ── Draft autosave (localStorage) ────────────────────────────
const DRAFT_PREFIX = 'jazzin_layout_draft_';

function draftKey(eventId) { return `${DRAFT_PREFIX}${eventId}`; }

function saveDraft() {
  if (!currentEventId) return;
  try {
    const payload = getDraftPayload();
    localStorage.setItem(draftKey(currentEventId), JSON.stringify(payload));
    setUnsaved(false);
    updateDraftIndicator('saved');
  } catch { /* quota exceeded — ignore */ }
}

function loadDraft(eventId) {
  try {
    const raw = localStorage.getItem(draftKey(eventId));
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function clearDraft(eventId) {
  localStorage.removeItem(draftKey(eventId));
}

function gridToArray() {
  const arr = [];
  for (let r = 1; r <= rows; r++) {
    for (let c = 1; c <= cols; c++) {
      arr.push({ r, c, type: grid[r][c].type, label: grid[r][c].label });
    }
  }
  return arr;
}

function getDraftPayload() {
  return {
    rows, cols, stagePosition,
    displaySettings: { ...displaySettings },
    grid: gridToArray(),
    savedAt: new Date().toISOString(),
  };
}

function gridFromArray(arr, r, c) {
  initGrid(r, c);
  arr.forEach(cell => {
    if (cell.r <= r && cell.c <= c) {
      grid[cell.r][cell.c] = { type: cell.type, label: cell.label || '' };
    }
  });
}

function scheduleAutosave() {
  setUnsaved(true);
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(saveDraft, 1500);
}

function setUnsaved(val) {
  hasUnsavedChanges = val;
  updateDraftIndicator(val ? 'unsaved' : 'saved');
}

function updateDraftIndicator(state) {
  const el = document.getElementById('draft-indicator');
  if (!el) return;
  if (state === 'unsaved') {
    el.textContent = '● 未保存の変更あり';
    el.style.color = 'var(--accent-1)';
  } else if (state === 'saved') {
    el.textContent = '✓ 下書き保存済み';
    el.style.color = 'var(--c-green)';
  } else {
    el.textContent = '';
  }
}

// ページ離脱時の警告
window.addEventListener('beforeunload', e => {
  if (hasUnsavedChanges) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// ── Auth ─────────────────────────────────────────────────────
async function checkAuth() {
  // getSession() はローカルストレージのトークンを使いRLSに必要なJWTをセットする
  // getUser() はサーバー検証だがセッション再セットを行わない場合がある
  const { data, error } = await supabase.auth.getSession();
  if (error || !data?.session) {
    document.getElementById('auth-guard').style.display = 'block';
    return false;
  }
  // セッションが古ければリフレッシュ
  const expiresAt = data.session.expires_at * 1000;
  if (expiresAt - Date.now() < 10 * 60 * 1000) {
    await supabase.auth.refreshSession();
  }
  document.getElementById('app').style.display = 'block';
  return true;
}

// ── Event selection ──────────────────────────────────────────
async function loadEventList() {
  const { data } = await supabase
    .from('events')
    .select('id, title, event_at, status')
    .order('event_at', { ascending: false })
    .limit(20);

  const list = document.getElementById('event-select-list');
  list.innerHTML = '';
  (data || []).forEach(ev => {
    const btn = document.createElement('button');
    btn.style.cssText = 'display:flex;flex-direction:column;gap:3px;padding:1rem 1.1rem;background:rgba(0,25,45,0.5);border:1px solid var(--glass-border);border-radius:var(--radius);margin-bottom:0.6rem;cursor:pointer;text-align:left;width:100%;color:var(--text-main);transition:border-color 150ms';
    btn.innerHTML = `
      <div style="font-weight:500">${ev.title}</div>
      <div style="font-size:0.75rem;color:var(--text-sub)">${formatDate(ev.event_at)} — <span class="badge ${ev.status==='published'?'badge-ok':'badge-admin'}">${ev.status}</span></div>`;
    btn.addEventListener('mouseover', () => btn.style.borderColor='rgba(0,212,255,0.3)');
    btn.addEventListener('mouseout',  () => btn.style.borderColor='var(--glass-border)');
    btn.addEventListener('click', () => openEditor(ev));
    list.appendChild(btn);
  });
}

async function openEditor(ev) {
  currentEventId = ev.id;
  document.getElementById('event-title-header').textContent = ev.title;
  document.getElementById('event-select-wrap').style.display = 'none';
  document.getElementById('editor-wrap').style.display = 'grid';

  // 既存の座席データを読み込む
  const { data: seats } = await supabase
    .from('seats')
    .select('row_num, col_num, label')
    .eq('event_id', ev.id)
    .order('row_num').order('col_num');

  // layout_metaを読み込む
  const { data: evData } = await supabase
    .from('events')
    .select('layout_meta')
    .eq('id', ev.id)
    .single();

  const meta = evData?.layout_meta || {};

  // ── 下書き復元チェック ──────────────────────────────────────
  const draft = loadDraft(ev.id);
  if (draft) {
    const draftDate = new Date(draft.savedAt).toLocaleString('ja-JP');
    const useDraft = confirm(`⚠ 前回の未保存の変更が見つかりました\n（${draftDate}）\n\n下書きを復元しますか？\n\n[OK] → 下書きを復元\n[キャンセル] → DBのデータを使用`);
    if (useDraft) {
      rows = draft.rows; cols = draft.cols;
      stagePosition = draft.stagePosition || 'top';
      document.getElementById('rows-input').value = rows;
      document.getElementById('cols-input').value = cols;
      updateStagePosUI();
      if (draft.displaySettings) populateDisplayControls(draft.displaySettings);
      gridFromArray(draft.grid, rows, cols);
      renderGrid();
      updateStats();
      setUnsaved(true);
      showToast('下書きを復元しました');
      return;
    } else {
      clearDraft(ev.id);
    }
  }
  // ── DB データを使用 ────────────────────────────────────────

  if (seats && seats.length > 0) {
    rows = Math.max(...seats.map(s => s.row_num));
    cols = Math.max(...seats.map(s => s.col_num));
    document.getElementById('rows-input').value = rows;
    document.getElementById('cols-input').value = cols;
  }

  stagePosition = meta.stage_position || 'top';
  updateStagePosUI();
  if (meta.display_settings) populateDisplayControls(meta.display_settings);
  else populateDisplayControls({ seatSize:36, seatGap:5, stageHeight:36, stageLabel:'— STAGE —' });

  const aisles    = new Set((meta.aisles    || []).map(a => `${a.row},${a.col}`));
  const entrances = new Set((meta.entrances || []).map(e => `${e.row},${e.col}`));
  const stages    = new Set((meta.stages    || []).map(s => `${s.row},${s.col}`));
  const walls     = new Set((meta.walls     || []).map(w => `${w.row},${w.col}`));
  const seatKeys  = new Set((seats || []).map(s => `${s.row_num},${s.col_num}`));
  const seatLabels = {};
  (seats || []).forEach(s => { seatLabels[`${s.row_num},${s.col_num}`] = s.label; });

  initGrid(rows, cols);

  // 既存データを反映
  for (let r = 1; r <= rows; r++) {
    for (let c = 1; c <= cols; c++) {
      const key = `${r},${c}`;
      if (stages.has(key))    grid[r][c].type = 'stage';
      else if (entrances.has(key)) grid[r][c].type = 'entrance';
      else if (walls.has(key))    grid[r][c].type = 'wall';
      else if (aisles.has(key))   grid[r][c].type = 'aisle';
      else if (seatKeys.has(key)) { grid[r][c].type = 'seat'; grid[r][c].label = seatLabels[key] || ''; }
      else grid[r][c].type = 'aisle';
    }
  }

  renderGrid();
  updateStats();
  setUnsaved(false);
  updateDraftIndicator('');
}

// ── Grid init ────────────────────────────────────────────────
function initGrid(r, c) {
  rows = r; cols = c;
  grid = [];
  for (let i = 0; i <= r; i++) {
    grid[i] = [];
    for (let j = 0; j <= c; j++) {
      grid[i][j] = { type: 'seat', label: '' };
    }
  }
}

function assignLabels() {
  const rowLetters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let seatNum = {};
  for (let r = 1; r <= rows; r++) {
    let colSeatIdx = 0;
    for (let c = 1; c <= cols; c++) {
      if (grid[r][c].type === 'seat') {
        colSeatIdx++;
        const letter = r <= 26 ? rowLetters[r-1] : `R${r}`;
        grid[r][c].label = `${letter}-${colSeatIdx}`;
      }
    }
  }
}

// ── Render grid ──────────────────────────────────────────────
function renderGrid() {
  const el = document.getElementById('grid-editor');
  el.style.gridTemplateColumns = `repeat(${cols}, 40px)`;
  el.innerHTML = '';

  for (let r = 1; r <= rows; r++) {
    for (let c = 1; c <= cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'editor-cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      applyCell(cell, grid[r][c].type, grid[r][c].label);

      cell.addEventListener('mousedown', e => {
        isDragging = true;
        dragType   = currentTool;
        paintCell(r, c);
        e.preventDefault();
      });
      cell.addEventListener('mouseover', () => {
        if (isDragging) paintCell(r, c);
      });
      el.appendChild(cell);
    }
  }

  document.addEventListener('mouseup', () => { isDragging = false; }, { once: false });

  // Stage indicators
  const top    = document.getElementById('stage-indicator-top');
  const bottom = document.getElementById('stage-indicator-bottom');
  top.style.display    = stagePosition === 'top'    ? 'flex' : 'none';
  bottom.style.display = stagePosition === 'bottom' ? 'flex' : 'none';
  [top, bottom].forEach(el => {
    if (el) {
      el.textContent = displaySettings.stageLabel || '— STAGE —';
      el.style.height = `${displaySettings.stageHeight}px`;
    }
  });

  // Apply cell sizes
  requestAnimationFrame(() => {
    const gridEl = document.getElementById('grid-editor');
    if (gridEl) {
      gridEl.style.gap = `${displaySettings.seatGap}px`;
      document.querySelectorAll('.editor-cell').forEach(c => {
        c.style.width  = `${displaySettings.seatSize}px`;
        c.style.height = `${displaySettings.seatSize}px`;
      });
    }
  });

  updateStats();
}

function applyCell(el, type, label) {
  el.dataset.type = type;
  const labels = { seat:'🪑', aisle:'', entrance:'出入口', stage:'STAGE', wall:'■' };
  el.textContent = type === 'seat' ? (label || '？') : (labels[type] || '');
}

function paintCell(r, c) {
  grid[r][c].type = currentTool;
  if (currentTool !== 'seat') grid[r][c].label = '';
  const el = document.querySelector(`.editor-cell[data-row="${r}"][data-col="${c}"]`);
  if (el) applyCell(el, currentTool, grid[r][c].label);
  updateStats();
  scheduleAutosave();
}

function updateStats() {
  assignLabels();
  const seatCount     = countType('seat');
  const aisleCount    = countType('aisle');
  const entranceCount = countType('entrance');

  // ラベル更新
  for (let r = 1; r <= rows; r++) {
    for (let c = 1; c <= cols; c++) {
      if (grid[r][c].type === 'seat') {
        const el = document.querySelector(`.editor-cell[data-row="${r}"][data-col="${c}"]`);
        if (el) el.textContent = grid[r][c].label || '？';
      }
    }
  }

  document.getElementById('seat-stats').innerHTML = `
    <span class="stat-pill">🪑 ${seatCount} 席</span>
    <span class="stat-pill">🚪 ${entranceCount} 出入口</span>`;
}

function countType(type) {
  let n = 0;
  for (let r = 1; r <= rows; r++)
    for (let c = 1; c <= cols; c++)
      if (grid[r][c].type === type) n++;
  return n;
}

// ── Tool selection ───────────────────────────────────────────
document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentTool = btn.dataset.tool;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// ── Stage position ───────────────────────────────────────────
document.querySelectorAll('.stage-pos-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    stagePosition = btn.dataset.pos;
    updateStagePosUI();
    renderGrid();
    scheduleAutosave();
  });
});

function updateStagePosUI() {
  document.querySelectorAll('.stage-pos-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.pos === stagePosition);
  });
}

// ── Resize grid ──────────────────────────────────────────────
document.getElementById('btn-resize').addEventListener('click', () => {
  const r = parseInt(document.getElementById('rows-input').value) || 6;
  const c = parseInt(document.getElementById('cols-input').value) || 6;
  if (!confirm(`グリッドを ${r}×${c} に再生成します。現在の配置はリセットされます。`)) return;
  initGrid(r, c);
  // デフォルト全席
  for (let i = 1; i <= r; i++)
    for (let j = 1; j <= c; j++)
      grid[i][j] = { type: 'seat', label: '' };
  renderGrid();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('レイアウトをリセットしますか？')) return;
  for (let i = 1; i <= rows; i++)
    for (let j = 1; j <= cols; j++)
      grid[i][j] = { type: 'seat', label: '' };
  renderGrid();
});

// ── Save ─────────────────────────────────────────────────────
document.getElementById('btn-save').addEventListener('click', async () => {
  if (!currentEventId) return;
  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = '保存中...';

  try {
    // ── セッション確認・リフレッシュ ────────────────────────
    const { data: sessionData, error: sessionErr } = await supabase.auth.getSession();
    if (sessionErr || !sessionData?.session) {
      showToast('セッションが切れています。再ログインしてください');
      setTimeout(() => { location.href = '/admin/login.html?next=' + encodeURIComponent(location.href); }, 1500);
      btn.disabled = false; btn.textContent = '💾 保存して反映';
      return;
    }

    // トークンが5分以内に期限切れなら先にリフレッシュ
    const expiresAt = sessionData.session.expires_at * 1000;
    if (expiresAt - Date.now() < 5 * 60 * 1000) {
      const { error: refreshErr } = await supabase.auth.refreshSession();
      if (refreshErr) {
        console.warn('[JAZZIN] session refresh failed:', refreshErr);
      }
    }

    assignLabels();

    const seatCells = [];
    const aisles    = [];
    const entrances = [];
    const stages    = [];
    const walls     = [];

    for (let r = 1; r <= rows; r++) {
      for (let c = 1; c <= cols; c++) {
        const cell = grid[r][c];
        if (cell.type === 'seat')          seatCells.push({ row:r, col:c, label:cell.label });
        else if (cell.type === 'aisle')    aisles.push({ row:r, col:c });
        else if (cell.type === 'entrance') entrances.push({ row:r, col:c });
        else if (cell.type === 'stage')    stages.push({ row:r, col:c });
        else if (cell.type === 'wall')     walls.push({ row:r, col:c });
      }
    }

    // ── layout_meta を events テーブルに保存 ─────────────────
    const layoutMeta = {
      stage_position:   stagePosition,
      display_settings: { ...displaySettings },
      aisles, entrances, stages, walls, rows, cols
    };
    const { error: metaErr } = await supabase
      .from('events')
      .update({ layout_meta: layoutMeta })
      .eq('id', currentEventId);
    if (metaErr) {
      console.error('[JAZZIN] events update error:', metaErr);
      throw new Error(`イベント更新失敗 (${metaErr.code}): ${metaErr.message}`);
    }

    // ── seats: 削除→挿入 ─────────────────────────────────────
    const { error: delErr } = await supabase
      .from('seats')
      .delete()
      .eq('event_id', currentEventId);
    if (delErr) {
      console.error('[JAZZIN] seats delete error:', delErr);
      throw new Error(`座席削除失敗 (${delErr.code}): ${delErr.message}`);
    }

    if (seatCells.length > 0) {
      // 大量データは100件ずつ分割してinsert
      const CHUNK = 100;
      for (let i = 0; i < seatCells.length; i += CHUNK) {
        const chunk = seatCells.slice(i, i + CHUNK).map(s => ({
          event_id: currentEventId,
          row_num:  s.row,
          col_num:  s.col,
          label:    s.label,
          status:   'available',
        }));
        const { error: insErr } = await supabase.from('seats').insert(chunk);
        if (insErr) {
          console.error('[JAZZIN] seats insert error:', insErr);
          throw new Error(`座席登録失敗 (${insErr.code}): ${insErr.message}`);
        }
      }
    }

    showToast(`✓ ${seatCells.length}席を保存しました`);
    clearDraft(currentEventId);
    setUnsaved(false);
    updateDraftIndicator('');
  } catch (err) {
    console.error('[JAZZIN] save error:', err);
    showToast('保存に失敗: ' + (err.message || err));
  }

  btn.disabled = false; btn.textContent = '💾 保存して反映';
});

// ── Init ─────────────────────────────────────────────────────
async function init() {
  const ok = await checkAuth();
  if (!ok) return;

  initDisplayControls();

  const params = new URLSearchParams(location.search);
  const eid = params.get('event_id');
  await loadEventList();

  if (eid) {
    const { data: ev } = await supabase
      .from('events').select('id,title,event_at,status').eq('id', eid).single();
    if (ev) openEditor(ev);
  }
}

init();
</script>
