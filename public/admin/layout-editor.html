<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000a10">
<title>JAZZIN — 座席レイアウトエディタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<link rel="stylesheet" href="/ui/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
body { min-height:100dvh; }
.editor-layout { display:grid; grid-template-columns:260px 1fr; min-height:calc(100dvh - 56px); gap:0; }
.editor-sidebar {
  background:rgba(0,10,20,0.9); backdrop-filter:blur(20px);
  border-right:1px solid var(--glass-border);
  padding:1.25rem; overflow-y:auto;
  position:sticky; top:56px; height:calc(100dvh - 56px);
}
.editor-main { padding:1.5rem; overflow-y:auto; }
.sidebar-title { font-family:var(--font-display); font-size:0.9rem; letter-spacing:0.2em; color:var(--text-sub); margin-bottom:0.75rem; margin-top:1.25rem; }
.sidebar-title:first-child { margin-top:0; }

/* Tool buttons */
.tool-btn {
  display:flex; align-items:center; gap:0.5rem;
  width:100%; padding:0.6rem 0.75rem;
  background:rgba(0,212,255,0.05); border:1px solid var(--glass-border);
  border-radius:var(--radius); color:var(--text-sub);
  font-size:0.82rem; cursor:pointer; margin-bottom:0.4rem;
  transition:all 120ms; text-align:left; font-family:var(--font-body);
}
.tool-btn:hover { border-color:rgba(0,212,255,0.3); color:var(--text-main); background:rgba(0,212,255,0.1); }
.tool-btn.active { border-color:var(--accent-1); color:var(--accent-1); background:rgba(0,212,255,0.12); box-shadow:0 0 12px rgba(0,212,255,0.15); }
.tool-icon { font-size:1rem; width:20px; text-align:center; flex-shrink:0; }

/* Grid editor */
.grid-editor-wrap { overflow-x:auto; margin-bottom:1rem; touch-action:none; }

/* ── Minimap（座席エディタでも現在地を確認できるようにする） ── */
.editor-minimap {
  position: fixed;
  top: 66px;
  right: max(12px, env(safe-area-inset-right,0px));
  z-index: 60;
  background: rgba(4,10,18,0.85);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  padding: 7px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  display: none;
  opacity: 0;
  transition: opacity 180ms ease, transform 120ms ease;
  transform-origin: top right;
  cursor: grab;
  touch-action: none;
}
.editor-minimap:active { cursor: grabbing; }
.editor-minimap.visible { display: block; }
.editor-minimap.shown   { opacity: 1; }
.editor-minimap-toprow {
  display: flex; align-items: center; justify-content: space-between;
  gap: 6px; margin-bottom: 4px;
}
.editor-minimap-label {
  font-family: var(--font-display); font-size: 0.56rem; font-weight:600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-sub);
}
.editor-minimap-zoom { display:flex; gap:3px; }
.editor-minimap .minimap-zoom-btn {
  width: 18px; height: 18px; line-height: 16px; padding: 0;
  border-radius: 4px; border: 1px solid var(--glass-border);
  background: rgba(255,255,255,0.06); color: var(--text-sub);
  font-size: 0.7rem; font-weight:700; cursor: pointer; text-align:center;
}
.editor-minimap .minimap-zoom-btn:hover  { background: rgba(0,212,255,0.15); color: var(--accent-1); }
.editor-minimap .minimap-zoom-btn:active { transform: scale(0.9); }
.editor-minimap-canvas-wrap { position: relative; display:block; line-height:0; }
.editor-minimap canvas { display:block; border-radius: 3px; }
.editor-minimap-viewport {
  position: absolute;
  border: 1.5px solid var(--accent-1);
  background: rgba(0,212,255,0.14);
  border-radius: 2px;
  pointer-events: none;
  box-shadow: 0 0 6px rgba(0,212,255,0.35);
}

/* ── 座席表そのものの拡大縮小コントロール（ミニマップの表示サイズ変更ボタンとは別物）──
   誤認しないよう、ミニマップ（右上）とは反対の左上に固定配置する。 */
.editorzoom-control {
  position: fixed;
  top: 66px;
  left: max(12px, env(safe-area-inset-left,0px));
  z-index: 60;
  display: none;
  align-items: center; gap: 2px;
  background: rgba(4,10,18,0.85);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 4px 6px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  opacity: 0;
  transition: opacity 180ms ease;
}
.editorzoom-control.visible { display: flex; }
.editorzoom-control.shown   { opacity: 1; }
.editorzoom-btn {
  width: 26px; height: 26px; border-radius: 50%; padding: 0;
  border: 1px solid var(--glass-border);
  background: rgba(255,255,255,0.06); color: var(--text-sub);
  font-size: 0.95rem; font-weight:700; cursor: pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.editorzoom-btn:hover  { background: rgba(0,212,255,0.15); color: var(--accent-1); }
.editorzoom-btn:active { transform: scale(0.92); }
.editorzoom-pct {
  font-family: var(--font-display); font-size: 0.68rem; font-weight:700;
  color: var(--text-sub); min-width: 34px; text-align:center;
}
.editorzoom-icon { font-size:0.75rem; padding:0 2px; opacity:0.6; }

.grid-editor {
  display:inline-grid;
  gap:4px;
  cursor:crosshair;
  user-select:none;
}
.editor-cell {
  width:40px; height:40px;
  border-radius:5px; border:1px solid var(--glass-border);
  display:flex; align-items:center; justify-content:center;
  font-size:0.52rem; font-weight:500;
  cursor:pointer; transition:80ms;
  position:relative;
}
.editor-cell[data-type="seat"] {
  background:rgba(0,212,255,0.06); border-color:rgba(0,212,255,0.2);
  color:var(--text-sub);
}
.editor-cell[data-type="seat"]:hover { background:rgba(0,212,255,0.15); border-color:var(--accent-1); }
.editor-cell[data-type="aisle"] {
  background:transparent; border-color:rgba(255,255,255,0.04);
  color:transparent;
}
.editor-cell[data-type="stage"] {
  background:rgba(0,212,255,0.08); border-color:rgba(0,212,255,0.3);
  color:var(--accent-1); font-size:0.5rem; font-weight:700; letter-spacing:0.1em;
}
.editor-cell[data-type="entrance"] {
  background:rgba(127,255,212,0.1); border-color:rgba(127,255,212,0.4);
  color:var(--c-green); font-size:0.5rem;
}
.editor-cell[data-type="wall"] {
  background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.15);
  color:var(--c-dim);
}

/* Stage position selector */
.stage-pos-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; margin-bottom:0.5rem; }
.stage-pos-btn {
  padding:0.4rem; text-align:center; font-size:0.7rem;
  background:rgba(0,212,255,0.05); border:1px solid var(--glass-border);
  border-radius:4px; cursor:pointer; color:var(--text-sub);
}
.stage-pos-btn.active { border-color:var(--accent-1); color:var(--accent-1); background:rgba(0,212,255,0.1); }
.stage-pos-btn:hover { border-color:rgba(0,212,255,0.3); }

/* Legend */
.legend-row { display:flex; align-items:center; gap:6px; font-size:0.75rem; color:var(--text-sub); margin-bottom:4px; }
.legend-dot { width:14px; height:14px; border-radius:3px; flex-shrink:0; }

/* Stats */
.stat-pill {
  display:inline-flex; align-items:center; gap:4px;
  background:rgba(0,212,255,0.08); border:1px solid rgba(0,212,255,0.15);
  border-radius:20px; padding:0.25rem 0.75rem; font-size:0.78rem; color:var(--accent-1);
  margin-right:0.5rem; margin-bottom:0.5rem;
}

@media (max-width:768px) {
  .editor-layout { grid-template-columns:1fr; }
  .editor-sidebar {
    position:static; height:auto;
    border-right:none; border-bottom:1px solid var(--glass-border);
    padding:1rem; display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:0.75rem;
    /* ✅ ツール設定はグリッドの下に回す。モバイルで最初に目に入るのは座席表そのもの */
    order: 2;
  }
  .editor-sidebar .sidebar-title { grid-column:1/-1; margin-top:0.5rem; }
  .editor-main { padding:1rem; order: 1; }
  .grid-editor-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
}
</style>
</head>
<body>

<div class="aurora-wrap" style="opacity:0.4">
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
</div>

<header class="header">
  <div class="header-inner">
    <a href="/admin/index.html" class="logo"><img src="/assets/jazzin_logo.png" alt="JAZZIN" height="24"></a>
    <div style="display:flex;gap:0.5rem;align-items:center">
      <span id="event-title-header" style="font-size:0.8rem;color:var(--text-sub)"></span>
      <a href="/admin/index.html" class="btn btn-ghost btn-sm">← 管理画面</a>
    </div>
  </div>
</header>

<div id="toast"></div>

<div class="editorzoom-control" id="editorzoom-control" title="座席表の拡大縮小">
  <span class="editorzoom-icon">🔍</span>
  <button type="button" class="editorzoom-btn" id="editorzoom-out">－</button>
  <span class="editorzoom-pct" id="editorzoom-pct">100%</span>
  <button type="button" class="editorzoom-btn" id="editorzoom-in">＋</button>
</div>

<div class="editor-minimap" id="editor-minimap" title="ドラッグで移動 / ホイールでスクロール / ピンチ・Ctrl+ホイールで座席表を拡大縮小">
  <div class="editor-minimap-toprow">
    <span class="editor-minimap-label">現在地</span>
    <div class="editor-minimap-zoom">
      <button type="button" class="minimap-zoom-btn" id="editor-minimap-zoom-out" title="縮小">－</button>
      <button type="button" class="minimap-zoom-btn" id="editor-minimap-zoom-in" title="拡大">＋</button>
    </div>
  </div>
  <div class="editor-minimap-canvas-wrap">
    <canvas id="editor-minimap-canvas"></canvas>
    <div class="editor-minimap-viewport" id="editor-minimap-viewport"></div>
  </div>
</div>

<div id="auth-guard" style="display:none;text-align:center;padding:4rem">
  <p style="margin-bottom:1rem">管理者ログインが必要です</p>
  <a href="/admin/login.html" class="btn btn-primary">ログイン</a>
</div>

<div id="app" style="display:none">
  <!-- イベント未選択 -->
  <div id="event-select-wrap" class="container" style="padding:2rem 1.25rem">
    <h2 style="font-family:var(--font-display);letter-spacing:0.1em;margin-bottom:1.5rem">LAYOUT EDITOR</h2>
    <p style="color:var(--text-sub);margin-bottom:1rem">編集するイベントを選択してください</p>
    <div id="event-select-list"></div>
  </div>

  <!-- エディタ本体 -->
  <div id="editor-wrap" class="editor-layout" style="display:none">

    <!-- Sidebar -->
    <aside class="editor-sidebar">

      <p class="sidebar-title">グリッドサイズ</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:0.75rem">
        <div class="form-group">
          <label class="form-label">行数</label>
          <input type="number" class="form-input" id="rows-input" value="6" min="1" max="20" style="padding:0.4rem 0.6rem">
        </div>
        <div class="form-group">
          <label class="form-label">列数</label>
          <input type="number" class="form-input" id="cols-input" value="6" min="1" max="20" style="padding:0.4rem 0.6rem">
        </div>
      </div>
      <button class="btn btn-ghost btn-full btn-sm" id="btn-resize" style="margin-bottom:0.75rem">グリッドを再生成</button>

      <p class="sidebar-title">ツール</p>
      <button class="tool-btn active" data-tool="seat" id="tool-seat">
        <span class="tool-icon">🪑</span>座席
      </button>
      <button class="tool-btn" data-tool="aisle" id="tool-aisle">
        <span class="tool-icon">　</span>通路（空白）
      </button>
      <button class="tool-btn" data-tool="entrance" id="tool-entrance">
        <span class="tool-icon">🚪</span>出入口
      </button>
      <button class="tool-btn" data-tool="stage" id="tool-stage">
        <span class="tool-icon">🎵</span>ステージ
      </button>
      <button class="tool-btn" data-tool="wall" id="tool-wall">
        <span class="tool-icon">🧱</span>壁・障害物
      </button>

      <p class="sidebar-title">ステージ表示位置</p>
      <div class="stage-pos-grid">
        <div></div>
        <button class="stage-pos-btn active" data-pos="top">上</button>
        <div></div>
        <button class="stage-pos-btn" data-pos="left">左</button>
        <button class="stage-pos-btn" data-pos="none">なし</button>
        <button class="stage-pos-btn" data-pos="right">右</button>
        <div></div>
        <button class="stage-pos-btn" data-pos="bottom">下</button>
        <div></div>
      </div>

      <p class="sidebar-title">表示サイズ設定</p>
      <div class="form-group" style="margin-bottom:0.5rem">
        <label class="form-label">座席サイズ (px)</label>
        <div style="display:flex;align-items:center;gap:0.5rem">
          <input type="range" id="seat-size-range" min="24" max="64" value="36" style="flex:1;accent-color:var(--accent-1)">
          <span id="seat-size-val" style="font-size:0.78rem;color:var(--accent-1);min-width:28px;text-align:right">36</span>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:0.5rem">
        <label class="form-label">座席間隔 (px)</label>
        <div style="display:flex;align-items:center;gap:0.5rem">
          <input type="range" id="seat-gap-range" min="2" max="12" value="5" style="flex:1;accent-color:var(--accent-1)">
          <span id="seat-gap-val" style="font-size:0.78rem;color:var(--accent-1);min-width:28px;text-align:right">5</span>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:0.5rem">
        <label class="form-label">ステージ高さ (px)</label>
        <div style="display:flex;align-items:center;gap:0.5rem">
          <input type="range" id="stage-height-range" min="24" max="80" value="36" style="flex:1;accent-color:var(--accent-1)">
          <span id="stage-height-val" style="font-size:0.78rem;color:var(--accent-1);min-width:28px;text-align:right">36</span>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:0.75rem">
        <label class="form-label">ステージテキスト</label>
        <input type="text" class="form-input" id="stage-label-input" value="— STAGE —" style="padding:0.35rem 0.6rem;font-size:0.82rem">
      </div>

      <p class="sidebar-title">凡例</p>
      <div class="legend-row"><div class="legend-dot" style="background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.3)"></div>座席</div>
      <div class="legend-row"><div class="legend-dot" style="background:transparent;border:1px solid rgba(255,255,255,0.05)"></div>通路</div>
      <div class="legend-row"><div class="legend-dot" style="background:rgba(127,255,212,0.15);border:1px solid rgba(127,255,212,0.4)"></div>出入口</div>
      <div class="legend-row"><div class="legend-dot" style="background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.4)"></div>ステージ</div>
      <div class="legend-row"><div class="legend-dot" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2)"></div>壁</div>

      <div style="margin-top:1.5rem;display:flex;flex-direction:column;gap:0.5rem">
        <div id="draft-indicator" style="font-size:0.72rem;min-height:1.1em;letter-spacing:0.04em"></div>
        <button class="btn btn-primary btn-full" id="btn-save">💾 保存して反映</button>
        <button class="btn btn-ghost btn-full btn-sm" id="btn-reset">リセット</button>
      </div>

    </aside>

    <!-- Main editor area -->
    <main class="editor-main" style="position:relative;z-index:1">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem">
        <div>
          <h2 style="font-family:var(--font-display);font-size:1.3rem;letter-spacing:0.1em">LAYOUT EDITOR</h2>
          <p style="font-size:0.78rem;color:var(--text-sub);margin-top:2px">クリックまたはドラッグで描画</p>
        </div>
        <div id="seat-stats" style="display:flex;flex-wrap:wrap"></div>
      </div>

      <!-- Stage indicator (top) -->
      <div id="stage-indicator-top" class="stage-label" style="margin-bottom:0.75rem;display:flex;align-items:center;justify-content:center">— STAGE —</div>

      <div class="grid-editor-wrap">
        <div id="grid-editor" class="grid-editor"></div>
      </div>

      <!-- Stage indicator (bottom) -->
      <div id="stage-indicator-bottom" class="stage-label" style="margin-top:0.75rem;display:none;align-items:center;justify-content:center">— STAGE —</div>

      <p style="font-size:0.72rem;color:var(--c-dim);margin-top:0.75rem">
        💡 ドラッグで連続描画できます。保存すると座席テーブルに反映されます。
      </p>
    </main>
  </div>
</div>

<script type="module">
import { supabase, formatDate } from '/core/supabase.js';

// ── State ────────────────────────────────────────────────────
let currentEventId = null;
let currentTool    = 'seat';
let stagePosition  = 'top';
let rows = 6, cols = 6;
let grid = []; // grid[row][col] = { type: 'seat'|'aisle'|'entrance'|'stage'|'wall', label: '', locked: false }
let isDragging = false;
let dragType   = null;
let autosaveTimer = null;
let hasUnsavedChanges = false;
// ✅ 予約が入っている座席の位置（"row,col"）。この座席は編集・削除・移動を一切禁止する
let lockedSeats = new Set();
// ✅ DBから読み込んだ座席の生データ（再生成・リセット時のロック復元に使う）
let currentSeatsCache = [];

// ── Display settings ─────────────────────────────────────────
let displaySettings = {
  seatSize:    36,
  seatGap:     5,
  stageHeight: 36,
  stageLabel:  '— STAGE —',
};

// ✅ エディタ画面だけの一時的な拡大縮小（displaySettingsには保存しない・保存対象と無関係）
const EDITOR_ZOOM_MIN = 0.1, EDITOR_ZOOM_MAX = 2.2, EDITOR_ZOOM_STEP = 0.15;
let editorZoom = 1;

function applyEditorZoom(newZoom) {
  editorZoom = Math.max(EDITOR_ZOOM_MIN, Math.min(EDITOR_ZOOM_MAX, newZoom));
  applyDisplaySettings();
  const pctEl = document.getElementById('editorzoom-pct');
  if (pctEl) pctEl.textContent = `${Math.round(editorZoom * 100)}%`;
  queueEditorMinimapUpdate();
}

function initDisplayControls() {
  const seatSizeRange   = document.getElementById('seat-size-range');
  const seatGapRange    = document.getElementById('seat-gap-range');
  const stageHeightRange= document.getElementById('stage-height-range');
  const stageLabelInput = document.getElementById('stage-label-input');

  function syncVal(rangeEl, valEl, key) {
    rangeEl.addEventListener('input', () => {
      const v = parseInt(rangeEl.value);
      document.getElementById(valEl).textContent = v;
      displaySettings[key] = v;
      applyDisplaySettings();
      scheduleAutosave();
    });
  }
  syncVal(seatSizeRange,    'seat-size-val',    'seatSize');
  syncVal(seatGapRange,     'seat-gap-val',     'seatGap');
  syncVal(stageHeightRange, 'stage-height-val', 'stageHeight');

  stageLabelInput.addEventListener('input', () => {
    displaySettings.stageLabel = stageLabelInput.value;
    renderGrid();
    scheduleAutosave();
  });
}

function applyDisplaySettings() {
  const grid = document.getElementById('grid-editor');
  if (!grid) return;
  // ✅ 実際に画面へ反映するのは「保存される基準サイズ × 画面表示だけのズーム倍率」
  const effSize = displaySettings.seatSize * editorZoom;
  const effGap  = displaySettings.seatGap  * editorZoom;
  grid.style.gap = `${effGap}px`;
  // ✅ グリッドの列幅もセルサイズと必ず一致させる（ズレると隙間・重なりの原因になる）
  if (cols) grid.style.gridTemplateColumns = `repeat(${cols}, ${effSize}px)`;
  // update cell sizes（文字サイズも一緒に、下限なしで完全比例させる。読めない小ささでは非表示）
  const fontSize = effSize < 14 ? 0 : effSize * 0.28;
  document.querySelectorAll('.editor-cell').forEach(c => {
    c.style.width    = `${effSize}px`;
    c.style.height   = `${effSize}px`;
    c.style.fontSize = `${fontSize}px`;
    c.style.overflow = 'hidden';
  });
  // stage indicator height（ズームの影響は受けない：レイアウト全体の目印として常に一定）
  ['stage-indicator-top','stage-indicator-bottom'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.height = `${displaySettings.stageHeight}px`;
  });
}

function populateDisplayControls(ds) {
  displaySettings = { ...displaySettings, ...ds };
  const r = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.value = val;
  };
  const s = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  };
  r('seat-size-range',    displaySettings.seatSize);    s('seat-size-val',    displaySettings.seatSize);
  r('seat-gap-range',     displaySettings.seatGap);     s('seat-gap-val',     displaySettings.seatGap);
  r('stage-height-range', displaySettings.stageHeight); s('stage-height-val', displaySettings.stageHeight);
  const lbl = document.getElementById('stage-label-input');
  if (lbl) lbl.value = displaySettings.stageLabel;
}

function showToast(msg, ms=2000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

// ── Draft autosave (localStorage) ────────────────────────────
const DRAFT_PREFIX = 'jazzin_layout_draft_';

function draftKey(eventId) { return `${DRAFT_PREFIX}${eventId}`; }

function saveDraft() {
  if (!currentEventId) return;
  try {
    const payload = getDraftPayload();
    localStorage.setItem(draftKey(currentEventId), JSON.stringify(payload));
    setUnsaved(false);
    updateDraftIndicator('saved');
  } catch { /* quota exceeded — ignore */ }
}

function loadDraft(eventId) {
  try {
    const raw = localStorage.getItem(draftKey(eventId));
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function clearDraft(eventId) {
  localStorage.removeItem(draftKey(eventId));
}

function gridToArray() {
  const arr = [];
  for (let r = 1; r <= rows; r++) {
    for (let c = 1; c <= cols; c++) {
      arr.push({ r, c, type: grid[r][c].type, label: grid[r][c].label });
    }
  }
  return arr;
}

function getDraftPayload() {
  return {
    rows, cols, stagePosition,
    displaySettings: { ...displaySettings },
    grid: gridToArray(),
    savedAt: new Date().toISOString(),
  };
}

function gridFromArray(arr, r, c) {
  initGrid(r, c);
  arr.forEach(cell => {
    if (cell.r <= r && cell.c <= c) {
      grid[cell.r][cell.c] = { type: cell.type, label: cell.label || '' };
    }
  });
}

function scheduleAutosave() {
  setUnsaved(true);
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(saveDraft, 1500);
}

function setUnsaved(val) {
  hasUnsavedChanges = val;
  updateDraftIndicator(val ? 'unsaved' : 'saved');
}

function updateDraftIndicator(state) {
  const el = document.getElementById('draft-indicator');
  if (!el) return;
  if (state === 'unsaved') {
    el.textContent = '● 未保存の変更あり';
    el.style.color = 'var(--accent-1)';
  } else if (state === 'saved') {
    el.textContent = '✓ 下書き保存済み';
    el.style.color = 'var(--c-green)';
  } else {
    el.textContent = '';
  }
}

// ページ離脱時の警告
window.addEventListener('beforeunload', e => {
  if (hasUnsavedChanges) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// ── Auth ─────────────────────────────────────────────────────
async function checkAuth() {
  // getSession() はローカルストレージのトークンを使いRLSに必要なJWTをセットする
  // getUser() はサーバー検証だがセッション再セットを行わない場合がある
  const { data, error } = await supabase.auth.getSession();
  if (error || !data?.session) {
    document.getElementById('auth-guard').style.display = 'block';
    return false;
  }
  // セッションが古ければリフレッシュ
  const expiresAt = data.session.expires_at * 1000;
  if (expiresAt - Date.now() < 10 * 60 * 1000) {
    await supabase.auth.refreshSession();
  }
  document.getElementById('app').style.display = 'block';
  return true;
}

// ── Event selection ──────────────────────────────────────────
async function loadEventList() {
  const { data } = await supabase
    .from('events')
    .select('id, title, event_at, status')
    .order('event_at', { ascending: false })
    .limit(20);

  const list = document.getElementById('event-select-list');
  list.innerHTML = '';
  (data || []).forEach(ev => {
    const btn = document.createElement('button');
    btn.style.cssText = 'display:flex;flex-direction:column;gap:3px;padding:1rem 1.1rem;background:rgba(0,25,45,0.5);border:1px solid var(--glass-border);border-radius:var(--radius);margin-bottom:0.6rem;cursor:pointer;text-align:left;width:100%;color:var(--text-main);transition:border-color 150ms';
    btn.innerHTML = `
      <div style="font-weight:500">${ev.title}</div>
      <div style="font-size:0.75rem;color:var(--text-sub)">${formatDate(ev.event_at)} — <span class="badge ${ev.status==='published'?'badge-ok':'badge-admin'}">${ev.status}</span></div>`;
    btn.addEventListener('mouseover', () => btn.style.borderColor='rgba(0,212,255,0.3)');
    btn.addEventListener('mouseout',  () => btn.style.borderColor='var(--glass-border)');
    btn.addEventListener('click', () => openEditor(ev));
    list.appendChild(btn);
  });
}

async function openEditor(ev) {
  currentEventId = ev.id;
  document.getElementById('event-title-header').textContent = ev.title;
  document.getElementById('event-select-wrap').style.display = 'none';
  document.getElementById('editor-wrap').style.display = 'grid';

  // 既存の座席データを読み込む
  const { data: seats } = await supabase
    .from('seats')
    .select('id, row_num, col_num, label')
    .eq('event_id', ev.id)
    .order('row_num').order('col_num');

  // ✅ 予約が1件でも紐づいている座席を検出（＝編集・削除・移動を禁止する座席）
  lockedSeats = new Set();
  if (seats && seats.length > 0) {
    const { data: rsvSeats, error: rsvSeatsErr } = await supabase
      .from('reservation_seats')
      .select('seat_id')
      .in('seat_id', seats.map(s => s.id));
    if (rsvSeatsErr) {
      console.error('[JAZZIN] reservation_seats fetch error:', rsvSeatsErr);
      showToast('予約状況の確認に失敗しました。安全のため編集を中止してください');
    }
    const reservedIds = new Set((rsvSeats || []).map(r => r.seat_id));
    seats.forEach(s => {
      if (reservedIds.has(s.id)) lockedSeats.add(`${s.row_num},${s.col_num}`);
    });
  }
  currentSeatsCache = seats || [];

  // layout_metaを読み込む
  const { data: evData } = await supabase
    .from('events')
    .select('layout_meta')
    .eq('id', ev.id)
    .single();

  const meta = evData?.layout_meta || {};

  // ── 下書き復元チェック ──────────────────────────────────────
  const draft = loadDraft(ev.id);
  if (draft) {
    const draftDate = new Date(draft.savedAt).toLocaleString('ja-JP');
    const useDraft = confirm(`⚠ 前回の未保存の変更が見つかりました\n（${draftDate}）\n\n下書きを復元しますか？\n\n[OK] → 下書きを復元\n[キャンセル] → DBのデータを使用`);
    if (useDraft) {
      rows = draft.rows; cols = draft.cols;
      stagePosition = draft.stagePosition || 'top';
      document.getElementById('rows-input').value = rows;
      document.getElementById('cols-input').value = cols;
      updateStagePosUI();
      if (draft.displaySettings) populateDisplayControls(draft.displaySettings);
      gridFromArray(draft.grid, rows, cols);
      // ✅ 下書きが古く、その後に新しい予約が入っている可能性があるため、
      //    現在ロックすべき座席を必ず強制的に復元してから編集を始める
      reapplyLockedSeats(seats);
      renderGrid();
      updateStats();
      setUnsaved(true);
      showToast('下書きを復元しました');
      return;
    } else {
      clearDraft(ev.id);
    }
  }
  // ── DB データを使用 ────────────────────────────────────────

  if (seats && seats.length > 0) {
    rows = Math.max(...seats.map(s => s.row_num));
    cols = Math.max(...seats.map(s => s.col_num));
    document.getElementById('rows-input').value = rows;
    document.getElementById('cols-input').value = cols;
  }

  stagePosition = meta.stage_position || 'top';
  updateStagePosUI();
  if (meta.display_settings) populateDisplayControls(meta.display_settings);
  else populateDisplayControls({ seatSize:36, seatGap:5, stageHeight:36, stageLabel:'— STAGE —' });

  const aisles    = new Set((meta.aisles    || []).map(a => `${a.row},${a.col}`));
  const entrances = new Set((meta.entrances || []).map(e => `${e.row},${e.col}`));
  const stages    = new Set((meta.stages    || []).map(s => `${s.row},${s.col}`));
  const walls     = new Set((meta.walls     || []).map(w => `${w.row},${w.col}`));
  const seatKeys  = new Set((seats || []).map(s => `${s.row_num},${s.col_num}`));
  const seatLabels = {};
  (seats || []).forEach(s => { seatLabels[`${s.row_num},${s.col_num}`] = s.label; });

  initGrid(rows, cols);

  // 既存データを反映
  for (let r = 1; r <= rows; r++) {
    for (let c = 1; c <= cols; c++) {
      const key = `${r},${c}`;
      if (stages.has(key))    grid[r][c].type = 'stage';
      else if (entrances.has(key)) grid[r][c].type = 'entrance';
      else if (walls.has(key))    grid[r][c].type = 'wall';
      else if (aisles.has(key))   grid[r][c].type = 'aisle';
      else if (seatKeys.has(key)) { grid[r][c].type = 'seat'; grid[r][c].label = seatLabels[key] || ''; }
      else grid[r][c].type = 'aisle';
      grid[r][c].locked = lockedSeats.has(key);
    }
  }

  renderGrid();
  updateStats();
  setUnsaved(false);
  updateDraftIndicator('');
}

// ✅ 下書き復元などの後で、予約済み座席を必ず正しい位置・ラベルに強制的に戻す
//    （下書きが古い場合、その間に新しく入った予約の座席が反映されていない可能性があるため）
function reapplyLockedSeats(seats) {
  if (!seats || !seats.length) return;
  const seatLabels = {};
  seats.forEach(s => { seatLabels[`${s.row_num},${s.col_num}`] = s.label; });

  lockedSeats.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    // ロック座席がグリッド範囲外なら、範囲を広げて必ず含める
    if (r > rows) rows = r;
    if (c > cols) cols = c;
    for (let i = 1; i <= rows; i++) {
      grid[i] = grid[i] || [];
      for (let j = 1; j <= cols; j++) {
        if (!grid[i][j]) grid[i][j] = { type: 'aisle', label: '', locked: false };
      }
    }
    grid[r][c] = { type: 'seat', label: seatLabels[key] || '', locked: true };
  });
  document.getElementById('rows-input').value = rows;
  document.getElementById('cols-input').value = cols;
}

// ── Grid init ────────────────────────────────────────────────
function initGrid(r, c) {
  rows = r; cols = c;
  grid = [];
  for (let i = 0; i <= r; i++) {
    grid[i] = [];
    for (let j = 0; j <= c; j++) {
      grid[i][j] = { type: 'seat', label: '', locked: false };
    }
  }
}

function assignLabels() {
  const rowLetters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let seatNum = {};
  for (let r = 1; r <= rows; r++) {
    let colSeatIdx = 0;
    for (let c = 1; c <= cols; c++) {
      if (grid[r][c].type === 'seat') {
        colSeatIdx++;
        // ✅ 予約済み座席のラベルは、周囲の席の増減があっても変更しない
        //    （番号がズレて「A-3」が別の席のラベルになる、といった混乱を防ぐ）
        if (grid[r][c].locked) continue;
        const letter = r <= 26 ? rowLetters[r-1] : `R${r}`;
        grid[r][c].label = `${letter}-${colSeatIdx}`;
      }
    }
  }
}

// ── Render grid ──────────────────────────────────────────────
function renderGrid() {
  const el = document.getElementById('grid-editor');
  // ✅ ズーム倍率を反映した実サイズをグリッドの列幅にも使う
  //    （固定40pxのままだと座席セル自体の幅とズレて、ズーム時に隙間や重なりが発生していた）
  const effSizeForTrack = (displaySettings.seatSize || 36) * (typeof editorZoom === 'number' ? editorZoom : 1);
  el.style.gridTemplateColumns = `repeat(${cols}, ${effSizeForTrack}px)`;
  el.innerHTML = '';

  for (let r = 1; r <= rows; r++) {
    for (let c = 1; c <= cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'editor-cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      applyCell(cell, grid[r][c].type, grid[r][c].label);
      if (grid[r][c].locked) {
        cell.classList.add('locked-cell');
        cell.title = '予約済み座席（編集不可）';
        cell.style.outline = '2px solid var(--c-red, #ff6b6b)';
        cell.style.cursor = 'not-allowed';
        cell.style.opacity = '0.85';
      }

      // ✅ Pointer Eventsに統一（mousedown/mouseoverはマウス専用で、
      //    タッチではドラッグ描画が一切機能しなかったための修正）
      cell.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        isDragging = true;
        dragType   = currentTool;
        paintCell(r, c);
        e.preventDefault();
      });
      el.appendChild(cell);
    }
  }

  // ✅ ドラッグ中の移動先セルを elementFromPoint で判定する。
  //    タッチのドラッグ中は pointermove が最初にpointerdownしたセルに
  //    集中してしまい、mouseover相当の「乗り移り」検出が効かないため。
  el.addEventListener('pointermove', e => {
    if (!isDragging) return;
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const cellEl = target?.closest('.editor-cell');
    if (!cellEl) return;
    const rr = parseInt(cellEl.dataset.row, 10);
    const cc = parseInt(cellEl.dataset.col, 10);
    if (!isNaN(rr) && !isNaN(cc)) paintCell(rr, cc);
  });

  document.addEventListener('pointerup',     () => { isDragging = false; }, { once: false });
  document.addEventListener('pointercancel', () => { isDragging = false; }, { once: false });

  // Stage indicators
  const top    = document.getElementById('stage-indicator-top');
  const bottom = document.getElementById('stage-indicator-bottom');
  top.style.display    = stagePosition === 'top'    ? 'flex' : 'none';
  bottom.style.display = stagePosition === 'bottom' ? 'flex' : 'none';
  [top, bottom].forEach(el => {
    if (el) {
      el.textContent = displaySettings.stageLabel || '— STAGE —';
      el.style.height = `${displaySettings.stageHeight}px`;
    }
  });

  // Apply cell sizes（保存対象の基準サイズ × 画面表示だけのズーム倍率）
  requestAnimationFrame(() => {
    const gridEl = document.getElementById('grid-editor');
    if (gridEl) {
      const effSize = displaySettings.seatSize * editorZoom;
      const effGap  = displaySettings.seatGap  * editorZoom;
      gridEl.style.gap = `${effGap}px`;
      const fontSize = effSize < 14 ? 0 : effSize * 0.28;
      document.querySelectorAll('.editor-cell').forEach(c => {
        c.style.width    = `${effSize}px`;
        c.style.height   = `${effSize}px`;
        c.style.fontSize = `${fontSize}px`;
        c.style.overflow = 'hidden';
      });
    }
  });

  updateStats();
  renderEditorMinimap();
  requestAnimationFrame(updateEditorMinimapViewport);
}

function applyCell(el, type, label) {
  el.dataset.type = type;
  const labels = { seat:'🪑', aisle:'', entrance:'出入口', stage:'STAGE', wall:'■' };
  el.textContent = type === 'seat' ? (label || '？') : (labels[type] || '');
}

let lockedToastAt = 0;
function paintCell(r, c) {
  if (grid[r]?.[c]?.locked) {
    // 連打・ドラッグ中に何度もトーストが出ないよう間引く
    const now = Date.now();
    if (now - lockedToastAt > 1200) {
      lockedToastAt = now;
      showToast(`この座席（${grid[r][c].label || `${r},${c}`}）には既に予約が入っているため、編集できません。`, 2500);
    }
    return;
  }
  grid[r][c].type = currentTool;
  if (currentTool !== 'seat') grid[r][c].label = '';
  const el = document.querySelector(`.editor-cell[data-row="${r}"][data-col="${c}"]`);
  if (el) applyCell(el, currentTool, grid[r][c].label);
  updateStats();
  scheduleAutosave();
  renderEditorMinimap();
}

// ══════════════════════════════════════════════════════════════
// ✅ Editor minimap（座席エディタでの「現在地」インジケータ）
//    event.html側と同じ考え方だが、エディタは
//    ・横スクロール: .grid-editor-wrap
//    ・縦スクロール: .editor-main（ページ全体ではなく内部スクロール）
//    という構造の違いがあるため、それに合わせて計算する。
// ══════════════════════════════════════════════════════════════
let editorMinimapInfo = null;

function renderEditorMinimap() {
  const canvas = document.getElementById('editor-minimap-canvas');
  const widget = document.getElementById('editor-minimap');
  if (!canvas || !widget || !grid.length) return;

  const z = typeof editorMinimapZoom === 'number' ? editorMinimapZoom : 1;
  const MAX_W = 132 * z, MAX_H = 132 * z, MIN_CELL = 1.2, MAX_CELL = 9 * z;
  const cellPx = Math.max(MIN_CELL, Math.min(MAX_CELL, Math.min(MAX_W / cols, MAX_H / rows)));
  const dpr = window.devicePixelRatio || 1;
  const canvasW = cellPx * cols;
  const canvasH = cellPx * rows;

  canvas.style.width  = `${canvasW}px`;
  canvas.style.height = `${canvasH}px`;
  canvas.width  = Math.round(canvasW * dpr);
  canvas.height = Math.round(canvasH * dpr);

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvasW, canvasH);

  for (let r = 1; r <= rows; r++) {
    for (let c = 1; c <= cols; c++) {
      const cell = grid[r]?.[c];
      if (!cell) continue;
      const x = (c - 1) * cellPx, y = (r - 1) * cellPx;
      const pad = cellPx > 3 ? 0.5 : 0;
      let color;
      if (cell.type === 'seat') {
        color = cell.locked ? 'rgba(255,107,107,0.75)' : 'rgba(255,255,255,0.32)';
      } else if (cell.type === 'entrance') {
        color = 'rgba(255,200,0,0.4)';
      } else if (cell.type === 'stage') {
        color = 'rgba(0,212,255,0.4)';
      } else if (cell.type === 'wall') {
        color = 'rgba(255,255,255,0.1)';
      } else {
        color = 'transparent'; // aisle
      }
      if (color !== 'transparent') {
        ctx.fillStyle = color;
        ctx.fillRect(x + pad, y + pad, cellPx - pad * 2, cellPx - pad * 2);
      }
    }
  }

  editorMinimapInfo = { canvasW, canvasH };
}

function updateEditorMinimapViewport() {
  const widget = document.getElementById('editor-minimap');
  const zoomCtl = document.getElementById('editorzoom-control');
  const outer  = document.querySelector('.grid-editor-wrap');
  const mainEl = document.querySelector('.editor-main');
  const gridEl = document.getElementById('grid-editor');
  const vpEl   = document.getElementById('editor-minimap-viewport');
  if (!widget || !outer || !mainEl || !gridEl || !vpEl || !editorMinimapInfo) {
    if (widget) widget.classList.remove('visible', 'shown');
    if (zoomCtl) zoomCtl.classList.remove('visible', 'shown');
    return;
  }

  const { canvasW, canvasH } = editorMinimapInfo;

  // 横方向：.grid-editor-wrap のスクロール
  const scrollW = outer.scrollWidth || 1;
  const hFracW  = Math.min(1, outer.clientWidth / scrollW);
  const hFracX  = scrollW > outer.clientWidth ? outer.scrollLeft / (scrollW - outer.clientWidth) : 0;

  // 縦方向：.editor-main の内部スクロール（ページ全体ではない点がevent.htmlと異なる）
  const mainRect = mainEl.getBoundingClientRect();
  const gridRect = gridEl.getBoundingClientRect();
  const relTop   = gridRect.top - mainRect.top;
  const visibleTop    = Math.min(Math.max(0, -relTop), gridRect.height);
  const visibleBottom = Math.min(Math.max(0, mainRect.height - relTop), gridRect.height);
  const vFracY = gridRect.height > 0 ? visibleTop / gridRect.height : 0;
  const vFracH = gridRect.height > 0 ? Math.max(0, (visibleBottom - visibleTop) / gridRect.height) : 1;

  const overflowsH = scrollW > outer.clientWidth + 2;
  const overflowsV = gridRect.height > mainRect.height + 2;
  const gridSectionVisible = gridRect.bottom > mainRect.top && gridRect.top < mainRect.bottom;

  if (!overflowsH && !overflowsV) {
    widget.classList.remove('shown');
    setTimeout(() => { if (!widget.classList.contains('shown')) widget.classList.remove('visible'); }, 200);
  } else {
    widget.classList.add('visible');
    requestAnimationFrame(() => widget.classList.add('shown'));
  }

  if (zoomCtl) {
    if (gridSectionVisible) {
      zoomCtl.classList.add('visible');
      requestAnimationFrame(() => zoomCtl.classList.add('shown'));
    } else {
      zoomCtl.classList.remove('shown');
      setTimeout(() => { if (!zoomCtl.classList.contains('shown')) zoomCtl.classList.remove('visible'); }, 200);
    }
  }

  if (!overflowsH && !overflowsV) return;

  const left = (overflowsH ? hFracX * (1 - hFracW) : 0) * canvasW;
  const wpx  = (overflowsH ? hFracW : 1) * canvasW;
  const top  = vFracY * canvasH;
  const hpx  = Math.max(4, vFracH * canvasH);

  vpEl.style.left   = `${Math.max(0, left)}px`;
  vpEl.style.top    = `${Math.max(0, top)}px`;
  vpEl.style.width  = `${Math.min(canvasW, wpx)}px`;
  vpEl.style.height = `${Math.min(canvasH, hpx)}px`;
}

function editorMinimapPointToFraction(clientX, clientY) {
  const wrap = document.querySelector('.editor-minimap-canvas-wrap');
  const r = wrap.getBoundingClientRect();
  return {
    fx: Math.min(1, Math.max(0, (clientX - r.left) / r.width)),
    fy: Math.min(1, Math.max(0, (clientY - r.top)  / r.height)),
  };
}

function jumpToEditorMinimapPoint(fx, fy, smooth) {
  const outer  = document.querySelector('.grid-editor-wrap');
  const mainEl = document.querySelector('.editor-main');
  const gridEl = document.getElementById('grid-editor');
  if (!outer || !mainEl || !gridEl) return;
  const behavior = smooth ? 'smooth' : 'instant';

  const scrollW = outer.scrollWidth;
  if (scrollW > outer.clientWidth) {
    const targetLeft = fx * scrollW - outer.clientWidth / 2;
    outer.scrollTo({ left: Math.max(0, Math.min(scrollW - outer.clientWidth, targetLeft)), behavior });
  }

  const mainRect = mainEl.getBoundingClientRect();
  const gridRect = gridEl.getBoundingClientRect();
  const relTop   = gridRect.top - mainRect.top;
  const targetTop = mainEl.scrollTop + relTop + fy * gridRect.height - mainRect.height / 2;
  mainEl.scrollTo({ top: Math.max(0, Math.min(mainEl.scrollHeight - mainEl.clientHeight, targetTop)), behavior });
}

const editorMinimapWidget = document.getElementById('editor-minimap');
let editorMinimapDragging = false;
const editorMinimapPointers = new Map();
let editorMinimapPinchStartDist = null, editorMinimapPinchStartZoom = null;

// ✅ ミニマップ自体の「表示サイズ」変更（座席表そのもののズームとは別物）。
//    デフォルト(100%)より小さくはできない＝拡大のみ許可し、拡大後は100%まで戻せる。
const EDITOR_MINIMAP_ZOOM_MIN = 1, EDITOR_MINIMAP_ZOOM_MAX = 2, EDITOR_MINIMAP_ZOOM_STEP = 0.15;
let editorMinimapZoom = 1;
function applyEditorMinimapZoom() {
  renderEditorMinimap();
  requestAnimationFrame(updateEditorMinimapViewport);
}
document.getElementById('editor-minimap-zoom-in').addEventListener('click', e => {
  e.stopPropagation();
  editorMinimapZoom = Math.min(EDITOR_MINIMAP_ZOOM_MAX, +(editorMinimapZoom + EDITOR_MINIMAP_ZOOM_STEP).toFixed(2));
  applyEditorMinimapZoom();
});
document.getElementById('editor-minimap-zoom-out').addEventListener('click', e => {
  e.stopPropagation();
  editorMinimapZoom = Math.max(EDITOR_MINIMAP_ZOOM_MIN, +(editorMinimapZoom - EDITOR_MINIMAP_ZOOM_STEP).toFixed(2));
  applyEditorMinimapZoom();
});

// ✅ 座席表そのものの拡大縮小ボタン（ミニマップの表示サイズとは別のコントロール）
document.getElementById('editorzoom-in').addEventListener('click', () => applyEditorZoom(editorZoom + EDITOR_ZOOM_STEP));
document.getElementById('editorzoom-out').addEventListener('click', () => applyEditorZoom(editorZoom - EDITOR_ZOOM_STEP));

editorMinimapWidget.addEventListener('pointerdown', e => {
  if (e.target.closest('.minimap-zoom-btn')) return;
  editorMinimapWidget.setPointerCapture(e.pointerId);
  editorMinimapPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (editorMinimapPointers.size === 2) {
    editorMinimapDragging = false;
    const pts = [...editorMinimapPointers.values()];
    editorMinimapPinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    editorMinimapPinchStartZoom = editorZoom;
  } else {
    editorMinimapDragging = true;
    const { fx, fy } = editorMinimapPointToFraction(e.clientX, e.clientY);
    jumpToEditorMinimapPoint(fx, fy, false);
  }
});
editorMinimapWidget.addEventListener('pointermove', e => {
  if (!editorMinimapPointers.has(e.pointerId)) return;
  editorMinimapPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (editorMinimapPointers.size === 2 && editorMinimapPinchStartDist) {
    const pts = [...editorMinimapPointers.values()];
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    applyEditorZoom(editorMinimapPinchStartZoom * (dist / editorMinimapPinchStartDist));
  } else if (editorMinimapDragging) {
    const { fx, fy } = editorMinimapPointToFraction(e.clientX, e.clientY);
    jumpToEditorMinimapPoint(fx, fy, false);
  }
});
function endEditorMinimapDrag(e) {
  editorMinimapPointers.delete(e.pointerId);
  try { editorMinimapWidget.releasePointerCapture(e.pointerId); } catch {}
  if (editorMinimapPointers.size < 2) editorMinimapPinchStartDist = null;
  editorMinimapDragging = editorMinimapPointers.size === 1;
}
editorMinimapWidget.addEventListener('pointerup', endEditorMinimapDrag);
editorMinimapWidget.addEventListener('pointercancel', endEditorMinimapDrag);

// ✅ ミニマップ上でのホイール／トラックパッド操作
//    ・通常  → エディタ本体をパン（画面サイズに対する割合で計算し、暴れないよう上限を設ける）
//    ・Ctrl/Cmd併用（Macトラックパッドのピンチも含む）→ 座席表そのものを拡大縮小
editorMinimapWidget.addEventListener('wheel', e => {
  e.preventDefault();

  if (e.ctrlKey || e.metaKey) {
    const factor = e.deltaY < 0 ? 1.08 : 0.92;
    applyEditorZoom(editorZoom * factor);
    return;
  }

  const outer  = document.querySelector('.grid-editor-wrap');
  const mainEl = document.querySelector('.editor-main');
  if (!outer || !mainEl) return;
  const maxStepX = outer.clientWidth  * 0.35;
  const maxStepY = mainEl.clientHeight * 0.35;
  const stepX = Math.max(-maxStepX, Math.min(maxStepX, e.deltaX * 3));
  const stepY = Math.max(-maxStepY, Math.min(maxStepY, e.deltaY * 3));

  if (outer.scrollWidth > outer.clientWidth) outer.scrollBy({ left: stepX, behavior: 'auto' });
  mainEl.scrollBy({ top: stepY, behavior: 'auto' });
}, { passive: false });

// ✅ 座席エディタ本体の上での操作
//    ・通常のタップ／1本指スクロールは標準のまま（座席の編集操作を邪魔しない）
//    ・2本指ピンチ、Ctrl/Cmd+ホイールでズーム
const gridEditorWrapEl = document.querySelector('.grid-editor-wrap');
if (gridEditorWrapEl) {
  const editorPointers = new Map();
  let editorPinchStartDist = null, editorPinchStartZoom = null;

  gridEditorWrapEl.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    editorPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (editorPointers.size === 2) {
      gridEditorWrapEl.setPointerCapture(e.pointerId);
      const pts = [...editorPointers.values()];
      editorPinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      editorPinchStartZoom = editorZoom;
    }
  });
  gridEditorWrapEl.addEventListener('pointermove', e => {
    if (!editorPointers.has(e.pointerId)) return;
    editorPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (editorPointers.size === 2 && editorPinchStartDist) {
      e.preventDefault();
      const pts = [...editorPointers.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      applyEditorZoom(editorPinchStartZoom * (dist / editorPinchStartDist));
    }
  }, { passive: false });
  function endEditorPinch(e) {
    editorPointers.delete(e.pointerId);
    if (editorPointers.size < 2) editorPinchStartDist = null;
  }
  gridEditorWrapEl.addEventListener('pointerup', endEditorPinch);
  gridEditorWrapEl.addEventListener('pointercancel', endEditorPinch);

  gridEditorWrapEl.addEventListener('wheel', e => {
    if (!(e.ctrlKey || e.metaKey)) return; // 通常のスクロールは邪魔しない
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.08 : 0.92;
    applyEditorZoom(editorZoom * factor);
  }, { passive: false });
}

let editorMinimapUpdateQueued = false;
function queueEditorMinimapUpdate() {
  if (editorMinimapUpdateQueued) return;
  editorMinimapUpdateQueued = true;
  requestAnimationFrame(() => { editorMinimapUpdateQueued = false; updateEditorMinimapViewport(); });
}
document.addEventListener('scroll', e => {
  if (e.target.classList?.contains('grid-editor-wrap') || e.target.classList?.contains('editor-main')) {
    queueEditorMinimapUpdate();
  }
}, { passive: true, capture: true });
window.addEventListener('resize', queueEditorMinimapUpdate);

function updateStats() {
  assignLabels();
  const seatCount     = countType('seat');
  const aisleCount    = countType('aisle');
  const entranceCount = countType('entrance');

  // ラベル更新
  for (let r = 1; r <= rows; r++) {
    for (let c = 1; c <= cols; c++) {
      if (grid[r][c].type === 'seat') {
        const el = document.querySelector(`.editor-cell[data-row="${r}"][data-col="${c}"]`);
        if (el) el.textContent = grid[r][c].label || '？';
      }
    }
  }

  document.getElementById('seat-stats').innerHTML = `
    <span class="stat-pill">🪑 ${seatCount} 席</span>
    <span class="stat-pill">🚪 ${entranceCount} 出入口</span>`;
}

function countType(type) {
  let n = 0;
  for (let r = 1; r <= rows; r++)
    for (let c = 1; c <= cols; c++)
      if (grid[r][c].type === type) n++;
  return n;
}

// ── Tool selection ───────────────────────────────────────────
document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentTool = btn.dataset.tool;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// ── Stage position ───────────────────────────────────────────
document.querySelectorAll('.stage-pos-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    stagePosition = btn.dataset.pos;
    updateStagePosUI();
    renderGrid();
    scheduleAutosave();
  });
});

function updateStagePosUI() {
  document.querySelectorAll('.stage-pos-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.pos === stagePosition);
  });
}

// ── Resize grid ──────────────────────────────────────────────
document.getElementById('btn-resize').addEventListener('click', () => {
  const r = parseInt(document.getElementById('rows-input').value) || 6;
  const c = parseInt(document.getElementById('cols-input').value) || 6;

  // ✅ 予約済み座席がグリッド範囲外にはみ出す再生成は禁止する
  const outOfBounds = [...lockedSeats].filter(key => {
    const [lr, lc] = key.split(',').map(Number);
    return lr > r || lc > c;
  });
  if (outOfBounds.length > 0) {
    alert(`予約済みの座席が ${outOfBounds.length} 席、指定した行数・列数の範囲外になります。\nこれらの座席は削除できないため、行数・列数をもっと大きくしてください。`);
    return;
  }

  const hasLocked = lockedSeats.size > 0;
  if (!confirm(hasLocked
    ? `グリッドを ${r}×${c} に再生成します。予約が入っていない座席の配置はリセットされますが、予約済みの座席（${lockedSeats.size}席）はそのまま維持されます。`
    : `グリッドを ${r}×${c} に再生成します。現在の配置はリセットされます。`)) return;

  initGrid(r, c);
  // デフォルト全席
  for (let i = 1; i <= r; i++)
    for (let j = 1; j <= c; j++)
      grid[i][j] = { type: 'seat', label: '', locked: false };

  // ✅ 予約済み座席は再生成後も必ず元の位置・ラベルのまま復元する
  reapplyLockedSeats(currentSeatsCache);
  renderGrid();
  scheduleAutosave();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  const hasLocked = lockedSeats.size > 0;
  if (!confirm(hasLocked
    ? `レイアウトをリセットしますか？予約済みの座席（${lockedSeats.size}席）は維持されます。`
    : 'レイアウトをリセットしますか？')) return;
  for (let i = 1; i <= rows; i++)
    for (let j = 1; j <= cols; j++)
      grid[i][j] = { type: 'seat', label: '', locked: false };
  reapplyLockedSeats(currentSeatsCache);
  renderGrid();
});

// ── Save ─────────────────────────────────────────────────────
document.getElementById('btn-save').addEventListener('click', async () => {
  if (!currentEventId) return;
  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = '保存中...';

  try {
    // ── セッション確認・リフレッシュ ────────────────────────
    const { data: sessionData, error: sessionErr } = await supabase.auth.getSession();
    if (sessionErr || !sessionData?.session) {
      showToast('セッションが切れています。再ログインしてください');
      setTimeout(() => { location.href = '/admin/login.html?next=' + encodeURIComponent(location.href); }, 1500);
      btn.disabled = false; btn.textContent = '💾 保存して反映';
      return;
    }

    // トークンが5分以内に期限切れなら先にリフレッシュ
    const expiresAt = sessionData.session.expires_at * 1000;
    if (expiresAt - Date.now() < 5 * 60 * 1000) {
      const { error: refreshErr } = await supabase.auth.refreshSession();
      if (refreshErr) {
        console.warn('[JAZZIN] session refresh failed:', refreshErr);
      }
    }

    assignLabels();

    const seatCells = [];
    const aisles    = [];
    const entrances = [];
    const stages    = [];
    const walls     = [];

    for (let r = 1; r <= rows; r++) {
      for (let c = 1; c <= cols; c++) {
        const cell = grid[r][c];
        if (cell.type === 'seat')          seatCells.push({ row:r, col:c, label:cell.label });
        else if (cell.type === 'aisle')    aisles.push({ row:r, col:c });
        else if (cell.type === 'entrance') entrances.push({ row:r, col:c });
        else if (cell.type === 'stage')    stages.push({ row:r, col:c });
        else if (cell.type === 'wall')     walls.push({ row:r, col:c });
      }
    }

    // ── layout_meta ＋ seats を1つの安全なRPCでまとめて保存 ─────
    //    update_seat_layout はDB側で「予約済み座席が壊れていないか」を
    //    必ず再チェックしてから書き込む（フロントのバグや古い下書きが
    //    あっても、予約データは絶対に消えない・壊れない）
    const layoutMeta = {
      stage_position:   stagePosition,
      display_settings: { ...displaySettings },
      aisles, entrances, stages, walls, rows, cols
    };

    const { data: result, error: rpcErr } = await supabase.rpc('update_seat_layout', {
      p_event_id:    currentEventId,
      p_layout_meta: layoutMeta,
      p_seats:       seatCells, // [{row, col, label}, ...]
    });

    if (rpcErr) {
      console.error('[JAZZIN] update_seat_layout error:', rpcErr);
      throw new Error(`保存失敗: ${rpcErr.message}`);
    }

    if (!result?.success) {
      if (result?.error === 'protected_seats_modified') {
        const list = (result.conflicts || [])
          .map(c => `・${c.label}（${c.row}行${c.col}列）`).join('\n');
        alert(
          `保存できませんでした。\n\n` +
          `以下の座席にはすでに予約が入っているため、削除・移動・改名できません。\n\n${list}\n\n` +
          `画面を再読み込みして最新の状態を確認してください。`
        );
        throw new Error('protected_seats_modified');
      }
      throw new Error(result?.error || '不明なエラー');
    }

    showToast(`✓ 保存しました（追加${result.inserted} / 変更${result.updated} / 削除${result.deleted} 、予約済み座席は保護されました）`);
    clearDraft(currentEventId);
    setUnsaved(false);
    updateDraftIndicator('');
  } catch (err) {
    console.error('[JAZZIN] save error:', err);
    if (err.message !== 'protected_seats_modified') {
      showToast('保存に失敗: ' + (err.message || err));
    }
  }

  btn.disabled = false; btn.textContent = '💾 保存して反映';
});

// ── Init ─────────────────────────────────────────────────────
async function init() {
  const ok = await checkAuth();
  if (!ok) return;

  initDisplayControls();

  const params = new URLSearchParams(location.search);
  const eid = params.get('event_id');
  await loadEventList();

  if (eid) {
    const { data: ev } = await supabase
      .from('events').select('id,title,event_at,status').eq('id', eid).single();
    if (ev) openEditor(ev);
  }
}

init();
</script>
