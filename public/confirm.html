<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000a10">
<title>JAZZIN — 予約完了</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<link rel="stylesheet" href="/ui/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
body { min-height:100dvh; }

.confirm-page {
  max-width: 480px;
  margin: 0 auto;
  padding: clamp(1.5rem,4vw,2.5rem) var(--page-px) 6rem;
  position: relative; z-index: 1;
}

/* ── ヘッダー：チェックマーク + タイトル ── */
.confirm-header { text-align:center; margin-bottom:2rem; }
.check-icon {
  width: 44px; height: 44px;
  background: rgba(127,255,212,0.1);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1rem;
  font-size: 1.1rem; color: var(--c-green);
}
.confirm-title {
  font-family: var(--font-ui);
  font-size: 1.6rem; font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  margin-bottom: 0.25rem;
}
.confirm-subtitle {
  font-size: 0.8rem;
  color: var(--text-secondary);
  letter-spacing: 0;
}

/* ── チケットカード ── */
.confirm-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

/* ── 座席番号ヒーローゾーン ── */
.seat-hero {
  padding: 2rem 1.5rem 1.5rem;
  text-align: center;
  border-bottom: 1px solid var(--border);
}
.seat-hero-label {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 0.5rem;
}
.seat-hero-value {
  font-family: var(--font-ui);
  font-size: clamp(2.8rem, 9vw, 4.5rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--accent-1);
  margin-bottom: 0.4rem;
  word-break: break-all;
}
.seat-hero-count {
  font-size: 0.8rem;
  color: var(--text-secondary);
  font-weight: 400;
}

/* ── 詳細行 ── */
.confirm-body { padding: 0 1.25rem; }
.confirm-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 0.65rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.875rem;
  gap: 1rem;
}
.confirm-row:last-child { border-bottom: none; }
.confirm-row-label { color: var(--text-secondary); flex-shrink: 0; font-size: 0.82rem; }
.confirm-row-value { color: var(--text-primary); font-weight: 500; text-align: right; }

/* 予約番号行は小さく控えめに */
.confirm-row.rsv-row .confirm-row-value {
  font-family: var(--font-body);
  font-size: 0.82rem;
  font-weight: 400;
  color: var(--text-secondary);
}

/* ── QR ── */
.qr-section {
  display: flex; flex-direction: column; align-items: center;
  gap: 0.75rem; padding: 1.5rem;
  border-top: 1px solid var(--border);
  background: var(--bg-raised);
}
.qr-note { font-size: 0.72rem; color: var(--text-secondary); text-align: center; }

/* ── Actions ── */
.actions {
  display: flex; flex-direction: column;
  gap: 0.6rem; margin-top: 1.25rem;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* ── Notice ── */
.notice {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  font-size: 0.82rem; color: var(--text-secondary); line-height: 1.75;
  margin-top: 1rem;
}
.notice strong { color: var(--text-primary); font-weight: 500; }
</style>
</head>
<body>

<div class="aurora-wrap">
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
</div>

<header class="header">
  <div class="header-inner">
    <a href="/" class="logo"><img src="/assets/jazzin_logo.png" alt="JAZZIN" height="26"></a>
  </div>
</header>

<div id="toast"></div>

<div class="confirm-page">
  <div id="loading" style="text-align:center;padding:4rem 0">
    <div class="spinner" style="margin:0 auto"></div>
    <p style="margin-top:1rem;font-size:0.875rem">予約情報を取得中...</p>
  </div>

  <div id="main-content" style="display:none">
    <div class="confirm-header">
      <div class="check-icon">✓</div>
      <div class="confirm-title">予約完了</div>
      <p class="confirm-subtitle">Reservation Confirmed</p>
    </div>

    <div id="capture-target" class="confirm-card">
      <!-- ① 座席番号ヒーロー（最大表示） -->
      <div class="seat-hero">
        <div class="seat-hero-label">Your Seat</div>
        <div class="seat-hero-value" id="hero-seats">--</div>
        <div class="seat-hero-count" id="hero-count"></div>
      </div>

      <!-- ② 詳細情報 -->
      <div class="confirm-body" id="rsv-details"></div>

      <!-- ③ QR -->
      <div class="qr-section">
        <div class="qr-box" id="qr-container"></div>
        <p class="qr-note">受付でこのQRコードをご提示ください</p>
      </div>
    </div>

    <div class="notice">
      <strong>当日の流れ</strong><br>
      ① QRコードを受付スタッフに提示<br>
      ② 現金でチケット料金をお支払い<br>
      ③ 入場・お席へどうぞ<br><br>
      <strong>注意：</strong> QR提示のみでは入場できません。必ず現金支払い後に入場となります。
    </div>

    <div class="actions">
      <button class="btn btn-primary btn-full btn-lg" id="btn-save">📥 画像として保存</button>
      <a id="btn-calendar" href="#" class="btn btn-ghost btn-full" target="_blank">📅 カレンダーに追加</a>
      <a id="btn-map" href="#" class="btn btn-ghost btn-full" target="_blank" style="display:none">🗺 会場をGoogle Mapで開く</a>
      <a href="/mypage.html" class="btn btn-ghost btn-full">🎫 予約マイページ</a>
      <a href="/" class="btn btn-ghost btn-full">← イベント一覧へ</a>
    </div>
  </div>
</div>

<script type="module">
import { supabase, formatDate, formatPrice } from '/core/supabase.js';

const params = new URLSearchParams(location.search);
const RESERVATION_ID = params.get('rid');
const QR_TOKEN       = params.get('token');
const RSV_CODE       = params.get('code');

// ✅ Edge FunctionのURL（あなたのプロジェクトID）
const EDGE_FUNCTION_URL = 'https://kzdsrysnngnfupmszzvz.supabase.co/functions/v1/send-confirmation-email';

function showToast(msg, ms=2000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

// ✅ Gmail API経由でメール送信（重複防止はサーバー側のDBフラグで管理）
async function sendConfirmEmail({ reservationId, toEmail, toName, eventTitle, eventAt, venueName, seats, numSeats, price, reservationCode, calendarUrl, notes }) {
  try {
    const res = await fetch(EDGE_FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        reservation_id: reservationId,   // ✅ 追加：サーバー側で重複送信を判定するために必須
        to_email: toEmail,
        to_name:  toName,
        variables: {
          guest_name:       toName,
          reservation_code: reservationCode,
          event_title:      eventTitle,
          event_at:         eventAt ? formatDate(eventAt) : '日時未定（決まり次第ご案内します）',
          venue_name:       venueName,
          seats:            seats,
          num_seats:        String(numSeats),
          price:            String(price * numSeats),
          qr_url:           `https://jazzin-application-system.pages.dev/confirm.html?rid=${RESERVATION_ID}&token=${QR_TOKEN}&code=${reservationCode}`,
          calendar_url:     calendarUrl || '',
          notes:            notes || '',
        },
      }),
    });
    const data = await res.json();
    if (data.success) {
      if (data.skipped) {
        console.log('メールは送信済みのためスキップしました');
      } else {
        console.log('予約確認メール送信完了');
      }
    } else {
      console.warn('メール送信失敗:', data.error);
    }
  } catch (err) {
    console.warn('メール送信エラー（予約は完了済み）:', err);
  }
}

async function loadReservation() {
  try {
    const { data: rsv, error } = await supabase
      .from('reservations')
      .select(`id, reservation_code, guest_name, guest_email, num_seats,
        event:events(id, title, event_at, venue_name, venue_address, ticket_price, notes),
        reservation_seats(seat:seats(label))`)
      .eq('id', RESERVATION_ID)
      .single();

    if (error || !rsv) throw new Error('not found');

    const ev    = rsv.event;
    const seats = rsv.reservation_seats.map(rs => rs.seat?.label).filter(Boolean).join('  ');
    const price = ev?.ticket_price || 500;

    // ── 座席ヒーロー（最大表示） ──
    document.getElementById('hero-seats').textContent = seats || '--';
    document.getElementById('hero-count').textContent =
      `${rsv.num_seats}名 · 当日現金 ${formatPrice(price * rsv.num_seats)}`;

    // ── 詳細テーブル（予約番号は控えめに） ──
    document.getElementById('rsv-details').innerHTML = `
      ${ev ? `
      <div class="confirm-row"><span class="confirm-row-label">イベント</span><span class="confirm-row-value">${ev.title}</span></div>
      <div class="confirm-row"><span class="confirm-row-label">日時</span><span class="confirm-row-value">${ev.event_at ? formatDate(ev.event_at) : '日時未定（決まり次第ご案内します）'}</span></div>
      <div class="confirm-row"><span class="confirm-row-label">会場</span><span class="confirm-row-value">${ev.venue_name}</span></div>` : ''}
      <div class="confirm-row"><span class="confirm-row-label">お名前</span><span class="confirm-row-value">${rsv.guest_name}</span></div>
      <div class="confirm-row rsv-row"><span class="confirm-row-label">予約番号</span><span class="confirm-row-value" id="rsv-code">${rsv.reservation_code}</span></div>`;

    if (ev?.venue_address) {
      const mapBtn = document.getElementById('btn-map');
      mapBtn.href = `https://maps.google.com/?q=${encodeURIComponent(ev.venue_address)}`;
      mapBtn.style.display = 'flex';
    }

    // カレンダーURL生成
    let calendarUrl = '';
    if (ev?.event_at) {
      const start = new Date(ev.event_at);
      const end   = new Date(start.getTime() + 3*60*60*1000);
      const fmt   = d => d.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
      calendarUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(ev.title)}&dates=${fmt(start)}/${fmt(end)}&location=${encodeURIComponent(ev.venue_name||'')}`;
      document.getElementById('btn-calendar').href = calendarUrl;
    }

    renderQR(QR_TOKEN);

    // ✅ Gmail API経由でメール送信
    // sessionStorageでのチェックは廃止（サーバー側のDBフラグで確実に1回だけ送信される）
    sendConfirmEmail({
      reservationId:   RESERVATION_ID,
      toEmail:         rsv.guest_email,
      toName:          rsv.guest_name,
      eventTitle:      ev?.title || '',
      eventAt:         ev?.event_at || '',
      venueName:       ev?.venue_name || '',
      seats,
      numSeats:        rsv.num_seats,
      price,
      reservationCode: rsv.reservation_code,
      calendarUrl,
      notes:           ev?.notes || '',
    });

    // マイページ用にlocalStorageへ保存
    const myRsvs = JSON.parse(localStorage.getItem('jazzin_myreservations') || '[]');
    if (!myRsvs.find(r => r.id === RESERVATION_ID)) {
      myRsvs.push({ id: RESERVATION_ID, token: QR_TOKEN, code: rsv.reservation_code, createdAt: new Date().toISOString() });
      localStorage.setItem('jazzin_myreservations', JSON.stringify(myRsvs.slice(-10)));
    }

  } catch {
    // フォールバック: URLパラメータのみ
    document.getElementById('hero-seats').textContent = '--';
    document.getElementById('hero-count').textContent = '';
    const rsvEl = document.getElementById('rsv-code');
    if (rsvEl) rsvEl.textContent = RSV_CODE || '--';
    renderQR(QR_TOKEN);
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
}

function renderQR(token) {
  const container = document.getElementById('qr-container');
  container.innerHTML = '';
  new QRCode(container, {
    text: token, width:200, height:200,
    colorDark:'#000000', colorLight:'#ffffff',
    correctLevel: QRCode.CorrectLevel.M,
  });
}

document.getElementById('btn-save').addEventListener('click', async () => {
  const btn = document.getElementById('btn-save');
  const originalLabel = btn.textContent;
  btn.disabled = true; btn.textContent = '保存中...';
  try {
    const canvas = await html2canvas(document.getElementById('capture-target'), {
      backgroundColor:'#000d16', scale:2, logging:false,
    });

    const fileName = `jazzin-${RSV_CODE || 'ticket'}.png`;
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));

    // ✅ iOS/Android Safari 等: <a download> はカメラロールへの保存を起動できないため、
    //    Web Share API（ファイル共有）が使える場合はそちらを優先する。
    //    共有シートから「画像を保存」を選ぶと直接カメラロールに保存される。
    const file = blob ? new File([blob], fileName, { type: 'image/png' }) : null;
    const canUseShare = file && navigator.canShare && navigator.canShare({ files: [file] });

    if (canUseShare) {
      try {
        await navigator.share({ files: [file], title: 'JAZZIN チケット' });
        showToast('共有シートから保存できます');
      } catch (shareErr) {
        // ユーザーが共有をキャンセルした場合は何もしない
        if (shareErr?.name !== 'AbortError') {
          showToast('保存に失敗しました');
        }
      }
    } else {
      // デスクトップ等 Web Share 非対応環境ではこれまで通りダウンロードリンクを使用
      const url = blob ? URL.createObjectURL(blob) : canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.download = fileName;
      a.href = url;
      a.click();
      if (blob) setTimeout(() => URL.revokeObjectURL(url), 4000);
      showToast('画像を保存しました');
    }
  } catch {
    showToast('保存に失敗しました');
  }
  btn.disabled = false; btn.textContent = originalLabel;
});

loadReservation();
</script>
</body>
</html>
