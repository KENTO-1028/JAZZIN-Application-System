<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000a10">
<title>JAZZIN — 予約マイページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<link rel="stylesheet" href="/ui/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body { min-height:100dvh; }
.mypage { max-width:600px; margin:0 auto; padding:clamp(1.5rem,4vw,2.5rem) var(--page-px) 5rem; position:relative; z-index:1; }
.page-title {
  font-family:var(--font-ui);
  font-size:1.75rem; font-weight:700; letter-spacing:-0.02em;
  color:var(--text-primary);
  margin-bottom:0.25rem;
}
.page-sub { font-size:0.82rem; color:var(--text-secondary); margin-bottom:2rem; }
.rsv-card {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  overflow:hidden;
  margin-bottom:0.75rem;
  transition:border-color 120ms, background 120ms;
}
.rsv-card:hover { background:var(--bg-raised); border-color:var(--border-strong); }
.rsv-card-header {
  display:flex; justify-content:space-between; align-items:center;
  padding:0.875rem 1.1rem;
  border-bottom:1px solid var(--border);
  background:var(--bg-raised);
  cursor:pointer;
}
.rsv-code { font-family:var(--font-ui); font-size:1rem; font-weight:600; letter-spacing:-0.01em; color:var(--accent-1); }
.rsv-status-badge { font-size:0.7rem; }
.rsv-body { padding:0.875rem 1.1rem; }
.rsv-row { display:flex; justify-content:space-between; gap:0.5rem; font-size:0.85rem; padding:0.45rem 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.rsv-row:last-child { border-bottom:none; }
.rsv-row-label { color:var(--text-secondary); font-size:0.82rem; }
.rsv-row-value { color:var(--text-primary); font-weight:500; }
.qr-section { padding:1.1rem; border-top:1px solid var(--border); display:flex; flex-direction:column; align-items:center; gap:0.6rem; background:var(--bg-raised); }
.empty-state { text-align:center; padding:4rem 0; color:var(--text-secondary); }
.empty-icon { font-size:2rem; margin-bottom:0.75rem; opacity:0.4; }

/* 検索フォーム */
.search-form {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:0.9rem 1rem;
  margin-bottom:1.25rem;
}
.search-title {
  font-size:0.7rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--text-tertiary); margin-bottom:0.65rem;
}
.search-row { display:flex; gap:0.6rem; flex-wrap:wrap; }
.search-row .form-input { min-width:0; flex:1 1 160px; }
.search-row .btn { flex-shrink:0; }
.search-row.search-row-compact { flex-direction:row; }
.search-row-compact .form-input {
  padding:.45rem .7rem;
  font-size:16px; /* iOSの自動ズーム防止のため16px未満にはしない */
}
.search-row-compact .btn { padding:.45rem 1rem; }
@media (max-width:420px) {
  .search-row-compact { flex-direction:column; align-items:stretch; }
  .search-row-compact .form-input,
  .search-row-compact .btn { width:100%; }
}
</style>
<!-- Cloudflare Web Analytics -->
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "0b0a908e36ff4880a6867235b78b567b"}'></script>
<!-- End Cloudflare Web Analytics -->
</head>
<body>

<div class="aurora-wrap">
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
  <div class="aurora-blob"></div>
</div>

<header class="header">
  <div class="header-inner">
    <a href="/" class="logo"><img src="/assets/jazzin_logo.png" alt="JAZZIN" height="26"></a>
    <a href="/" class="btn btn-ghost btn-sm">← 一覧</a>
  </div>
</header>

<div id="toast"></div>

<div class="mypage">
  <div class="page-title">MY TICKETS</div>
  <p class="page-sub">予約の確認・QR再表示</p>

  <!-- 予約番号＋メールアドレスで検索（両方一致が必須） -->
  <div class="search-form">
    <p class="search-title">予約番号とメールアドレスで検索</p>
    <p style="font-size:0.72rem;color:var(--text-tertiary);margin:-0.3rem 0 0.7rem">
      他のお客様の予約情報を保護するため、両方の入力が必要です。
    </p>
    <div class="search-row search-row-compact">
      <input type="text" class="form-input" id="search-code" placeholder="予約番号（例：A-001）">
      <input type="email" class="form-input" id="search-email" placeholder="ご予約時のメールアドレス">
      <button class="btn btn-primary" id="btn-search">検索</button>
    </div>
  </div>

  <div id="rsv-list"></div>
</div>

<script type="module">
import { supabase, formatDate, formatPrice, getReservationSecure, findReservationByCodeEmail } from '/core/supabase.js';

function showToast(msg, ms=2000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

const list = document.getElementById('rsv-list');

function renderCard(rsv, expanded = false) {
  const ev     = rsv.event;
  const seats  = (rsv.seats || []).map(s => s.label).join('、') || '--';
  const price  = ev?.ticket_price || 500;
  const isChecked = !!rsv.checked_in;
  const isPaid    = rsv.payment_status === 'paid_cash';

  const card = document.createElement('div');
  card.className = 'rsv-card';
  card.dataset.id = rsv.id;

  card.innerHTML = `
    <div class="rsv-card-header" data-toggle="${rsv.id}">
      <div>
        <div class="rsv-code">${rsv.reservation_code}</div>
        <div style="font-size:0.75rem;color:var(--text-secondary);margin-top:2px">${ev?.title || ''}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span class="badge rsv-status-badge ${isChecked ? 'badge-ok' : 'badge-few'}">${isChecked ? '入場済' : '未入場'}</span>
        <span class="badge rsv-status-badge ${isPaid ? 'badge-ok' : 'badge-sold'}">${isPaid ? '支払済' : '当日払い'}</span>
      </div>
    </div>
    <div class="rsv-body" id="body-${rsv.id}" style="${expanded ? '' : 'display:none'}">
      ${ev ? `
      <div class="rsv-row"><span class="rsv-row-label">日時</span><span class="rsv-row-value">${formatDate(ev.event_at)}</span></div>
      <div class="rsv-row"><span class="rsv-row-label">会場</span><span class="rsv-row-value">${ev.venue_name}</span></div>` : ''}
      <div class="rsv-row"><span class="rsv-row-label">座席</span><span class="rsv-row-value">${seats}</span></div>
      <div class="rsv-row"><span class="rsv-row-label">人数</span><span class="rsv-row-value">${rsv.num_seats} 名</span></div>
      <div class="rsv-row"><span class="rsv-row-label">料金</span><span class="rsv-row-value" style="color:var(--accent-1)">${formatPrice(price * rsv.num_seats)}</span></div>
    </div>
    <div class="qr-section" id="qr-${rsv.id}" style="${expanded ? '' : 'display:none'}">
      <div class="qr-box" id="qrbox-${rsv.id}"></div>
      <p style="font-size:0.7rem;color:var(--text-secondary)">受付でこのQRをご提示ください</p>
      <a href="/confirm.html?rid=${rsv.id}&token=${rsv.qr_token}&code=${rsv.reservation_code}"
         class="btn btn-ghost btn-sm">予約完了ページを開く</a>
      ${rsv.status !== 'cancelled' ? `
      <a href="/cancel-request.html?rid=${rsv.id}&token=${rsv.qr_token}"
         class="btn btn-ghost btn-sm" style="color:var(--text-tertiary);font-size:0.75rem">予約をキャンセルしたい場合はこちら</a>` : ''}
    </div>`;

  // Toggle
  card.querySelector(`[data-toggle="${rsv.id}"]`).addEventListener('click', () => {
    const body = document.getElementById(`body-${rsv.id}`);
    const qr   = document.getElementById(`qr-${rsv.id}`);
    const open = body.style.display !== 'none';
    body.style.display = open ? 'none' : 'block';
    qr.style.display   = open ? 'none' : 'flex';
    if (!open) renderQR(rsv.qr_token, `qrbox-${rsv.id}`);
  });

  if (expanded) renderQR(rsv.qr_token, `qrbox-${rsv.id}`);
  return card;
}

function renderQR(token, containerId) {
  const el = document.getElementById(containerId);
  if (!el || el.innerHTML.trim()) return;
  new QRCode(el, { text:token, width:160, height:160, colorDark:'#000', colorLight:'#fff', correctLevel:QRCode.CorrectLevel.M });
}

async function loadFromLocal() {
  const saved = JSON.parse(localStorage.getItem('jazzin_myreservations') || '[]');
  if (!saved.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">🎫</div><p>このブラウザでの予約が見つかりません</p><p style="margin-top:0.5rem;font-size:0.8rem">下の検索フォームから予約番号とメールアドレスで検索できます</p></div>`;
    return;
  }

  // ✅ id + qr_token の両方一致が必須の安全なRPCで、1件ずつ取得する
  //    （このブラウザで予約した記録＝token を保持しているものだけを表示できる）
  const results = await Promise.all(
    saved.map(r => getReservationSecure(r.id, r.token).catch(() => null))
  );
  const data = results.filter(r => r?.success);

  if (!data.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">🎫</div><p>予約が見つかりません</p></div>`;
    return;
  }
  list.innerHTML = '';
  data
    .sort((a, b) => (b.event?.event_at || '').localeCompare(a.event?.event_at || ''))
    .forEach((rsv, i) => list.appendChild(renderCard(rsv, i === 0)));
}

async function searchReservations(code, email) {
  if (!code.trim() || !email.trim()) {
    showToast('予約番号とメールアドレスの両方をご入力ください');
    return;
  }

  list.innerHTML = '<div style="text-align:center;padding:2rem"><div class="spinner" style="margin:0 auto"></div></div>';

  // ✅ 予約番号とメールアドレスの両方が一致した場合のみ返す安全なRPC。
  //    どちらか一方だけでは他人の予約は絶対に引き当てられない。
  const result = await findReservationByCodeEmail(code.trim(), email.trim()).catch(() => null);

  list.innerHTML = '';
  if (!result?.success) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><p>該当する予約が見つかりません</p><p style="margin-top:0.5rem;font-size:0.8rem">予約番号・メールアドレスをご確認ください</p></div>`;
    return;
  }
  list.appendChild(renderCard(result, true));
}

document.getElementById('btn-search').addEventListener('click', () => {
  searchReservations(document.getElementById('search-code').value, document.getElementById('search-email').value);
});
[document.getElementById('search-code'), document.getElementById('search-email')].forEach(el => {
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') searchReservations(document.getElementById('search-code').value, document.getElementById('search-email').value);
  });
});

// URL パラメータから直接表示（rid・token の両方が必須）
const params = new URLSearchParams(location.search);
const rid = params.get('rid');
const rtoken = params.get('token');
if (rid && rtoken) {
  getReservationSecure(rid, rtoken).then(result => {
    if (result?.success) { list.innerHTML = ''; list.appendChild(renderCard(result, true)); }
    else loadFromLocal();
  }).catch(() => loadFromLocal());
} else {
  loadFromLocal();
}
</script>
</body>
</html>
